document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

onclick=\"toggleDark()\" id=\"darkBtn\">🌙<\u002Fbutton>\n    <span class=\"user-pill\" id=\"userPill\" style=\"display:none;\" onclick=\"handleSignOut()\">···<\u002Fspan>\n    <span class=\"user-pill\" id=\"signInPill\" style=\"display:none;\" onclick=\"goPage('auth')\">Sign in<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MAIN -->\n<div class=\"page active\" id=\"page-main\">\n<div class=\"content\">\n  <div class=\"section-label\">My medications<\u002Fdiv>\n  <div class=\"tab-bar\" id=\"mainTabs\"><\u002Fdiv>\n  <div id=\"nowBanner\" style=\"display:none;\"><\u002Fdiv>\n  <div id=\"logBtnWrap\"><\u002Fdiv>\n  <div class=\"tl-wrap\" id=\"tlWrap\" style=\"display:none;\">\n    <div class=\"tl-label\" id=\"tlLabel\"><\u002Fdiv>\n    <div class=\"tl-rows\" id=\"tlRows\">\n      <div id=\"tlNow\" class=\"tl-now\" style=\"display:none;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tl-ticks\" id=\"tlTicks\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" id=\"inputCard\">\n    <div id=\"doseArea\"><\u002Fdiv>\n    <div id=\"revArea\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"zonesOut\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<!-- LOG MODAL -->\n<div class=\"log-modal-bg\" id=\"logModalBg\" onclick=\"closeLogModal(event)\">\n  <div class=\"log-modal\" id=\"logModal\">\n    <h3 id=\"logModalTitle\">How are you feeling?<\u002Fh3>\n    <div class=\"log-modal-context\" id=\"logModalContext\"><\u002Fdiv>\n\n    <div class=\"log-modal-label\">Feeling (1–10):<\u002Fdiv>\n    <div class=\"feel-scale\" id=\"feelScale\"><\u002Fdiv>\n\n    <div class=\"log-modal-label\">Tags (tap to add):<\u002Fdiv>\n    <div id=\"tagRow\"><\u002Fdiv>\n\n    <textarea class=\"log-note\" id=\"logNoteInput\" rows=\"2\" placeholder=\"Optional note...\"><\u002Ftextarea>\n\n    <div class=\"log-modal-label\">Log time:<\u002Fdiv>\n    <div class=\"log-time-row\">\n      <input type=\"time\" id=\"logTimeInput\" oninput=\"document.getElementById('logTimeDisplay').textContent=to12(this.value)\">\n      <span id=\"logTimeDisplay\" class=\"log-time-display\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <button class=\"save-log-btn\" id=\"saveLogBtn\" onclick=\"saveLog()\">Save entry<\u002Fbutton>\n    <button class=\"cancel-log-btn\" onclick=\"closeLogModal()\">Cancel<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- LOG PAGE -->\n<div class=\"page\" id=\"page-log\">\n<div class=\"content\">\n  <div class=\"log-page-header\">\n    <h2 class=\"log-page-title\">Feeling Log<\u002Fh2>\n    <div style=\"display:flex;gap:6px;\">\n      <button class=\"nav-btn\" id=\"exportLogBtn\" onclick=\"exportLog()\">⬇ Export<\u002Fbutton>\n      <button class=\"nav-btn back-btn\" onclick=\"goPage('main')\">← Back<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <button class=\"log-cta-btn\" id=\"logPageBtn\" onclick=\"openLogModalFrom('log')\">+ Log how I feel right now<\u002Fbutton>\n\n  <!-- Drug filter tabs -->\n  <div class=\"tab-bar\" id=\"logDrugTabs\"><\u002Fdiv>\n\n  <!-- Stats summary -->\n  <div id=\"logStats\" style=\"margin-bottom:12px;\"><\u002Fdiv>\n\n  <!-- Streak + adherence -->\n  <div id=\"streakPanel\" style=\"margin-bottom:12px;\"><\u002Fdiv>\n\n  <!-- Calendar strip / month grid -->\n  <div id=\"calendarStrip\" style=\"margin-bottom:14px;\"><\u002Fdiv>\n\n  <!-- View mode + filter bar -->\n  <div class=\"log-view-controls\">\n    <div class=\"log-view-toggle\">\n      <button id=\"viewByDay\" class=\"log-view-btn active\" onclick=\"setLogView('day')\">By day<\u002Fbutton>\n      <button id=\"viewByCycle\" class=\"log-view-btn\" onclick=\"setLogView('cycle')\">By cycle<\u002Fbutton>\n    <\u002Fdiv>\n    <select id=\"logFilter\" class=\"log-filter-select\" onchange=\"renderLogList()\">\n      <option value=\"all\">All entries<\u002Foption>\n      <option value=\"high\">Feeling high (7+)<\u002Foption>\n      <option value=\"mid\">Feeling mid (4–6)<\u002Foption>\n      <option value=\"low\">Feeling low (1–3)<\u002Foption>\n      <option value=\"tagged\">Has tags<\u002Foption>\n      <option value=\"noted\">Has notes<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n\n  <!-- Pattern insights (collapsible) -->\n  <div id=\"insightsPanel\" style=\"margin-bottom:12px;\"><\u002Fdiv>\n\n  <!-- Log list -->\n  <div id=\"logList\"><\u002Fdiv>\n  <div id=\"logEmpty\" style=\"color:var(--ink-3);font-size:0.9em;text-align:center;padding:32px 0;display:none;\">No entries yet.<br>Tap the button above to add your first.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<!-- AUTH PAGE -->\n<div class=\"page\" id=\"page-auth\">\n  <div class=\"auth-wrap\">\n    <div style=\"margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:10px;\">\n      <svg width=\"72\" height=\"41\" viewBox=\"0 0 28 16\" xmlns=\"http://www.w3.org/2000/svg\">\n        <rect x=\"0\" y=\"0\" width=\"28\" height=\"16\" rx=\"8\" fill=\"#c070e8\"><\u002Frect>\n        <rect x=\"14\" y=\"0\" width=\"14\" height=\"16\" rx=\"0\" fill=\"#e0a8f8\"><\u002Frect>\n        <rect x=\"20\" y=\"0\" width=\"8\" height=\"16\" rx=\"8\" fill=\"#e0a8f8\"><\u002Frect>\n        <line x1=\"14\" y1=\"1\" x2=\"14\" y2=\"15\" stroke=\"white\" stroke-width=\"1.5\"><\u002Fline>\n        <circle cx=\"9\" cy=\"6.5\" r=\"1.2\" fill=\"white\"><\u002Fcircle>\n        <circle cx=\"13\" cy=\"6.5\" r=\"1.2\" fill=\"white\"><\u002Fcircle>\n        <circle cx=\"9.3\" cy=\"6.8\" r=\"0.55\" fill=\"#7a1fa0\"><\u002Fcircle>\n        <circle cx=\"13.3\" cy=\"6.8\" r=\"0.55\" fill=\"#7a1fa0\"><\u002Fcircle>\n        <ellipse cx=\"7\" cy=\"9.5\" rx=\"1.5\" ry=\"0.8\" fill=\"#f0c8ff\" opacity=\"0.7\"><\u002Fellipse>\n        <ellipse cx=\"15\" cy=\"9.5\" rx=\"1.5\" ry=\"0.8\" fill=\"#f0c8ff\" opacity=\"0.7\"><\u002Fellipse>\n        <path d=\"M8.5 9.5 Q11 12 13.5 9.5\" stroke=\"white\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n      <\u002Fsvg>\n      <h2 style=\"margin:0;font-size:1.6em;\">Grind-Zone<\u002Fh2>\n    <\u002Fdiv>\n    <!-- Step 1: email -->\n    <div id=\"authStep1\">\n      <p style=\"color:#888;font-size:0.9em;margin:0 0 16px 0;\">Sign in to sync your logs across devices.<\u002Fp>\n      <input class=\"auth-input\" type=\"email\" id=\"authEmail\" placeholder=\"your@email.com\" onkeydown=\"if(event.key==='Enter') sendCode()\">\n      <button class=\"auth-btn\" id=\"authBtn\" onclick=\"sendCode()\">Track my stats<\u002Fbutton>\n      <div class=\"auth-msg\" id=\"authMsg\"><\u002Fdiv>\n      <div class=\"auth-divider\">— or —<\u002Fdiv>\n      <button class=\"auth-btn\" style=\"background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);box-shadow:none;\" onclick=\"continueAsGuest()\">Continue without account<\u002Fbutton>\n      <p style=\"margin-top:16px;font-size:0.75em;color:#bbb;\">A 6-digit code will be sent to your email.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Step 2: enter code -->\n    <div id=\"authStep2\" style=\"display:none;\">\n      <p style=\"color:#555;font-size:0.92em;margin:0 0 4px 0;\">Check your email for a 6-digit code.<\u002Fp>\n      <p id=\"authCodeEmail\" style=\"color:var(--brand);font-size:0.88em;font-weight:600;margin:0 0 16px 0;\"><\u002Fp>\n      <input class=\"auth-input\" type=\"number\" id=\"authCode\" placeholder=\"123456\" style=\"font-size:1.6em;text-align:center;letter-spacing:0.15em;\" onkeydown=\"if(event.key==='Enter') verifyCode()\" oninput=\"if(this.value.length>=6) verifyCode()\">\n      <button class=\"auth-btn\" id=\"verifyBtn\" onclick=\"verifyCode()\" style=\"margin-top:8px;\">Verify<\u002Fbutton>\n      <div class=\"auth-msg\" id=\"authMsg2\"><\u002Fdiv>\n      <div style=\"margin-top:14px;display:flex;justify-content:space-between;font-size:0.82em;\">\n        <span style=\"color:var(--ink-3);cursor:pointer;\" onclick=\"backToEmail()\">← Different email<\u002Fspan>\n        <span style=\"color:var(--brand-ink);cursor:pointer;font-weight:500;\" onclick=\"resendCode()\">Resend code<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"disclaimer-text\">Grind-Zone is not medical advice. For emergencies, call 988 or contact your doctor.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MED SELECT -->\n<div class=\"page\" id=\"page-drugs\">\n<div class=\"content\">\n  <div class=\"page-hdr\">\n    <h2>My Medications<\u002Fh2>\n    <button class=\"nav-btn back-btn\" onclick=\"goPage('main')\">← Back<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"page-subhead\">Choose which medications to show on your dashboard.<\u002Fp>\n  <div class=\"drug-grid\" id=\"drugGrid\"><\u002Fdiv>\n  <button class=\"ob-primary-btn\" style=\"margin-top:10px;\" onclick=\"goPage('main')\">Done ✓<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ONBOARDING -->\n<div class=\"page\" id=\"page-onboarding\">\n<div class=\"content\" style=\"max-width:480px;\">\n\n  <!-- Screen 1: Drug picker -->\n  <div id=\"ob-screen-1\">\n    <div style=\"margin-bottom:16px;\">\n      <div class=\"ob-step-label\">Step 1 of 2<\u002Fdiv>\n      <h2 class=\"ob-title\">Which medications do you take?<\u002Fh2>\n      <p class=\"ob-body\">Select all that apply.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"drug-grid\" id=\"obDrugGrid\"><\u002Fdiv>\n    <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:8px;\">\n      <button class=\"ob-primary-btn\" onclick=\"obNext()\">Next →<\u002Fbutton>\n      <button class=\"nav-btn ob-skip-btn\" onclick=\"finishOnboarding()\">Skip<\u002Fbutton>\n      <p class=\"ob-hint\">You can change your meds anytime in the Meds tab.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Screen 2: Treatment start dates (only shown for slow-build drugs) -->\n  <div id=\"ob-screen-2\" style=\"display:none;\">\n    <div style=\"margin-bottom:16px;\">\n      <div class=\"ob-step-label\">Step 2 of 2<\u002Fdiv>\n      <h2 class=\"ob-title\">When did you start?<\u002Fh2>\n      <p class=\"ob-body\">These medications take weeks to reach full effect. Your start date lets the app show where you are in treatment.<\u002Fp>\n    <\u002Fdiv>\n    <div id=\"obStartDates\"><\u002Fdiv>\n    <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:8px;\">\n      <button class=\"ob-primary-btn\" onclick=\"finishOnboarding()\">Done ✓<\u002Fbutton>\n      <button class=\"nav-btn ob-skip-btn\" onclick=\"obBack()\">← Back<\u002Fbutton>\n      <button class=\"nav-btn ob-skip-btn\" onclick=\"finishOnboarding()\">Skip<\u002Fbutton>\n      <p class=\"ob-hint\">You can change your meds anytime in the Meds tab.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- README -->\n<div class=\"page\" id=\"page-curve\">\n<div class=\"content\">\n  <div class=\"page-hdr\">\n    <h2>Your Curve<\u002Fh2>\n    <button class=\"nav-btn back-btn\" onclick=\"goPage('main')\">← Back<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"curvePageContent\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page\" id=\"page-readme\">\n<div class=\"content\">\n  <div class=\"page-hdr\">\n    <h2>Settings<\u002Fh2>\n    <button class=\"nav-btn back-btn\" onclick=\"goPage('main')\">← Back<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"readme-body\">\n\n    <div id=\"settingsAccountSection\"><\u002Fdiv>\n\n    <h3>What is this?<\u002Fh3>\n    <p>Grind-Zone is a medication timing and mood tracking tool built around real pharmacokinetic data. Enter when you took your pill — see exactly what zone you're in, when your peak hits, and when things wind down. Log how you feel throughout the day and the app slowly learns your personal timing.<\u002Fp>\n\n    <h3>Why it exists<\u002Fh3>\n    <p>Built for personal use. Couldn't find anything that actually explained what was happening in your brain at 2pm vs 8am, or what Wellbutrin and Remeron are doing to each other when both are active. So this got built instead.<\u002Fp>\n\n    <h3>Medications covered<\u002Fh3>\n    <ul>\n      <li><strong>Ritalin LA<\u002Fstrong> — stimulant, bimodal release (IR + delayed beads), two distinct peaks, ~10hr window<\u002Fli>\n      <li><strong>Concerta 27mg<\u002Fstrong> — stimulant, OROS osmotic pump, continuously ascending curve, peak at 6–9hrs<\u002Fli>\n      <li><strong>Wellbutrin XL<\u002Fstrong> — NDRI antidepressant, long single arc, peak zone 5–14hrs, 21hr half-life<\u002Fli>\n      <li><strong>Lamictal 50mg<\u002Fstrong> — mood stabilizer, sodium channel blocker, 29hr half-life, cumulative therapeutic effect<\u002Fli>\n      <li><strong>Remeron 7.5mg<\u002Fstrong> — NaSSA antidepressant/sleep aid, peak sedation at ~2hrs, half-life adjusted for biological sex (26hr male / 37hr female)<\u002Fli>\n    <\u002Ful>\n\n    <h3>Combination tracking<\u002Fh3>\n    <p>When Wellbutrin and Remeron are both active, the app detects the interaction state and shows a live <strong>⚗️ x + y = z<\u002Fstrong> panel — what the two drugs are doing to each other right now, which neurotransmitters are elevated, what to expect, and what to watch for. Based on published pharmacodynamics research including Blier 2010 (46% vs 25% remission RCT) and mirtazapine α2 blockade mechanisms. Logs made during combo state are attributed to the combo, not either drug individually.<\u002Fp>\n\n    <h3>Feeling log + adaptive calibration<\u002Fh3>\n    <p>Log how you feel (1–10) at any point in the day. After 6 entries with elapsed time data, the app starts calibrating your personal peak timing — using exponential decay weighting (recent entries count more), a pharmacokinetic anchor prior (defaults resist change until real data outweighs them), and per-drug shift ceilings based on published Tmax variability ranges (±2hr for Ritalin/Concerta/Wellbutrin, ±1.5hr for Lamictal/Remeron). Zone boundaries, the now-banner, and the timeline all update to reflect your data.<\u002Fp>\n\n    <h3>Log organization<\u002Fh3>\n    <p>Logs are grouped by day (3am rollover — late nights stay with the right day) or by cycle phase. A 30-day calendar strip shows feel score dots per day. Filter by feel level, tags, or notes. The day view shows your dose schedule as badges. The cycle view groups by zone — useful for seeing patterns like \"I always score low during Trough.\"<\u002Fp>\n\n    <h3>Accounts + sync<\u002Fh3>\n    <p>Sign in with a magic link (no password). Logs sync to a private Postgres database via Supabase — Row Level Security enforced at the database level, not just app code. Dose times stay local (localStorage) since they're session-specific. Guest mode available — logs stay in browser only.<\u002Fp>\n\n    <h3>Technical notes<\u002Fh3>\n    <ul>\n      <li>Single HTML file — no framework, no build step, no dependencies<\u002Fli>\n      <li>Backend: Supabase (Postgres + Auth)<\u002Fli>\n      <li>Adaptive algorithm: weighted histogram, exponential decay, pharmacokinetic prior, per-drug Tmax ceiling<\u002Fli>\n      <li>Day boundary: 3am rollover — doses clear automatically, new day starts fresh<\u002Fli>\n      <li>30-second live ticker for zone updates<\u002Fli>\n      <li>Shareable URL — encodes your dose schedule as query params<\u002Fli>\n    <\u002Ful>\n\n    <h3>Disclaimer<\u002Fh3>\n    <p>Not medical advice. Pharmacokinetic timings are based on published data and vary between individuals. Adaptive calibration reflects your logged experience, not clinical guidance. Always follow your prescriber's instructions.<\u002Fp>\n\n    <h3>Share your schedule<\u002Fh3>\n    <input class=\"share-url\" id=\"shareUrl\" readonly=\"\">\n    <button class=\"copy-btn\" onclick=\"copyShare()\">Copy link<\u002Fbutton>\n    <div id=\"copyConfirm\" style=\"font-size:0.83em;color:green;margin-top:4px;display:none;\">✓ Copied!<\u002Fdiv>\n\n    <p class=\"disclaimer-text\">Grind-Zone is not medical advice. For emergencies, call 988 or contact your doctor.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ─── DATA ─────────────────────────────────────────────────────────────────────\nconst DRUGS = {\n  ritalin: {\n    name:'Ritalin LA', short:'Ritalin', cls:'r', color:'#c070e8', light:'#fdeeff',\n    rev:[\n      {lbl:'Want First Peak at:', off:1.5, desc:'First Peak', id:'rv-r1'},\n      {lbl:'Want Second Peak at:', off:5, desc:'Second Peak', id:'rv-r2'}\n    ],\n    zones:[\n      {start:0,end:1,label:\"Onset\",power:\"2–3 / 10\",tl:'#e8cfff',\n       notes:[\"IR beads (50% of dose) beginning to dissolve\",\"No dopamine or norepinephrine activity yet\",\"Some feel a faint shift within 30 min — others nothing\",\"Appetite suppression often starts before mental effects\",\"Don't judge the medication here\"],tag:\"First pulse loading up.\"},\n      {start:1,end:2,label:\"First Peak ⭐\",power:\"7–8 / 10\",peak:true,tl:'#9b30d8',\n       notes:[\"IR beads fully absorbed — blood level at first peak\",\"Dopamine and norepinephrine reuptake blocked most strongly\",\"Focus sharpens noticeably — hard tasks feel easier to start\",\"Internal 'I'll do it later' resistance drops significantly\",\"Best window for demanding creative or cognitive work\",\"Heart rate gently elevated — normal and expected\"],tag:\"First wave of cognitive horsepower.\"},\n      {start:2,end:4,label:\"Trough\",power:\"4–6 / 10\",tl:'#ddb8f0',\n       notes:[\"IR dose metabolized, delayed beads not yet released\",\"Focus dips noticeably — pharmacologically normal for LA\",\"Not a crash — just the valley between two distinct pulses\",\"Best for: breaks, food, emails, low-intensity tasks\",\"Some people feel this more than others — ride it out\"],tag:\"Pause between waves — hold steady.\"},\n      {start:4,end:6,label:\"Second Peak ⭐\",power:\"7–8 / 10\",second:true,tl:'#b040e8',\n       notes:[\"Delayed-release beads (50% of dose) now fully absorbing\",\"Second dopamine/norepinephrine surge — often feels like a fresh dose\",\"Focus rebounds to near-peak levels\",\"Great for afternoon work, studying, or structured tasks\",\"Slightly softer than first peak for most people\"],tag:\"Second wind. Use it.\"},\n      {start:6,end:8,label:\"Plateau\",power:\"5–7 / 10\",third:true,tl:'#c880e8',\n       notes:[\"Second peak leveling — still meaningfully active\",\"Sustained focus, less sharp but solid\",\"Good for: review, reading, meetings, routine tasks\",\"Where Ritalin LA outlasts IR — this window doesn't exist on IR\",\"Distractibility slowly returning but manageable\"],tag:\"LA's lasting advantage over IR.\"},\n      {start:8,end:10,label:\"Taper\",power:\"3–5 / 10\",tl:'#e0c0f0',\n       notes:[\"Methylphenidate half-life ~2–3 hrs — most drug clearing\",\"Focus requires more active effort now\",\"Better for: review, admin, passive reading\",\"Mood may dip slightly as norepinephrine drops\",\"Avoid caffeine to compensate — tends to worsen comedown\"],tag:\"Gradual landing.\"},\n      {start:10,end:Infinity,label:\"Baseline\",power:\"2–3 / 10\",tl:'#f0e8ff',\n       notes:[\"Methylphenidate essentially cleared from system\",\"Your ADHD baseline is returning — this is just your brain\",\"Mental fatigue likely after a long active window\",\"Appetite returns strongly — eat something real\",\"Sleep window open now — drug won't interfere\"],tag:\"Time to recover. You did the work.\"}\n    ]\n  },\n  wellbutrin: {\n    name:'Wellbutrin XL', short:'Wellbutrin', cls:'w', color:'#5577d4', light:'#eef1ff',\n    rev:[{lbl:'Want peak at:', off:6, desc:'Peak Zone', id:'rv-w1'}],\n    doses: [\n      {mg:150, label:'150mg', note:'Starting dose — first 1–2 weeks, or long-term if effective'},\n      {mg:300, label:'300mg', note:'Standard therapeutic dose — maintenance for most'},\n      {mg:450, label:'450mg', note:'Max dose — stronger NE/DA, higher seizure risk'},\n    ],\n    zonesByDose: {\n      150: [\n        {start:0,end:2,label:\"Absorbing\",power:\"2–3 / 10\",tl:'#d0d8f8',\n         notes:[\"150mg XL: Tmax ~5hr — XL formulation slows absorption significantly vs IR/SR\",\"Bioavailability 68% for XL — lower than IR but sustained throughout the day\",\"CYP2B6 begins converting bupropion to hydroxybupropion — the primary active metabolite\",\"At 150mg, plasma concentration is approximately half of the 300mg dose\",\"No meaningful NE/DA effect yet — drug still distributing\"],tag:\"Loading. Drug absorbing before effects begin.\"},\n        {start:2,end:5,label:\"Building\",power:\"3–5 / 10\",tl:'#a0b0e8',third:true,\n         notes:[\"NE/DA reuptake inhibition beginning as plasma levels rise\",\"At 150mg, the building phase is gentler than 300mg — less likely to feel jittery or anxious\",\"Some report faint increased alertness or slightly elevated mood here\",\"Hydroxybupropion (the key metabolite) still accumulating — full effect builds over days\",\"150mg is the standard starting dose precisely because this curve is tolerable\"],tag:\"Gentle build. 150mg is the starter for a reason.\"},\n        {start:5,end:9,label:\"Peak Zone ⭐\",power:\"5–7 / 10\",peak:true,tl:'#4055bb',\n         notes:[\"Tmax ~5hr — plasma concentration at daily maximum for 150mg dose\",\"NE and DA reuptake substantially blocked — focus, motivation, and mood elevated\",\"At 150mg, peak effect is real but moderate — approximately half the plasma of 300mg\",\"Energy increase common: more motivation, easier task initiation, reduced fatigue\",\"Less appetite suppression than 300mg — weight effects milder at this dose\",\"Anxiety risk lower than at higher doses — good first-dose check for CYP2B6 slow metabolizers\"],tag:\"150mg peak — real effect, moderate intensity.\"},\n        {start:9,end:16,label:\"Active Plateau\",power:\"4–6 / 10\",second:true,tl:'#7088d8',\n         notes:[\"Hydroxybupropion half-life ~20hr — still highly active well into the afternoon\",\"150mg produces a smoother, flatter plateau than higher doses\",\"Focus and mood remain steady if the dose is working — no sharp drop\",\"At steady state (8 days), the plateau deepens as hydroxybupropion accumulates\",\"Some people find 150mg enough; others need to increase to 300mg for full effect\"],tag:\"Steady and even. 150mg's big advantage is smoothness.\"},\n        {start:16,end:24,label:\"Taper\",power:\"2–4 / 10\",tl:'#b0b8e8',\n         notes:[\"Plasma declining but hydroxybupropion still active for hours\",\"At 150mg, evening taper is gentle — unlikely to crash\",\"Half-life ~21hr means drug is still well above zero at next morning's dose\",\"Take next dose in the morning — do not take 150mg after 3pm if sleep-sensitive\",\"Steady-state builds over 8 days — full antidepressant effect takes 4–6 weeks\"],tag:\"Gentle taper. Next dose tomorrow morning.\"},\n        {start:24,end:Infinity,label:\"Pre-Dose Trough\",power:\"1–3 / 10\",tl:'#d8ddf8',\n         notes:[\"At 150mg with 21hr half-life, ~40% plasma remaining at 24hrs — non-trivial\",\"Steady-state means drug doesn't fully clear between doses\",\"Pre-dose trough stabilizes after 8 days of consistent dosing\",\"If antidepressant effect feels insufficient at 2–4 weeks, discuss increasing to 300mg with doctor\",\"Do not increase dose without medical guidance — seizure risk is dose-dependent\"],tag:\"Trough. Tomorrow's dose brings this back up.\"}\n      ],\n      300: [\n        {start:0,end:2,label:\"Absorbing\",power:\"2–3 / 10\",tl:'#d0d8f8',\n         notes:[\"300mg XL: standard therapeutic dose — Tmax ~5hr for the XL formulation\",\"At 300mg, bioavailability 68% means ~200mg equivalent reaches circulation\",\"CYP2B6 converting bupropion to hydroxybupropion — the metabolite drives much of the antidepressant effect\",\"Hydroxybupropion AUC at 300mg is ~16× that of the parent compound — it is the real active drug\",\"No significant NE/DA effect yet — drug distributing and metabolizing\"],tag:\"Loading. The real active metabolite building up.\"},\n        {start:2,end:5,label:\"Building\",power:\"4–6 / 10\",tl:'#a0b0e8',third:true,\n         notes:[\"NE/DA reuptake inhibition increasing as bupropion and hydroxybupropion rise together\",\"At 300mg, this phase is noticeably more activating than 150mg\",\"Increased alertness, possible mild anxiety or jitteriness — especially in weeks 1–2\",\"Metabolism of bupropion is highly variable: same dose can produce 5.5× different plasma in different people\",\"CYP2D6 inhibition by bupropion also begins here — affects other medications metabolized by CYP2D6\"],tag:\"Active build. 300mg kicks in more noticeably than 150mg.\"},\n        {start:5,end:9,label:\"Peak Zone ⭐\",power:\"7–8 / 10\",peak:true,tl:'#4055bb',\n         notes:[\"Tmax ~5hr — plasma concentration at daily maximum for 300mg\",\"NE and DA reuptake inhibition at strongest — focus, motivation, and drive most elevated\",\"300mg is where most patients first notice the antidepressant and cognitive effects clearly\",\"Appetite suppression typically strongest in this window — meal timing matters\",\"Best window for cognitively demanding work — NE/DA both elevated, no serotonin sedation\",\"Heart rate and blood pressure slightly elevated — expected, monitor if cardiovascular history\"],tag:\"Peak. This is what 300mg is built to do.\"},\n        {start:9,end:16,label:\"Active Plateau\",power:\"6–7 / 10\",second:true,tl:'#7088d8',\n         notes:[\"Hydroxybupropion half-life ~20hr — still highly active well into afternoon\",\"300mg plateau is noticeably stronger and longer than 150mg\",\"Focus and mood stable — no stimulant-style crash\",\"Appetite suppression often persists through this window\",\"Steady state builds over 8 days — full antidepressant effect at 4–6 weeks\",\"Bupropion potently inhibits CYP2D6 — inform all prescribers about this interaction\"],tag:\"Steady, sustained, reliable. 300mg's defining quality.\"},\n        {start:16,end:24,label:\"Taper\",power:\"3–5 / 10\",tl:'#b0b8e8',\n         notes:[\"Plasma declining through the evening\",\"At 300mg, some people notice energy taper more than at 150mg\",\"Half-life 21hr — hydroxybupropion still very active through this window\",\"Do NOT take 300mg after 2pm — activating effects will disrupt sleep\",\"If taking 300mg and sleep is impaired, discuss splitting to 150mg twice daily with doctor\"],tag:\"Tapering. Consistent morning dosing essential.\"},\n        {start:24,end:Infinity,label:\"Pre-Dose Trough\",power:\"2–4 / 10\",tl:'#d8ddf8',\n         notes:[\"At 300mg with 21hr half-life, significant plasma remains at 24hrs\",\"Steady-state builds over 8 days — pre-dose trough stabilizes\",\"If antidepressant effect plateaus at 300mg after 4–6 weeks, discuss 450mg with doctor\",\"450mg is off-label but used for treatment-resistant cases — seizure risk increases meaningfully\",\"Bupropion has no discontinuation syndrome — but do not stop abruptly if stable\"],tag:\"Trough. Same time every morning.\"}\n      ],\n      450: [\n        {start:0,end:2,label:\"Absorbing\",power:\"3–4 / 10\",tl:'#d0d8f8',\n         notes:[\"450mg is the maximum FDA dose and is off-label for most indications beyond smoking cessation\",\"Tmax still ~5hr for XL formulation — same curve, significantly higher peak\",\"At 450mg, plasma and hydroxybupropion levels are 1.5× that of 300mg — meaningful escalation\",\"Seizure risk increases with dose: ~0.1% at 150–300mg, higher at 400–450mg — this is the primary ceiling\",\"450mg is typically only prescribed after confirmed inadequate response at 300mg\"],tag:\"Maximum dose. Stronger effect, elevated seizure risk.\"},\n        {start:2,end:5,label:\"Building\",power:\"5–7 / 10\",tl:'#a0b0e8',third:true,\n         notes:[\"450mg building phase noticeably more activating — anxiety, jitteriness, insomnia most likely here\",\"NE/DA reuptake inhibition increasing rapidly toward a higher plateau than 300mg\",\"Appetite suppression typically very strong — some patients cannot eat adequately without effort\",\"CYP2D6 inhibition is more substantial at 450mg — review all concurrent medications carefully\",\"If significant anxiety or tremor in this phase: contact prescriber — 450mg may not be tolerated\"],tag:\"Strong build. Watch for anxiety or tremor.\"},\n        {start:5,end:9,label:\"Peak Zone ⭐\",power:\"8–9 / 10\",peak:true,tl:'#4055bb',\n         notes:[\"450mg peak: NE/DA reuptake inhibition at maximum therapeutic intensity\",\"Energy, focus, drive, and motivation all near maximum — stronger than 300mg for most patients\",\"Used for treatment-resistant depression and ADHD where lower doses are insufficient\",\"Blood pressure and heart rate elevation most pronounced in this window — monitor if any cardiac history\",\"Some patients experience peak-dose anxiety, headache, or dry mouth near Tmax\",\"Most patients on 450mg dose at 6am or earlier to prevent sleep disruption\"],tag:\"Maximum NE/DA effect. Monitor blood pressure.\"},\n        {start:9,end:16,label:\"Active Plateau\",power:\"7–8 / 10\",second:true,tl:'#7088d8',\n         notes:[\"450mg plateau sustains strong NE/DA effect well into the afternoon\",\"Considerably stronger and more sustained than 300mg plateau\",\"Appetite suppression often all-day at this dose — intentional caloric intake important\",\"CYP2D6 inhibition at 450mg can significantly elevate co-administered medications (SSRIs, TCAs, beta-blockers)\",\"Sustained strong energy — some patients find this dose too activating and prefer 300mg instead\"],tag:\"Strongest sustained plateau. Very activating.\"},\n        {start:16,end:24,label:\"Taper\",power:\"4–6 / 10\",tl:'#b0b8e8',\n         notes:[\"Even at 450mg, taper is gradual due to 21hr half-life of hydroxybupropion\",\"Evening energy still noticeably elevated — sleep onset delayed is common\",\"Most patients on 450mg cannot take it after noon — morning dosing essential\",\"If sleep severely impaired at 450mg: discuss with doctor — some split to 300mg AM + 150mg noon\",\"Do not take second dose to compensate for perceived inadequate effect — seizure risk is dose-dependent\"],tag:\"Evening still activating. Morning dosing critical.\"},\n        {start:24,end:Infinity,label:\"Pre-Dose Trough\",power:\"3–5 / 10\",tl:'#d8ddf8',\n         notes:[\"At 450mg, pre-dose trough still has substantial drug present due to long half-life\",\"The antidepressant effect at 450mg builds over 4–6 weeks to full effect — do not judge too early\",\"Regular prescriber check-ins important at this dose — seizure risk monitoring, BP, and CYP2D6 interaction review\",\"If 450mg fails to produce adequate response after 6 weeks: typically time to consider different approach\",\"Never increase beyond 450mg — this is the hard ceiling for safety\"],tag:\"Trough. Never exceed 450mg.\"}\n      ]\n    },\n    get zones() { return this.zonesByDose[ST.wellbutrinDose||300] || this.zonesByDose[300]; }\n  },\n  lamictal: {\n    name:'Lamictal 50mg', short:'Lamictal', cls:'l', color:'#40b070', light:'#eefff4',\n    rev:[{lbl:'Want peak concentration at:', off:2, desc:'peak concentration', id:'rv-l1'}],\n    doses: [\n      {mg:25,  label:'25mg',  note:'Starting titration — sub-therapeutic, building tolerance'},\n      {mg:50,  label:'50mg',  note:'Low therapeutic — early stabilization'},\n      {mg:75,  label:'75mg',  note:'Mid-range — meaningful stabilization, sweet spot for many'},\n      {mg:100, label:'100mg', note:'Standard maintenance — full mood stabilizing effect'},\n      {mg:150, label:'150mg', note:'Upper standard — stronger coverage'},\n      {mg:200, label:'200mg', note:'Maximum standard dose'},\n    ],\n    zonesByDose: {\n      25: [\n        {start:0,end:1,label:\"Absorbing\",power:\"—\",tl:'#c8f0d8',\n         notes:[\"25mg is the standard titration start — intentionally sub-therapeutic\",\"98% bioavailability — all 25mg reaches bloodstream unchanged\",\"Sodium channel blocking far below therapeutic threshold at this dose\",\"No mood effects expected — this phase is purely about safety and tolerance\",\"Rash risk highest during escalation — never skip doses and double-up\"],tag:\"Titration. Safety first, effect comes later.\"},\n        {start:1,end:4,label:\"Peak Blood Level\",power:\"—\",peak:true,tl:'#30a060',\n         notes:[\"Tmax 1.4–4.8hr — plasma peaks but concentration minimal at 25mg\",\"Sodium channel binding very sparse — well below therapeutic CNS levels\",\"No mood stabilization expected at 25mg — completely normal\",\"Doctor will increase to 50mg after 2 weeks\",\"Some very sensitive individuals may notice a slight calmness — equally likely placebo\"],tag:\"Blood level peaks — but therapeutic effect near zero.\"},\n        {start:4,end:18,label:\"Low-Level Coverage\",power:\"—\",second:true,tl:'#88d4a8',\n         notes:[\"Drug present but well below therapeutic plasma range (target: 1–4 mg/L)\",\"No meaningful sodium channel stabilization at 25mg\",\"Half-life 22–37hr — drug accumulates with consistent daily dosing\",\"This accumulation means 50mg will be better tolerated after 2 weeks at 25mg\",\"Goal of 25mg phase: adapt, not treat\"],tag:\"Building tolerance. Effect comes at higher doses.\"},\n        {start:18,end:Infinity,label:\"Trough / Next Dose\",power:\"—\",tl:'#d4f0dc',\n         notes:[\"~50% plasma remaining at 24hrs due to long half-life\",\"Consistent same-time dosing critical during titration\",\"Missing doses during titration risks requiring full restart\",\"2 more weeks at 25mg, then increase to 50mg as directed\"],tag:\"Stay consistent. Titration is the most important phase.\"}\n      ],\n      50: [\n        {start:0,end:1,label:\"Absorbing\",power:\"—\",tl:'#c8f0d8',\n         notes:[\"Lamotrigine absorbs rapidly — 98% bioavailability, no first-pass metabolism\",\"Works by blocking voltage-gated sodium channels — not dopamine or serotonin\",\"No acute effect — stabilizes neuronal firing rather than exciting it\",\"At 50mg you are beginning to enter the therapeutic plasma range\",\"Effects are cumulative over weeks, not felt dose-by-dose\"],tag:\"Quietly getting into your system.\"},\n        {start:1,end:4,label:\"Peak Blood Level\",power:\"—\",peak:true,tl:'#30a060',\n         notes:[\"Plasma peaks 1.4–4.8hr (avg ~2–3hr at 50mg)\",\"Lamotrigine binding to sodium channels throughout brain tissue\",\"Sodium channel stabilization reducing excitatory glutamate/aspartate signaling\",\"At 50mg: early therapeutic range — effects build over weeks\",\"Some notice mild dizziness or visual blurring near peak — normal at 50mg\"],tag:\"Peak drug level — effects are cumulative not immediate.\"},\n        {start:4,end:10,label:\"Active Stabilization\",power:\"—\",second:true,tl:'#50b880',\n         notes:[\"Drug well above trough, sodium channels consistently occupied\",\"Neuronal membranes calmer — less glutamate excitatory noise\",\"Mood stabilization is not felt acutely — happens over weeks of sustained exposure\",\"At 50mg: subtle reduction in emotional reactivity may emerge after 2–4 weeks\",\"Mild cognitive side effects (brain fog, word-finding) possible early on — usually clears\"],tag:\"Stabilization building beneath the surface.\"},\n        {start:10,end:18,label:\"Sustained Coverage\",power:\"—\",third:true,tl:'#88d4a8',\n         notes:[\"Half-life 22–37hr means substantial drug active through the afternoon\",\"Sodium channel binding maintained continuously\",\"This is the invisible floor Lamictal builds over time\",\"At 50mg many don't feel much day-to-day — full effect typically requires higher doses\",\"Consistency of daily dosing matters more than timing\"],tag:\"Working in the background, not the foreground.\"},\n        {start:18,end:24,label:\"Trough Approaching\",power:\"—\",tl:'#b0e4c0',\n         notes:[\"Plasma declining but long half-life means no abrupt drop\",\"Mood protection continues through trough at steady state\",\"Missing a dose is more consequential than timing being slightly off\",\"Some split into 25mg AM / 25mg PM for smoother coverage\"],tag:\"Next dose will top this back up.\"},\n        {start:24,end:Infinity,label:\"Next Dose Due\",power:\"—\",tl:'#d4f0dc',\n         notes:[\"At 29hr half-life, ~50% plasma remaining at 24hrs — still active\",\"Lamictal never fully clears between doses at steady state\",\"Take next dose to maintain stable therapeutic levels\",\"Most doctors increase to 75–100mg after stabilizing at 50mg\"],tag:\"Same time every day.\"}\n      ],\n      75: [\n        {start:0,end:1,label:\"Absorbing\",power:\"—\",tl:'#c8f0d8',\n         notes:[\"75mg is a real and meaningful clinical dose — not just a step between 50 and 100mg\",\"Often the sweet spot for bipolar II augmentation: real effect, fewer side effects than 100mg\",\"Lamotrigine pharmacokinetics are linear — 75mg produces exactly 1.5× the plasma of 50mg\",\"98% bioavailability — sodium channel blocking begins within 30–60 minutes of absorption\"],tag:\"75mg — a meaningful mid-range dose.\"},\n        {start:1,end:4,label:\"Peak Blood Level\",power:\"—\",peak:true,tl:'#30a060',\n         notes:[\"Tmax 1.4–4.8hr — at 75mg, peak plasma ~50% higher than 50mg\",\"Linear pharmacokinetics: 75mg = 1.5× sodium channel density vs 50mg\",\"Sodium channel binding meaningfully more robust than lower doses\",\"Side effects near Tmax slightly more likely than at 50mg — dizziness, visual blur\",\"If consistent peak side effects: split into 37.5mg AM / 37.5mg PM or dose at night\"],tag:\"50% more coverage than 50mg.\"},\n        {start:4,end:10,label:\"Active Stabilization\",power:\"—\",second:true,tl:'#50b880',\n         notes:[\"75mg plasma well above the ~1 mg/L proposed therapeutic threshold\",\"Glutamate and aspartate excitatory transmission more substantially blunted than at 50mg\",\"Many bipolar II patients find 75mg the sweet spot — real effect, tolerable side effects\",\"Mood reactivity reduction and emotional steadiness building over weeks of consistent dosing\",\"Brain fog or word-finding issues may persist into weeks 2–4 — usually clears with adaptation\"],tag:\"Sweet spot for many — real effect, manageable side effects.\"},\n        {start:10,end:18,label:\"Sustained Coverage\",power:\"—\",third:true,tl:'#88d4a8',\n         notes:[\"Long half-life keeps coverage continuous through the day at 75mg\",\"The mood-stabilizing floor clearly present — neither high nor low\",\"Protection from hypomania and depressive dips building week by week\",\"Energy typically even — no activation, no sedation\",\"Some prescribers dose 75mg at night to avoid any daytime peak effects\"],tag:\"Steady, even coverage.\"},\n        {start:18,end:Infinity,label:\"Trough / Next Dose\",power:\"—\",tl:'#d4f0dc',\n         notes:[\"Half-life ~26–30hr — substantial plasma at 24hrs\",\"Trough well above therapeutic threshold at steady state\",\"75mg is a holding dose for some; others eventually increase to 100mg\",\"Consistent timing prevents plasma fluctuations that can affect mood stability\"],tag:\"Same time every day. Consistency is everything.\"}\n      ],\n      100: [\n        {start:0,end:1,label:\"Absorbing\",power:\"—\",tl:'#c8f0d8',\n         notes:[\"100mg is the standard target maintenance dose for bipolar disorder\",\"Full therapeutic plasma range (1–4 mg/L) reliably achieved at this dose\",\"Linear pharmacokinetics: exactly 2× the plasma concentration of 50mg\",\"Sodium channel stabilization now at full standard therapeutic intensity\"],tag:\"Standard therapeutic dose. Full effect territory.\"},\n        {start:1,end:4,label:\"Peak Blood Level\",power:\"—\",peak:true,tl:'#30a060',\n         notes:[\"Tmax 1.4–4.8hr — peak plasma 1–3 mg/L in most adults at 100mg\",\"Most therapeutically meaningful peak on this drug\",\"Side effects most likely near Tmax: dizziness, diplopia, ataxia, headache\",\"If peak side effects occur: split to 50mg AM / 50mg PM is standard management\",\"Dosing at night lets you sleep through the peak — effective strategy at 100mg\"],tag:\"Full therapeutic plasma. Side effects most likely near here.\"},\n        {start:4,end:10,label:\"Active Stabilization\",power:\"—\",second:true,tl:'#50b880',\n         notes:[\"100mg delivers robust sodium channel blockade throughout the day\",\"Glutamate/aspartate excitatory transmission substantially reduced\",\"Mood episode frequency measurably reduced in clinical trials at this dose\",\"Energy fairly flat — no activation, no sedation for most people\",\"Cognitive effects (memory, word-finding) improve after 4–6 weeks of adaptation\"],tag:\"Full mood stabilization underway.\"},\n        {start:10,end:18,label:\"Sustained Coverage\",power:\"—\",third:true,tl:'#88d4a8',\n         notes:[\"Half-life ensures near-constant plasma between doses at 100mg\",\"The mood-stabilizing floor fully established by weeks 4–6\",\"Emotional reactivity, irritability, and mood cycling frequency all reduced\",\"100mg is often a long-term maintenance dose — some stay here for years\",\"Lamictal does not cause tolerance at therapeutic doses — effect is sustained\"],tag:\"The invisible protective floor. Fully established.\"},\n        {start:18,end:Infinity,label:\"Trough / Next Dose\",power:\"—\",tl:'#d4f0dc',\n         notes:[\"At 29hr half-life, >50% plasma remaining at 24hrs\",\"Trough still within therapeutic range — no withdrawal between doses\",\"Missing one dose: recoverable — do not double up\",\"Missing multiple days: restart titration — never jump back to 100mg after >5 days off\",\"Same time daily is the gold standard for mood stability\"],tag:\"Consistent dosing protects the floor.\"}\n      ],\n      150: [\n        {start:0,end:1,label:\"Absorbing\",power:\"—\",tl:'#c8f0d8',\n         notes:[\"150mg is upper-range maintenance — 3× the plasma of 50mg\",\"Typically prescribed after tolerability confirmed at 100mg\",\"Used for bipolar I, treatment-resistant depression augmentation, or inadequate 100mg response\",\"Peak plasma concentration typically 1.5–4.5 mg/L — well into therapeutic zone\"],tag:\"Upper-range dose. Strong coverage.\"},\n        {start:1,end:4,label:\"Peak Blood Level\",power:\"—\",peak:true,tl:'#30a060',\n         notes:[\"Tmax 1.4–4.8hr — at 150mg, peak side effects most pronounced\",\"Diplopia, dizziness, headache, nausea — all most likely in this window\",\"If consistent side effects: split to 75mg AM / 75mg PM is standard\",\"Many patients take 150mg at bedtime to sleep through peak effects\",\"Do not increase further without guidance — 200mg is the max standard dose\"],tag:\"Peak plasma. Most patients dose at night at this level.\"},\n        {start:4,end:10,label:\"Active Stabilization\",power:\"—\",second:true,tl:'#50b880',\n         notes:[\"150mg: very strong sodium channel stabilization throughout the CNS\",\"Glutamate excitatory transmission substantially suppressed\",\"Mood episode frequency markedly reduced at this dose in clinical data\",\"Mild cognitive blunting possible at 150mg — slower processing, less verbal fluency\",\"Usually improves over months as adaptation occurs\"],tag:\"Strong, broad stabilization.\"},\n        {start:10,end:Infinity,label:\"Sustained Coverage\",power:\"—\",third:true,tl:'#88d4a8',\n         notes:[\"Half-life ensures near-constant plasma throughout 24hrs at 150mg\",\"Robust mood-stabilizing floor well-established\",\"Weight typically stable — no metabolic side effects unlike many mood stabilizers\",\"Some patients maintained at 150mg for years with good efficacy\",\"Adjust only with medical guidance\"],tag:\"Strong sustained coverage.\"}\n      ],\n      200: [\n        {start:0,end:1,label:\"Absorbing\",power:\"—\",tl:'#c8f0d8',\n         notes:[\"200mg is the maximum standard dose — 4× the plasma of 50mg\",\"FDA-approved maintenance ceiling for bipolar disorder\",\"Peak plasma levels typically 2–6 mg/L — near upper therapeutic range\",\"Some patients on enzyme-inducing drugs (carbamazepine, phenytoin) may need 400mg — specialist only\"],tag:\"Maximum standard dose.\"},\n        {start:1,end:4,label:\"Peak Blood Level\",power:\"—\",peak:true,tl:'#30a060',\n         notes:[\"Tmax 1.4–4.8hr — at 200mg, peak side effects most pronounced of any standard dose\",\"Dizziness, diplopia, ataxia, headache, nausea all most likely here\",\"Most patients at 200mg dose at bedtime to sleep through the peak\",\"If taking in the morning: avoid driving until past Tmax window\",\"Never take with alcohol — additive CNS depression at this dose level\"],tag:\"Peak plasma — most patients dose 200mg at bedtime.\"},\n        {start:4,end:10,label:\"Active Stabilization\",power:\"—\",second:true,tl:'#50b880',\n         notes:[\"200mg: maximum standard sodium channel blockade\",\"Mood stabilization effect maximal — greatest reduction in episode frequency\",\"Cognitive effects (processing speed, verbal fluency) possible — adaptation over months\",\"200mg is often the endpoint dose for bipolar I — maximally protective at standard range\",\"Regular blood levels not routine but warranted if toxicity symptoms appear\"],tag:\"Maximum standard protection.\"},\n        {start:10,end:Infinity,label:\"Sustained Coverage\",power:\"—\",third:true,tl:'#88d4a8',\n         notes:[\"Half-life ensures continuous therapeutic plasma throughout 24hrs at 200mg\",\"Protective mood floor fully maximized\",\"Decades of safety data in epilepsy and bipolar populations at this dose\",\"Annual prescriber check-ins recommended — dose reduction considered if stable for 2+ years\",\"Never stop abruptly — slow taper required to prevent seizure risk\"],tag:\"Maximum sustained coverage. Never stop abruptly.\"}\n      ]\n    },\n    get zones() { return this.zonesByDose[ST.lamictalDose||50] || this.zonesByDose[50]; }\n  }\n\n  ,concerta: {\n    name:'Concerta 27mg', short:'Concerta', cls:'c', color:'#e07030', light:'#fff3ee',\n    rev:[{lbl:'Want peak at:', off:7, desc:'Peak Zone', id:'rv-c1'}],\n    zones:[\n      {start:0, end:1, label:\"IR Overcoat\", power:\"2–3 / 10\", tl:'#f5d8c0',\n       notes:[\n         \"22% of the 27mg dose (≈6mg) is in the outer overcoat — dissolving right now\",\n         \"This immediate-release layer hits the bloodstream within 30–60 min\",\n         \"First small plasma peak occurs around 1 hour after dose\",\n         \"Noticeably gentler onset than Ritalin LA — no sharp initial kick\",\n         \"OROS doesn't frontload — it's designed to build, not spike\",\n         \"Appetite suppression may start here before cognitive effects are clear\"\n       ], tag:\"The primer coat. Just getting started.\"},\n      {start:1, end:3, label:\"Building\", power:\"4–6 / 10\", tl:'#e8b090', third:true,\n       notes:[\n         \"IR dose absorbed, osmotic pump now beginning steady release\",\n         \"Blood levels rising continuously — no plateau, no trough here\",\n         \"Mild but real improvement in focus and task initiation\",\n         \"This is where Concerta differs most from Ritalin LA — no valley between peaks\",\n         \"The ascending curve means you feel better at hour 3 than hour 1\",\n         \"Some people find mornings slightly slow on Concerta — this is why\",\n         \"Good for: easing into the day, moderate tasks, not demanding deep work yet\"\n       ], tag:\"Ascending. The curve keeps climbing.\"},\n      {start:3, end:6, label:\"Ascending Peak\", power:\"6–8 / 10\", tl:'#d87828', third:true,\n       notes:[\n         \"OROS osmotic pump delivering methylphenidate continuously and smoothly\",\n         \"No second surge feeling — just a steady, confident climb\",\n         \"Focus becoming reliable, working memory noticeably sharper\",\n         \"Task initiation easier — the prefrontal cortex getting strong signal\",\n         \"This window often feels smoother than Ritalin LA peaks — less 'edgy'\",\n         \"Good window for structured work, studying, meetings\"\n       ], tag:\"Smooth climb. This is Concerta's strength.\"},\n      {start:6, end:9, label:\"True Peak ⭐\", power:\"8–9 / 10\", tl:'#c05a10', peak:true,\n       notes:[\n         \"FDA-confirmed mean Tmax of 6.8 ± 1.8 hours — you are at or near peak plasma now\",\n         \"d-methylphenidate concentration at its highest — dopamine transporter occupancy maximal\",\n         \"This is Concerta's strongest cognitive window — it arrives late by design\",\n         \"Deep work, complex problem-solving, and sustained attention most accessible here\",\n         \"Many people are surprised the best effects come mid-to-late afternoon\",\n         \"Emotional regulation often noticeably improved in this window\",\n         \"Heart rate and blood pressure at highest point — expected and normal\"\n       ], tag:\"This is what you've been building toward all morning.\"},\n      {start:9, end:11, label:\"Plateau\", power:\"6–7 / 10\", tl:'#d88840', second:true,\n       notes:[\n         \"Peak passed but methylphenidate still well above therapeutic threshold\",\n         \"Half-life ~3.5hrs means roughly half the peak concentration still active\",\n         \"Focus solid and reliable — less sharp than peak, still very usable\",\n         \"Good for: afternoon tasks, review, writing, structured work\",\n         \"Better evening coverage than Ritalin LA at equivalent dose\",\n         \"Smoother decline than most stimulants — Concerta rarely crashes hard\"\n       ], tag:\"Still strong. Concerta's long tail working for you.\"},\n      {start:11, end:13, label:\"Taper\", power:\"3–5 / 10\", tl:'#e8b880',\n       notes:[\n         \"Drug clearing — about 10–12hr total therapeutic window\",\n         \"Focus requires noticeably more effort now\",\n         \"Distractibility returning — lighter tasks only\",\n         \"Some people notice mild rebound irritability or fatigue here\",\n         \"Better for: review, admin, passive reading, winding down work\",\n         \"Sleep should be possible if you dosed in the morning — dose timing matters a lot with 12hr meds\"\n       ], tag:\"Gradual landing.\"},\n      {start:13, end:Infinity, label:\"Baseline\", power:\"2–3 / 10\", tl:'#f5e8dc',\n       notes:[\n         \"Methylphenidate essentially cleared from system\",\n         \"ADHD baseline returning — normal and expected\",\n         \"Appetite returns, often strongly — eat a proper meal\",\n         \"Mental fatigue likely after a long active window\",\n         \"Sleep should be accessible — if not, consider earlier dosing time\",\n         \"No accumulation day-to-day — each dose starts fresh\"\n       ], tag:\"Done for the day. Recover well.\"}\n    ]\n  }\n  ,remeron: {\n    name:'Remeron 7.5mg', short:'Remeron', cls:'rm', color:'#2080c0', light:'#eef5ff',\n    rev:[{lbl:'Want asleep by:', off:0.75, desc:'Peak Sedation', id:'rv-rm1'}],\n    zones:[\n      {start:0, end:0.75, label:\"Onset\", power:\"2–4 / 10\", tl:'#b8d8f0',\n       notes:[\n         \"Mirtazapine absorbing rapidly — bioavailability ~50% due to first-pass metabolism\",\n         \"Sedative effects begin within 30 minutes for most people\",\n         \"H1 histamine blockade activating — this is what causes the sleepiness\",\n         \"At 7.5mg the antihistamine effect dominates completely — this is the most sedating dose\",\n         \"Higher doses (15mg+) are paradoxically LESS sedating due to noradrenergic activation offsetting H1 blockade\",\n         \"Get into bed now — do not fight this window\"\n       ], tag:\"30 minutes and you should be horizontal.\"},\n      {start:0.75, end:2, label:\"Peak Sedation ⭐\", power:\"8–10 / 10\", tl:'#1060a0', peak:true,\n       notes:[\n         \"Plasma concentrations approaching Tmax (~2hr) — deepest sedation window\",\n         \"H1, 5-HT2A, 5-HT2C, and α1-adrenergic receptor blockade all fully active\",\n         \"Sleep onset significantly accelerated — typical time to sleep is well under 20 min in this window\",\n         \"REM sleep suppression begins — mirtazapine shifts sleep architecture toward slow-wave/deep sleep\",\n         \"This is the core therapeutic window for insomnia — be asleep before it passes\",\n         \"At 7.5mg: very heavy sedation, strong 'pull' toward sleep, difficult to stay awake\",\n         \"Do NOT take this dose and then try to do anything requiring coordination or alertness\"\n       ], tag:\"Peak plasma. This is what 7.5mg is for.\"},\n      {start:2, end:5, label:\"Deep Sleep Window\", power:\"7–9 / 10\", tl:'#1878b8', second:true,\n       notes:[\n         \"Mirtazapine plasma levels high and stable — long half-life means slow decline\",\n         \"Slow-wave (deep) sleep enhanced — physically restorative sleep happening now\",\n         \"5-HT3 blockade reducing nausea, increasing appetite signaling (why weight gain is common)\",\n         \"Sleep architecture improved: reduced awakenings, better sleep continuity\",\n         \"Norepinephrine and serotonin levels gently elevated — antidepressant effects building over weeks\",\n         \"Do not set an alarm in this window — interrupted sleep here is poor quality recovery\"\n       ], tag:\"Deep sleep. Don't interrupt it.\"},\n      {start:5, end:8, label:\"Residual Sedation\", power:\"5–7 / 10\", tl:'#4090c8', third:true,\n       notes:[\n         \"Half-life 20–40hr means substantial drug still active — especially females (mean 37hr half-life)\",\n         \"Waking here possible but grogginess likely — the 'Remeron hangover' is real and common at 7.5mg\",\n         \"Cognitive impairment, slower reaction time, reduced driving ability documented in studies\",\n         \"Do NOT drive or operate machinery until grogginess fully cleared\",\n         \"Appetite often noticeably increased this morning — mirtazapine is the most appetite-stimulating antidepressant\",\n         \"Morning mood often improved — 5-HT1A activity contributing to anxiolytic and antidepressant effect\"\n       ], tag:\"Groggy but rested. Give it an hour before demanding tasks.\"},\n      {start:8, end:12, label:\"Clearing\", power:\"3–5 / 10\", tl:'#70b0d8',\n       notes:[\n         \"Sedation fading but residual drug still well above zero — half-life means ~6-8% cleared per hour\",\n         \"Cognitive function returning — most people feel reasonably alert by this point\",\n         \"Tolerance to sedation develops within days to weeks of consistent dosing — morning grogginess improves\",\n         \"Appetite still elevated — plan meals accordingly if weight management is a concern\",\n         \"Anxiolytic effects (via 5-HT2C and 5-HT3 blockade) active throughout the day at therapeutic levels\",\n         \"If next-day sedation is still strong after 1 week, discuss dose or timing adjustment with prescriber\"\n       ], tag:\"Coming back online. Tolerance builds within days.\"},\n      {start:12, end:Infinity, label:\"Baseline / Pre-dose\", power:\"2–3 / 10\", tl:'#c0ddf0',\n       notes:[\n         \"Mirtazapine still present at ~50% plasma concentration due to long half-life — never fully clears between nightly doses\",\n         \"Steady state reached after 4–5 days of consistent dosing\",\n         \"Antidepressant and anxiolytic effects are cumulative — built over weeks, not hours\",\n         \"Appetite stimulation may be present even in this 'low' phase\",\n         \"Take next dose 30–60 min before target sleep time for best effect\",\n         \"Consistent same-time dosing important — irregular timing disrupts steady-state levels\"\n       ], tag:\"Trough. Take next dose before bed.\"}\n    ]\n  }\n  ,lexapro: {\n    name:'Lexapro 10mg', short:'Lexapro', cls:'lx', color:'#d06820', light:'#fff4ec',\n    rev:[{lbl:'Target steady state at:', off:5, desc:'Plasma peak', id:'rv-lx1'}],\n    doses:[\n      {mg:5,  label:'5mg',  note:'Starting dose or long-term maintenance for sensitive individuals — ~65-70% SERT occupancy'},\n      {mg:10, label:'10mg', note:'Standard therapeutic dose — near-maximal SERT occupancy (~80%). Most common maintenance dose'},\n    ],\n    zonesByDose:{\n      5:[\n        {start:0, end:2, label:\"Absorbing\", power:\"—\", tl:'#f5ddc8',\n         notes:[\n           \"Escitalopram 5mg absorbs rapidly — ~80% bioavailability, Tmax 4–5 hours\",\n           \"Highly selective SERT blocker — minimal NE, DA, histamine, or muscarinic activity at any dose\",\n           \"SERT occupancy at 5mg steady state: approximately 65–70% (vs ~80% at 10mg)\",\n           \"The antidepressant effect requires weeks of sustained 5-HT elevation — no acute effect\",\n           \"No acute 'hit' — do not expect to feel anything for days to weeks\",\n           \"Nausea and jitteriness in week 1–2 are typically milder at 5mg than 10mg\"\n         ], tag:\"Absorbing. Effect builds over weeks, not hours.\"},\n        {start:2, end:6, label:\"Peak Plasma ⭐\", power:\"—\", tl:'#d07030', peak:true,\n         notes:[\n           \"Tmax 4–5 hours — plasma at daily maximum\",\n           \"5mg Cmax at steady state: ~10–11 ng/mL (roughly half of 10mg's ~21 ng/mL)\",\n           \"SERT occupancy ~65–70% — meaningful blockade, but less saturated than 10mg\",\n           \"Some patients find this occupancy level sufficient with fewer side effects — especially for anxiety\",\n           \"Acute peak does NOT correspond to mood effect — antidepressant action is cumulative\",\n           \"Side effects near Tmax milder than 10mg: less nausea, less jitteriness in early weeks\"\n         ], tag:\"Peak plasma. Gentler start, real SERT blockade.\"},\n        {start:6, end:12, label:\"Active Coverage\", power:\"—\", tl:'#e09050', second:true,\n         notes:[\n           \"SERT occupancy remains ~65–70% throughout the day — continuous but not saturated\",\n           \"5-HT elevation builds in synapses as reuptake is partially blocked\",\n           \"At 5mg steady state (7–10 days): plasma 2–2.5× single-dose — meaningful accumulation\",\n           \"Weeks 2–4: 5-HT1A autoreceptor desensitization begins — same mechanism as 10mg, slightly slower\",\n           \"Some patients experience less emotional blunting at 5mg than 10mg due to incomplete SERT saturation\",\n           \"Anxiety often responds first — mood elevation takes 4–6 weeks\"\n         ], tag:\"SERT occupied. Serotonin building — incomplete blockade can mean fewer side effects.\"},\n        {start:12, end:20, label:\"Sustained Serotonin Floor\", power:\"—\", tl:'#e8a870', third:true,\n         notes:[\n           \"Half-life 27–32 hours — plasma still 60–75% of Cmax at 12 hours post-dose\",\n           \"Lexapro has no trough that 'feels' like wearing off — continuous coverage\",\n           \"5mg is a recognized maintenance dose for anxiety disorders and sensitive individuals\",\n           \"Sexual side effects (delayed orgasm, decreased libido) typically less prevalent at 5mg than 10mg\",\n           \"Emotional blunting — the 'flat' feeling some report on SSRIs — often milder or absent at 5mg\",\n           \"If 5mg is insufficient after 6+ weeks, discuss titration to 10mg\"\n         ], tag:\"Steady serotonin floor. Milder side effect profile than 10mg.\"},\n        {start:20, end:28, label:\"Pre-Dose Trough\", power:\"—\", tl:'#f5c898',\n         notes:[\n           \"At 27–32hr half-life, ~40–55% plasma remaining at 24hrs — substantial drug still present\",\n           \"5mg does not truly trough at once-daily dosing — steady state maintains consistent coverage\",\n           \"Antidepressant effect is not lost between doses — built into receptor sensitivity changes\",\n           \"Missing one dose: minor — long half-life provides a buffer at any dose\",\n           \"Discontinuation symptoms still possible after abrupt stop — taper as directed\",\n           \"Never stop abruptly after more than a few weeks regardless of dose\"\n         ], tag:\"Long half-life buffers the trough.\"},\n        {start:28, end:Infinity, label:\"Next Dose Due\", power:\"—\", tl:'#fce4cc',\n         notes:[\n           \"Take next dose — same time daily preferred for steady plasma\",\n           \"5mg is a valid long-term dose — do not assume you must increase\",\n           \"If feeling flat or anxious, it is likely not the dose wearing off — check steady state timing\",\n           \"Full antidepressant effect builds over 4–6 weeks — do not judge before then\",\n           \"5mg is often sufficient for anxiety; depression may require 10mg\",\n           \"Discuss dose adequacy with your prescriber at the 6-week mark\"\n         ], tag:\"Same time daily. 5mg is a real therapeutic dose.\"}\n      ],\n      10:[\n        {start:0, end:2, label:\"Absorbing\", power:\"—\", tl:'#f5ddc8',\n         notes:[\n           \"Escitalopram absorbs rapidly — ~80% bioavailability, Tmax 4–5 hours\",\n           \"Highly selective serotonin reuptake inhibitor — minimal NE, DA, histamine, or muscarinic activity\",\n           \"Blocks SERT (serotonin transporter) immediately, but this is the acute pharmacodynamic effect\",\n           \"The antidepressant effect requires weeks of sustained 5-HT elevation to desensitize autoreceptors\",\n           \"No acute 'hit' — do not expect to feel anything for days to weeks\",\n           \"Nausea most likely in first 1–2 weeks as 5-HT3 receptors in the gut activate\"\n         ], tag:\"Absorbing. This drug works over weeks, not hours.\"},\n        {start:2, end:6, label:\"Peak Plasma ⭐\", power:\"—\", tl:'#d07030', peak:true,\n         notes:[\n           \"Tmax 4–5 hours — plasma concentration at daily maximum (FDA label: mean Tmax 5hr ±1.5hr)\",\n           \"At 10mg steady state: Cmax ~21 ng/mL — well above the SERT saturation threshold\",\n           \"SERT occupancy is near-maximal at 10mg (~80%) — this is why 20mg adds modest additional effect\",\n           \"The acute plasma peak does NOT correspond to acute mood effect — that is cumulative, not immediate\",\n           \"Side effects most likely near Tmax: nausea, headache, dry mouth, jitteriness in first 1–2 weeks\",\n           \"After 1–2 weeks, 5-HT1A autoreceptors begin desensitizing — this produces the antidepressant effect\"\n         ], tag:\"Peak plasma. Effects are cumulative — this peak doesn't feel like a stimulant peak.\"},\n        {start:6, end:12, label:\"Active Coverage\", power:\"—\", tl:'#e09050', second:true,\n         notes:[\n           \"Plasma above 50% of Cmax for most of this window — SERT near-fully occupied\",\n           \"5-HT builds in synapses throughout the day as reuptake is blocked\",\n           \"At steady state (7–10 days), plasma is 2.2–2.5× single-dose level — higher baseline coverage all day\",\n           \"Weeks 2–4: 5-HT1A autoreceptors begin desensitizing — synaptic 5-HT can now increase without negative feedback\",\n           \"Week 3–6: full antidepressant effect usually emerging as downstream receptor changes accumulate\",\n           \"Anxiety symptoms often improve first (within 1–2 weeks) before full mood elevation\"\n         ], tag:\"SERT occupied. Serotonin building slowly day by day.\"},\n        {start:12, end:20, label:\"Sustained Serotonin Floor\", power:\"—\", tl:'#e8a870', third:true,\n         notes:[\n           \"Half-life 27–32 hours — plasma is still 60–75% of peak even 12 hours after dose\",\n           \"Unlike stimulants, Lexapro has no trough that 'feels' like wearing off — it's continuous\",\n           \"Serotonin reuptake blocked steadily throughout the day and night\",\n           \"At steady state, the drug never fully clears — each dose adds to the existing baseline\",\n           \"Sleep quality often improves in this window after week 2 — 5-HT1A activity promoting REM normalisation\",\n           \"Sexual side effects (delayed orgasm, decreased libido) most common complaint at 10mg — typically persistent unless dose reduced\"\n         ], tag:\"Steady serotonin floor — all day, no peaks, no valleys.\"},\n        {start:20, end:28, label:\"Pre-Dose Trough\", power:\"—\", tl:'#f5c898',\n         notes:[\n           \"At 27–32hr half-life, ~40–55% plasma remaining at 24hrs — substantial drug still present\",\n           \"Lexapro never truly troughs at once-daily dosing — it accumulates to true steady state over 7–10 days\",\n           \"Antidepressant effect is not lost between doses — it's built into receptor sensitivity changes\",\n           \"Missing one dose: minor — the long half-life provides a pharmacological buffer\",\n           \"Missing multiple days: plasma drops meaningfully — discontinuation symptoms possible after abrupt stop\",\n           \"Never stop Lexapro abruptly after more than a few weeks — taper as directed\"\n         ], tag:\"Long half-life buffers the trough. Still active.\"},\n        {start:28, end:Infinity, label:\"Next Dose Due\", power:\"—\", tl:'#fce4cc',\n         notes:[\n           \"Take next dose — same time daily preferred for steady plasma\",\n           \"Lexapro's effects are fully built into synaptic infrastructure after weeks of dosing — not in the acute daily dose\",\n           \"If feeling flat or anxious, it is not the dose wearing off — it may be the drug is not at full steady state yet\",\n           \"Full antidepressant effect builds over 4–6 weeks — do not judge efficacy before 4 weeks\",\n           \"10mg is often the final dose for anxiety disorders — 20mg may be needed for depression\",\n           \"Common side effects that persist beyond 4 weeks: sexual dysfunction, mild weight gain, emotional blunting — discuss with doctor\"\n         ], tag:\"Same time daily. Effect is in the weeks, not the hours.\"}\n      ]\n    },\n    get zones() { return this.zonesByDose[ST.lexaproDose||10] || this.zonesByDose[10]; }\n  }\n};\n\nconst ALL = ['ritalin','wellbutrin','lamictal','concerta','remeron','lexapro'];\n\n// Virtual drug key for Wellbutrin + Remeron combo logs\nconst COMBO_KEY    = 'wellbutrin+remeron';\nconst COMBO_KEY_LL = 'lamictal+lexapro';\nconst COMBO_DRUG = {\n  name: 'Wellbutrin + Remeron', short: '⚗️ Combo', cls: 'combo', color: '#5060c0', light: '#f0eeff'\n};\n\nfunction isComboActive() {\n  return ST.active.includes('wellbutrin') && ST.active.includes('remeron')\n    && ST.doses['wellbutrin'] && ST.doses['remeron'];\n}\n\nconst phConcerta = [\n  { label:\"IR Overcoat\",       hours:\"0–1 hr\",   power:\"2–3 / 10\" },\n  { label:\"Building\",          hours:\"1–3 hrs\",  power:\"4–6 / 10\", third:true },\n  { label:\"Ascending Peak\",    hours:\"3–6 hrs\",  power:\"6–8 / 10\", third:true },\n  { label:\"True Peak ⭐\",      hours:\"6–9 hrs\",  power:\"8–9 / 10\", peak:true },\n  { label:\"Plateau\",           hours:\"9–11 hrs\", power:\"6–7 / 10\", second:true },\n  { label:\"Taper\",             hours:\"11–13 hrs\",power:\"3–5 / 10\" },\n  { label:\"Baseline\",          hours:\"13+ hrs\",  power:\"2–3 / 10\" },\n];\n\nconst phRemeron = [\n  { label:\"Onset\",              hours:\"0–45 min\", power:\"2–4 / 10\" },\n  { label:\"Peak Sedation ⭐\",   hours:\"45m–2 hrs\",power:\"8–10 / 10\", peak:true },\n  { label:\"Deep Sleep Window\",  hours:\"2–5 hrs\",  power:\"7–9 / 10\", second:true },\n  { label:\"Residual Sedation\",  hours:\"5–8 hrs\",  power:\"5–7 / 10\", third:true },\n  { label:\"Clearing\",           hours:\"8–12 hrs\", power:\"3–5 / 10\" },\n  { label:\"Baseline / Pre-dose\",hours:\"12+ hrs\",  power:\"2–3 / 10\" },\n];\n\n\n// ─── SUPABASE ─────────────────────────────────────────────────────────────────\nconst SUPA_URL = 'https://jgcanhzxspptcogwoxgn.supabase.co';\nconst SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnY2FuaHp4c3BwdGNvZ3dveGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMDk5ODcsImV4cCI6MjA4NzU4NTk4N30.NOruwfSS01F_DubNy3p-ijSlJERZ5-fR5gKldpKGfnA';\nconst supa = supabase.createClient(SUPA_URL, SUPA_KEY);\n\nlet currentUser = null; // null = guest mode\n\n// ─── STATE ────────────────────────────────────────────────────────────────────\nlet activeDrug = 'ritalin';\nlet tickTimer = null;\n\nfunction loadState() {\n  try { const s = localStorage.getItem('gz2'); if(s) return JSON.parse(s); } catch(e){}\n  return {doses:{}, active:[], dark:false};\n}\nfunction save() { try { localStorage.setItem('gz2', JSON.stringify(ST)); } catch(e){} }\n\nlet ST = loadState();\n\n// ─── INIT ─────────────────────────────────────────────────────────────────────\nasync function init() {\n  if (ST.dark) { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent='☀️'; }\n\n  // Check if returning from magic link click\n  const { data: { session } } = await supa.auth.getSession();\n  if (session) {\n    currentUser = session.user;\n    launchApp();\n  } else {\n    goPage('auth');\n  }\n\n  // Listen for auth changes\n  supa.auth.onAuthStateChange((_event, session) => {\n    if (session && !currentUser) {\n      currentUser = session.user;\n      launchApp();\n    }\n  });\n}\n\nfunction launchApp() {\n  updateUserPill();\n  loadFromUrl();\n\n  // ── Startup rollover check ──────────────────────────────────────────────────\n  // If the app was closed overnight, the ticker never fired.\n  // Compare today's logical day against the day doses were last set.\n  // If different, silently clear doses before rendering anything.\n  const today = todayKey();\n  if (ST.lastDoseDay && ST.lastDoseDay !== today) {\n    ALL.forEach(k => { delete ST.doses[k]; });\n    ST.lastDoseDay = today;\n    save();\n  }\n  // ───────────────────────────────────────────────────────────────────────────\n\n  buildGrid();\n  buildTabs();\n  setDrug(ST.active[0] || 'ritalin');\n  startTicker();\n  if (!localStorage.getItem('hasSeenOnboarding') && ST.active.length === 0) {\n    buildOnboardingGrid();\n    goPage('onboarding');\n  } else {\n    goPage('main');\n  }\n}\n\nfunction continueAsGuest() {\n  currentUser = null;\n  launchApp();\n}\n\nfunction updateUserPill() {\n  const pill = document.getElementById('userPill');\n  const signInPill = document.getElementById('signInPill');\n  if (currentUser) {\n    if (pill) {\n      pill.style.display = 'inline-block';\n      const email = currentUser.email || '';\n      pill.textContent = email.length > 18 ? email.slice(0,15)+'…' : email;\n    }\n    if (signInPill) signInPill.style.display = 'none';\n  } else {\n    if (pill) pill.style.display = 'none';\n    if (signInPill) signInPill.style.display = 'inline-block';\n  }\n}\n\nasync function handleSignOut() {\n  if (!confirm('Sign out?')) return;\n  await supa.auth.signOut();\n  currentUser = null;\n  ST.logs = [];\n  save();\n  updateUserPill();\n  goPage('auth');\n}\n\n// ─── SETTINGS ─────────────────────────────────────────────────────────────────\nfunction renderSettingsAccount() {\n  const el = document.getElementById('settingsAccountSection');\n  if (!el) return;\n\n  if (currentUser) {\n    el.innerHTML = `\n      <div class=\"settings-account\">\n        <div class=\"settings-account-email\">Signed in as <strong>${currentUser.email || '(no email)'}<\u002Fstrong><\u002Fdiv>\n        <div class=\"settings-account-btns\">\n          <button class=\"nav-btn settings-signout-btn\" onclick=\"handleSignOut()\">Sign out<\u002Fbutton>\n          <button class=\"nav-btn settings-delete-btn\" onclick=\"showDeleteConfirm()\">Delete account<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"settingsDeleteConfirm\" style=\"display:none;\" class=\"settings-delete-confirm\">\n          <p>This will permanently delete all your logs and sign you out. Type <strong>DELETE<\u002Fstrong> to confirm.<\u002Fp>\n          <input type=\"text\" id=\"settingsDeleteInput\" placeholder=\"Type DELETE\" autocomplete=\"off\" oninput=\"updateDeleteBtn()\">\n          <div class=\"settings-delete-confirm-btns\">\n            <button class=\"nav-btn settings-delete-btn\" id=\"settingsDeleteConfirmBtn\" disabled onclick=\"confirmDeleteAccount()\">Delete my account<\u002Fbutton>\n            <button class=\"nav-btn\" onclick=\"hideDeleteConfirm()\">Cancel<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  } else {\n    el.innerHTML = `\n      <div class=\"settings-account\">\n        <div class=\"settings-guest-msg\">You're in guest mode — logs are stored locally only and won't sync across devices.<\u002Fdiv>\n        <button class=\"nav-btn\" onclick=\"goPage('auth')\">Sign in<\u002Fbutton>\n      <\u002Fdiv>`;\n  }\n}\n\nfunction showDeleteConfirm() {\n  const box = document.getElementById('settingsDeleteConfirm');\n  const input = document.g
