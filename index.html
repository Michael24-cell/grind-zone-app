etElementById('settingsDeleteInput');\n  if (!box) return;\n  box.style.display = 'block';\n  if (input) { input.value = ''; input.focus(); }\n  updateDeleteBtn();\n}\n\nfunction hideDeleteConfirm() {\n  const box = document.getElementById('settingsDeleteConfirm');\n  if (box) box.style.display = 'none';\n}\n\nfunction updateDeleteBtn() {\n  const input = document.getElementById('settingsDeleteInput');\n  const btn = document.getElementById('settingsDeleteConfirmBtn');\n  if (!input || !btn) return;\n  btn.disabled = input.value.trim() !== 'DELETE';\n}\n\nasync function confirmDeleteAccount() {\n  const btn = document.getElementById('settingsDeleteConfirmBtn');\n  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }\n  try {\n    if (currentUser) {\n      await supa.from('logs').delete().eq('user_id', currentUser.id);\n      await supa.auth.updateUser({ data: { deleted: true } });\n    }\n    await supa.auth.signOut();\n    localStorage.clear();\n    location.reload();\n  } catch (e) {\n    const btn2 = document.getElementById('settingsDeleteConfirmBtn');\n    if (btn2) { btn2.disabled = false; btn2.textContent = 'Delete my account'; }\n    alert('Something went wrong: ' + (e.message || e));\n  }\n}\n\n// ─── AUTH ─────────────────────────────────────────────────────────────────────\nlet _pendingEmail = '';\n\nasync function sendCode() {\n  const email = document.getElementById('authEmail').value.trim();\n  const btn = document.getElementById('authBtn');\n  const msg = document.getElementById('authMsg');\n  if (!email || !email.includes('@')) { msg.textContent = 'Enter a valid email.'; msg.style.color='#e05050'; return; }\n  btn.disabled = true; btn.textContent = 'Sending…';\n  const { error } = await supa.auth.signInWithOtp({\n    email,\n    options: { shouldCreateUser: true }\n    // No emailRedirectTo — this forces Supabase to send OTP code, not magic link\n  });\n  if (error) {\n    msg.textContent = 'Error: ' + error.message; msg.style.color='#e05050';\n    btn.disabled=false; btn.textContent='Track my stats';\n  } else {\n    _pendingEmail = email;\n    document.getElementById('authStep1').style.display = 'none';\n    document.getElementById('authStep2').style.display = 'block';\n    document.getElementById('authCodeEmail').textContent = email;\n    setTimeout(() => document.getElementById('authCode')?.focus(), 100);\n  }\n}\n\nasync function verifyCode() {\n  const code = document.getElementById('authCode').value.trim();\n  const btn = document.getElementById('verifyBtn');\n  const msg = document.getElementById('authMsg2');\n  if (!code || code.length < 6) { msg.textContent = 'Enter the 6-digit code.'; msg.style.color='#e05050'; return; }\n  btn.disabled = true; btn.textContent = 'Verifying…';\n  const { data, error } = await supa.auth.verifyOtp({\n    email: _pendingEmail,\n    token: code,\n    type: 'email'\n  });\n  if (error) {\n    msg.textContent = 'Wrong code or expired. Try again or resend.'; msg.style.color='#e05050';\n    btn.disabled=false; btn.textContent='Verify';\n  } else if (data?.session) {\n    currentUser = data.session.user;\n    launchApp();\n  }\n}\n\nasync function resendCode() {\n  const msg = document.getElementById('authMsg2');\n  msg.textContent = 'Sending…'; msg.style.color='#888';\n  const { error } = await supa.auth.signInWithOtp({\n    email: _pendingEmail,\n    options: { shouldCreateUser: true }\n  });\n  if (error) { msg.textContent = 'Error: ' + error.message; msg.style.color='#e05050'; }\n  else { msg.textContent = '✓ New code sent!'; msg.style.color='#2a9d4a'; }\n}\n\nfunction backToEmail() {\n  _pendingEmail = '';\n  document.getElementById('authStep1').style.display = 'block';\n  document.getElementById('authStep2').style.display = 'none';\n  document.getElementById('authMsg').textContent = '';\n  document.getElementById('authBtn').disabled = false;\n  document.getElementById('authBtn').textContent = 'Track my stats';\n}\n\nfunction goPage(id) {\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.getElementById('page-'+id).classList.add('active');\n  if(id==='readme') { genShareUrl(); renderSettingsAccount(); }\n  if(id==='curve') renderCurvePage();\n  if(id==='log') { logDrug=activeDrug; calSelectedDate=null; buildLogTabs(); renderLogStats(); renderLogList(); fetchLogsFromSupabase(); updateLogPageBtn(); }\n  if(id==='main') {\n    // Always rebuild tabs and re-sync activeDrug when returning to dashboard\n    // Covers: coming back from meds page, readme, log, anywhere\n    if(!ST.active.includes(activeDrug)) activeDrug = ST.active[0] || 'ritalin';\n    buildTabs();\n    renderInput();\n    renderAll();\n  }\n}\n\nfunction togglePage(id) {\n  const current = document.querySelector('.page.active')?.id;\n  if (current === 'page-'+id) goPage('main');\n  else goPage(id);\n}\n\nfunction toggleDark() {\n  ST.dark = !ST.dark;\n  document.body.classList.toggle('dark', ST.dark);\n  document.getElementById('darkBtn').textContent = ST.dark ? '☀️' : '🌙';\n  save();\n}\n\n// ─── ONBOARDING ───────────────────────────────────────────────────────────────\nconst SLOW_BUILD_DRUGS = ['lexapro', 'lamictal'];\n\nlet obSelectedDrugs = [];\n\nfunction buildOnboardingGrid() {\n  obSelectedDrugs = ST.active.length ? [...ST.active] : [];\n  const g = document.getElementById('obDrugGrid');\n  g.innerHTML = '';\n  ALL.forEach(k => {\n    const d = DRUGS[k], sel = obSelectedDrugs.includes(k);\n    const div = document.createElement('div');\n    div.className = `drug-card ${d.cls}${sel ? ' sel' : ''}`;\n    div.id = 'obdc-' + k;\n    div.onclick = () => toggleObDrug(k);\n    div.innerHTML = `<div class=\"dcheck\" id=\"obdck-${k}\" style=\"color:${d.color};border-color:${sel ? d.color : '#ccc'}\">${sel ? '✓' : ''}<\u002Fdiv>\n      <div><div class=\"drug-card-name\">${d.name}<\u002Fdiv>\n      <div class=\"drug-card-sub\">${k==='ritalin'?'Stimulant · Bimodal':k==='wellbutrin'?'NDRI · Long arc':k==='lamictal'?'Mood stabilizer':k==='concerta'?'Stimulant · OROS ascending':k==='remeron'?'NaSSA · Sleep aid':'SSRI · Serotonin'}<\u002Fdiv><\u002Fdiv>`;\n    g.appendChild(div);\n  });\n}\n\nfunction toggleObDrug(k) {\n  const idx = obSelectedDrugs.indexOf(k);\n  if (idx >= 0) { obSelectedDrugs.splice(idx, 1); }\n  else { obSelectedDrugs.push(k); }\n  const d = DRUGS[k], sel = obSelectedDrugs.includes(k);\n  const div = document.getElementById('obdc-' + k);\n  div.className = `drug-card ${d.cls}${sel ? ' sel' : ''}`;\n  const chk = document.getElementById('obdck-' + k);\n  chk.style.color = d.color;\n  chk.style.borderColor = sel ? d.color : '#ccc';\n  chk.textContent = sel ? '✓' : '';\n}\n\nfunction buildObStartDates() {\n  const slowSelected = obSelectedDrugs.filter(k => SLOW_BUILD_DRUGS.includes(k));\n  const container = document.getElementById('obStartDates');\n  container.innerHTML = '';\n  slowSelected.forEach(k => {\n    const d = DRUGS[k];\n    const saved = (ST.doseStartDates || {})[k] || '';\n    const row = document.createElement('div');\n    row.style.cssText = 'margin-bottom:14px;';\n    row.innerHTML = `<label class=\"ob-start-label\" style=\"color:${d.color};\">${d.name}<\u002Flabel>\n      <input type=\"date\" id=\"obsd-${k}\" value=\"${saved}\" class=\"ob-start-input\"\n        onchange=\"obSaveStartDate('${k}', this.value)\">`;\n    container.appendChild(row);\n  });\n}\n\nfunction obSaveStartDate(k, val) {\n  if (!ST.doseStartDates) ST.doseStartDates = {};\n  ST.doseStartDates[k] = val;\n  save();\n}\n\nfunction obNext() {\n  if (obSelectedDrugs.length > 0) {\n    ST.active = [...obSelectedDrugs];\n    save();\n  }\n  const hasSlowBuild = obSelectedDrugs.some(k => SLOW_BUILD_DRUGS.includes(k));\n  if (hasSlowBuild) {\n    buildObStartDates();\n    document.getElementById('ob-screen-1').style.display = 'none';\n    document.getElementById('ob-screen-2').style.display = '';\n  } else {\n    finishOnboarding();\n  }\n}\n\nfunction obBack() {\n  document.getElementById('ob-screen-2').style.display = 'none';\n  document.getElementById('ob-screen-1').style.display = '';\n}\n\nfunction finishOnboarding() {\n  if (obSelectedDrugs.length > 0) {\n    ST.active = [...obSelectedDrugs];\n    save();\n  }\n  localStorage.setItem('hasSeenOnboarding', 'true');\n  goPage('main');\n}\n\n// ─── DRUG GRID ────────────────────────────────────────────────────────────────\nfunction buildGrid() {\n  const g = document.getElementById('drugGrid');\n  g.innerHTML = '';\n  ALL.forEach(k => {\n    const d = DRUGS[k], sel = ST.active.includes(k);\n    const div = document.createElement('div');\n    div.className = `drug-card ${d.cls}${sel?' sel':''}`;\n    div.id = 'dc-'+k;\n    div.onclick = ()=>toggleDrugSel(k);\n    div.innerHTML = `<div class=\"dcheck\" id=\"dck-${k}\" style=\"color:${d.color};border-color:${sel?d.color:'#ccc'}\">${sel?'✓':''}<\u002Fdiv>\n      <div><div class=\"drug-card-name\">${d.name}<\u002Fdiv>\n      <div class=\"drug-card-sub\">${k==='ritalin'?'Stimulant · Bimodal':k==='wellbutrin'?'NDRI · Long arc':k==='lamictal'?'Mood stabilizer':k==='concerta'?'Stimulant · OROS ascending':k==='remeron'?'NaSSA · Sleep aid':'SSRI · Serotonin'}<\u002Fdiv><\u002Fdiv>`;\n    g.appendChild(div);\n  });\n}\n\nfunction toggleDrugSel(k) {\n  const idx = ST.active.indexOf(k);\n  if(idx>=0) { if(ST.active.length===1) return; ST.active.splice(idx,1); }\n  else ST.active.push(k);\n  save(); buildGrid(); buildTabs();\n  if(!ST.active.includes(activeDrug)) setDrug(ST.active[0]);\n  else renderAll();\n}\n\n// ─── TABS ─────────────────────────────────────────────────────────────────────\nfunction buildTabs() {\n  const bar = document.getElementById('mainTabs');\n  bar.innerHTML = '';\n  ST.active.forEach(k => {\n    const d = DRUGS[k];\n    const b = document.createElement('div');\n    b.className = `tab-btn ${d.cls}${k===activeDrug?' active':''}`;\n    b.id = 'mt-'+k; b.textContent = d.name;\n    b.onclick = ()=>setDrug(k);\n    bar.appendChild(b);\n  });\n}\n\nfunction setDrug(k) {\n  activeDrug = k;\n  document.querySelectorAll('.tab-btn').forEach(b=>{\n    const bk=b.id.replace('mt-','');\n    b.className=`tab-btn ${DRUGS[bk].cls}${bk===k?' active':''}`;\n  });\n  renderInput();\n  renderAll();\n}\n\n// ─── INPUT ────────────────────────────────────────────────────────────────────\nfunction renderInput() {\n  const d = DRUGS[activeDrug], saved = ST.doses[activeDrug]||'';\n\n  // Dose selector for drugs that have multi-dose options\n  let doseHtml = '';\n  const doseKey = activeDrug === 'lamictal' ? 'lamictalDose' : activeDrug === 'wellbutrin' ? 'wellbutrinDose' : activeDrug === 'lexapro' ? 'lexaproDose' : null;\n  if (doseKey && d.doses) {\n    const curDose = ST[doseKey] || d.doses[1]?.mg || d.doses[0]?.mg;\n    const curDoseObj = d.doses.find(x => x.mg === curDose) || d.doses[0];\n    doseHtml = `<div class=\"dose-block\">\n      <div class=\"dose-section-label\">Dose<\u002Fdiv>\n      <div class=\"dose-selector\">\n        ${d.doses.map(dobj => `<button class=\"dose-btn${dobj.mg===curDose?' sel':''}\"\n          style=\"${dobj.mg===curDose?`border-color:${d.color};background:${d.light};color:${d.color};`:''}\"\n          onclick=\"setDose('${doseKey}',${dobj.mg})\">${dobj.label}<\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n      <div class=\"dose-note\">${curDoseObj?.note||''}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  // Sex selector for Remeron — half-life differs significantly (26hr male vs 37hr female)\n  let sexHtml = '';\n  if (activeDrug === 'remeron') {\n    const sel = ST.sex || null;\n    sexHtml = `<div class=\"sex-row\">\n      <span class=\"label\">Biological sex <span class=\"hint\">(affects half-life)<\u002Fspan><\u002Fspan>\n      <div class=\"sex-btns\">\n        <button onclick=\"setSex('female')\" class=\"sex-btn${sel==='female'?' sel':''}\">Female<span class=\"hl\">~37hr<\u002Fspan><\u002Fbutton>\n        <button onclick=\"setSex('male')\" class=\"sex-btn${sel==='male'?' sel':''}\">Male<span class=\"hl\">~26hr<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      ${sel ? `<span class=\"sex-status set\">Half-life ~${sel==='female'?37:26}hr · zones adjusted<\u002Fspan>` : '<span class=\"sex-status\">select to personalize zones<\u002Fspan>'}\n    <\u002Fdiv>`;\n  }\n\n  document.getElementById('doseArea').innerHTML =\n    doseHtml + sexHtml +\n    `<div class=\"dose-section-label\">Dose time (${d.name})<\u002Fdiv>\n    <div class=\"dt-input-row\">\n      <input type=\"time\" id=\"dtInput\" value=\"${saved}\" oninput=\"onDose(this.value)\">\n    <\u002Fdiv>`;\n\n  // Reverse calc — always available, collapsed by default\n  let rh = `<div class=\"rev-toggle\" onclick=\"toggleRevCalc()\">\n    <span id=\"revArrow\">▶<\u002Fspan> Reverse calculator\n  <\u002Fdiv>\n  <div id=\"revBody\" style=\"display:none;\">`;\n\n  d.rev.forEach(r=>{\n    rh += `<div class=\"rev-row\">\n      <div class=\"rev-label\">${r.lbl}<\u002Fdiv>\n      <input type=\"time\" id=\"${r.id}-in\" oninput=\"doRev('${r.id}-in','${r.id}-out',${r.off},'${r.desc}')\">\n      <div id=\"${r.id}-out\" class=\"reverse-result\" style=\"color:${d.color};\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n\n  rh += `<\u002Fdiv>`;\n  document.getElementById('revArea').innerHTML = rh;\n}\n\nfunction toggleRevCalc() {\n  const body = document.getElementById('revBody');\n  const arrow = document.getElementById('revArrow');\n  if (!body) return;\n  const open = body.style.display === 'block';\n  body.style.display = open ? 'none' : 'block';\n  arrow.textContent = open ? '▶' : '▼';\n}\n\nfunction onDose(v) {\n  ST.doses[activeDrug]=v;\n  ST.lastDoseDay = todayKey(); // stamp which logical day these doses belong to\n  save(); renderAll(); renderInput(); genShareUrl();\n}\n\nfunction setDose(key, mg) {\n  ST[key] = mg;\n  // update drug name display to reflect selected dose\n  if (key === 'lamictalDose') DRUGS.lamictal.name = 'Lamictal ' + mg + 'mg';\n  if (key === 'wellbutrinDose') DRUGS.wellbutrin.name = 'Wellbutrin XL ' + mg + 'mg';\n  if (key === 'lexaproDose') DRUGS.lexapro.name = 'Lexapro ' + mg + 'mg';\n  save();\n  buildTabs();     // re-render tab labels\n  renderInput();   // re-render dose buttons\n  renderAll();     // re-render zones\n}\n\nfunction setSex(val) {\n  ST.sex = val; save();\n  renderInput();  // re-render the sex buttons\n  renderAll();    // re-render zones with new half-life\n}\n\n// ─── REVERSE ─────────────────────────────────────────────────────────────────\nfunction doRev(inId,outId,off,desc) {\n  const val=document.getElementById(inId)?.value, el=document.getElementById(outId);\n  if(!val||!el) return;\n  const [hh,mm]=val.split(':').map(Number);\n  const mins=Math.round(((hh+mm/60-off)%24+24)%24*60);\n  const dh=Math.floor(mins/60),dm=mins%60;\n  const ap=dh>=12?'PM':'AM',h12=dh%12===0?12:dh%12;\n  const th=hh%12===0?12:hh%12,tap=hh>=12?'PM':'AM';\n  el.textContent=`→ Take at ${h12}:${dm.toString().padStart(2,'0')} ${ap} to hit ${desc} around ${th}:${mm.toString().padStart(2,'0')} ${tap}.`;\n}\n\n// ─── HELPERS ─────────────────────────────────────────────────────────────────\n// Convert \"HH:MM\" 24hr string to \"h:MM AM/PM\"\nfunction to12(t) {\n  if (!t) return t;\n  const [hh, mm] = t.split(':').map(Number);\n  const ap = hh >= 12 ? 'PM' : 'AM';\n  const h12 = hh % 12 === 0 ? 12 : hh % 12;\n  return `${h12}:${mm.toString().padStart(2,'0')} ${ap}`;\n}\n\nfunction fmt(h) {\n  const t=Math.round(h*60),hh=Math.floor(t/60)%24,mm=t%60;\n  const ap=hh>=12?'PM':'AM',h12=hh%12===0?12:hh%12;\n  return `${h12}:${mm.toString().padStart(2,'0')} ${ap}`;\n}\nfunction nowH() { const n=new Date(); return n.getHours()+n.getMinutes()/60+n.getSeconds()/3600; }\n\n// \"Logical day\" — rolls over at 3am instead of midnight\n// Returns 'YYYY-MM-DD' string of the day that \"owns\" this moment\nfunction appDay(date) {\n  const d = date ? new Date(date) : new Date();\n  // If it's before 3am, it belongs to the previous calendar day\n  if (d.getHours() < 3) d.setDate(d.getDate() - 1);\n  return d.toISOString().slice(0, 10);\n}\n\n// Same as appDay() but returns today's logical day key\nfunction todayKey() { return appDay(); }\nfunction bgZ(z) {\n  if(z.peak)   return 'background:#fffacd;border-left:4px solid #f0c000;';\n  if(z.second) return 'background:#e8e8e8;border-left:4px solid #aaa;';\n  if(z.third)  return 'background:#ffe5cc;border-left:4px solid #e8a060;';\n  return 'border-left:3px solid #ccc;';\n}\nfunction getZone(dose,zones,elapsedOverride) {\n  const e = elapsedOverride !== undefined ? elapsedOverride : ((nowH()-dose)%24+24)%24;\n  return zones.find(z=>e>=z.start&&e<(z.end===Infinity?9999:z.end))||zones[zones.length-1];\n}\nfunction getZoneForDrug(k) {\n  const v=ST.doses[k]; if(!v) return null;\n  const [hh,mm]=v.split(':').map(Number),dose=hh+mm/60;\n  const {zones}=getEffectiveZones(k);\n  return getZone(dose,zones);\n}\n\n// ─── NOW BANNER ───────────────────────────────────────────────────────────────\n\n// ─── WELLBUTRIN + REMERON INTERACTION ENGINE ──────────────────────────────────\n// Based on: Blier 2010 (46% vs 25% remission), STAR*D, CO-MED, Millan 2000,\n//           De Boer 1995, StatPearls mirtazapine MOA, Stahl bupropion neuropharmacology review\n\nconst COMBO_WB_RM = {\n  // How bupropion's active hours interact with remeron's residual at each time of day\n  // Each phase: describes the net effect when both are active simultaneously\n  phases: [\n    {\n      id: 'morning_synergy',\n      title: 'Morning synergy window',\n      // Wellbutrin building (1–5hr post-morning dose), Remeron residual clearing\n      // NE/DA reuptake blocked (bupropion) + α2 still partially blocked (remeron) = elevated NE\n      wellbutrinZones: ['Building', 'Active Buildup', 'First Rise'],\n      remeronZones: ['Residual Sedation', 'Clearing'],\n      ne: 'elevated',     // both drugs push NE up\n      da: 'moderate',     // bupropion blocks DA reuptake\n      serotonin: 'moderate', // remeron α2 het blockade still partially active\n      histamine: 'fading',   // H1 blockade wearing off\n      net: {\n        label: 'Alerting + mood lift',\n        color: '#2060a0',\n        description: `Bupropion's NE/DA reuptake block combines with mirtazapine's residual α2 blockade — NE release elevated from both mechanisms simultaneously. The sedation from last night's Remeron fading as bupropion activates. Most people feel clearer here than on either drug alone.`,\n        feels: [\"Mental clarity returning\", \"Energy starting\", \"Appetite elevated (remeron still active)\", \"Mood stabilizing\"],\n        watch: [\"Some may feel overstimulated if Remeron hangover + Wellbutrin activation clash\", \"Blood pressure slightly elevated — both raise NE\"]\n      }\n    },\n    {\n      id: 'daytime_peak',\n      title: 'Daytime peak combination',\n      // Wellbutrin at peak (5–14hr), Remeron in baseline/trough — mainly bupropion driving\n      // But remeron's cumulative antidepressant effect (weeks) fully active in background\n      wellbutrinZones: ['Peak Zone ⭐', 'Active Plateau'],\n      remeronZones: ['Clearing', 'Baseline / Pre-dose'],\n      ne: 'high',\n      da: 'moderate-high',\n      serotonin: 'background', // remeron's 5-HT1A sensitization built over weeks\n      histamine: 'minimal',\n      net: {\n        label: 'Full activation + stable baseline',\n        color: '#1a7030',\n        description: `This is the combination's peak window. Bupropion at maximum NE/DA effect, mirtazapine providing a stable serotonergic and noradrenergic floor built over weeks. The α2 blockade from last night's remeron has worn off acutely, but the chronic receptor-level changes remain. Research shows this combo achieves 46% remission vs 25% on monotherapy.`,\n        feels: [\"Focus and drive strongest\", \"Mood most stable and elevated\", \"Appetite suppression from bupropion partially offsetting remeron's appetite increase\", \"Best window for demanding cognitive work\", \"Anxiety low (5-HT1A activity from remeron chronic effect)\"],\n        watch: ['Avoid second Wellbutrin dose after 3pm — bupropion too activating for sleep', 'Caffeine additive with bupropion — watch blood pressure']\n      }\n    },\n    {\n      id: 'evening_transition',\n      title: 'Evening transition',\n      // Wellbutrin tapering (14–20hr), approaching Remeron dose time\n      // Both drugs at trough — but cumulative antidepressant effect at full steady state\n      wellbutrinZones: ['Taper', 'Back to Baseline'],\n      remeronZones: ['Baseline / Pre-dose'],\n      ne: 'tapering',\n      da: 'tapering',\n      serotonin: 'steady-state', // chronic receptor changes fully in effect\n      histamine: 'minimal',\n      net: {\n        label: 'Steady state — prep for sleep',\n        color: '#7040a0',\n        description: `Both drugs at trough, but their cumulative receptor-level changes are fully established. Weeks of mirtazapine have desensitized 5-HT2A/2C and upregulated 5-HT1A — bupropion's chronic NE elevation has adapted presynaptic tone. The combination at steady state is greater than either drug's acute effect. Take Remeron 30–60min before target sleep.`,\n        feels: [\"Energy tapering naturally\", \"Mood still supported by steady-state effects\", \"Appetite returning (remeron's chronic 5-HT2C effect still present)\", \"Good window for winding down\"],\n        watch: [\"Don't take Remeron too late — this sets up tomorrow's morning grogginess window\", \"Sleep should come easily — mirtazapine onset about to begin again\"]\n      }\n    },\n    {\n      id: 'sleep_phase',\n      title: 'Sleep phase (Remeron active)',\n      // Remeron peaking overnight, Wellbutrin cleared\n      wellbutrinZones: [],\n      remeronZones: ['Onset', 'Peak Sedation ⭐', 'Deep Sleep Window'],\n      ne: 'elevated-acute', // mirtazapine α2 autoreceptor blockade fully active\n      da: 'minimal',        // bupropion cleared\n      serotonin: 'elevated', // α2 het blockade on serotonin terminals\n      histamine: 'blocked',  // H1 maximally blocked — deep sedation\n      net: {\n        label: 'Deep repair sleep',\n        color: '#1060a0',\n        description: `Bupropion fully cleared. Mirtazapine dominating: H1 blockade producing deep sedation, α2 blockade flooding NE and 5-HT, 5-HT2A/2C blockade directing serotonin to 5-HT1A. Slow-wave sleep significantly enhanced — this is where the antidepressant restoration happens. Next morning's bupropion will re-activate onto the receptor landscape mirtazapine has set up overnight.`,\n        feels: [\"Deep, restorative sleep\", \"REM suppressed early — vivid dreams may occur later in night\", \"Hunger on waking (mirtazapine 5-HT2C/H1 appetite drive)\", \"May feel groggy until bupropion kicks in\"],\n        watch: [\"Do not take bupropion at night — mirtazapine and bupropion oppose each other's sedation/activation\", \"Alcohol greatly amplifies both sedation and seizure risk with this combo — avoid\"]\n      }\n    }\n  ]\n};\n\nfunction getComboPhase(wbZone, rmZone) {\n  // Given current zone labels for each drug, return the matching combo phase\n  if (!wbZone || !rmZone) return null;\n  const wbl = wbZone.label, rml = rmZone.label;\n\n  // Sleep phase: Remeron active in sleep zones\n  if (['Onset','Peak Sedation ⭐','Deep Sleep Window'].includes(rml)) {\n    return COMBO_WB_RM.phases.find(p => p.id === 'sleep_phase');\n  }\n  // Morning synergy: Wellbutrin building + Remeron residual\n  if (['Residual Sedation','Clearing'].includes(rml) && ['Building','Active Buildup','First Rise','Ramp Up'].includes(wbl)) {\n    return COMBO_WB_RM.phases.find(p => p.id === 'morning_synergy');\n  }\n  // Morning synergy even if wellbutrin is at peak\n  if (['Residual Sedation','Clearing'].includes(rml)) {\n    return COMBO_WB_RM.phases.find(p => p.id === 'morning_synergy');\n  }\n  // Evening transition: both winding down\n  if (['Baseline / Pre-dose'].includes(rml) && ['Taper','Back to Baseline'].includes(wbl)) {\n    return COMBO_WB_RM.phases.find(p => p.id === 'evening_transition');\n  }\n  // Evening trough: wellbutrin at peak but remeron in baseline\n  if (['Baseline / Pre-dose'].includes(rml) && ['Peak Zone ⭐','Active Plateau'].includes(wbl)) {\n    return COMBO_WB_RM.phases.find(p => p.id === 'daytime_peak');\n  }\n  // Default to daytime\n  return COMBO_WB_RM.phases.find(p => p.id === 'daytime_peak');\n}\n\nfunction renderComboPanel(wbDose, rmDose) {\n  if (!wbDose || !rmDose) return '';\n  const now = nowH();\n  const wb = DRUGS.wellbutrin, rm = DRUGS.remeron;\n\n  const wbElap = ((now - (function(){const [h,m]=wbDose.split(':').map(Number);return h+m/60;})())%24+24)%24;\n  const rmElap = ((now - (function(){const [h,m]=rmDose.split(':').map(Number);return h+m/60;})())%24+24)%24;\n\n  const {zones:wbZones} = getEffectiveZones('wellbutrin');\n  const {zones:rmZones} = getEffectiveZones('remeron');\n  const wbZone = getZone((function(){const [h,m]=wbDose.split(':').map(Number);return h+m/60;})(), wbZones);\n  const rmZone = getZone((function(){const [h,m]=rmDose.split(':').map(Number);return h+m/60;})(), rmZones);\n\n  const phase = getComboPhase(wbZone, rmZone);\n  if (!phase) return '';\n\n  const c = phase.net.color;\n  const lightBg = c + '12';\n\n  // NE/DA/5-HT status indicators\n  const ntColor = (level) => {\n    if (level === 'high' || level === 'elevated' || level === 'elevated-acute') return '#2a7a2a';\n    if (level === 'moderate' || level === 'moderate-high') return '#6a8a2a';\n    if (level === 'tapering' || level === 'fading' || level === 'background') return '#a08020';\n    if (level === 'minimal' || level === 'blocked') return '#aaa';\n    return '#888';\n  };\n  const ntLabel = (level) => {\n    const map = {'elevated':'↑↑','elevated-acute':'↑↑↑','high':'↑↑↑','moderate-high':'↑↑','moderate':'↑','background':'~','steady-state':'~','tapering':'↓','fading':'↓','minimal':'—','blocked':'—'};\n    return map[level] || '~';\n  };\n\n  return `\n  <div class=\"combo-panel\" style=\"background:${lightBg};border-color:${c};\">\n    <div class=\"combo-eyebrow\" style=\"color:${c};\">⚗️ Combination effect right now<\u002Fdiv>\n\n    <!-- equation -->\n    <div class=\"combo-equation\">\n      <div class=\"combo-drug-pill\" style=\"background:${wb.light};border-color:${wb.color};color:${wb.color};\">\n        Wellbutrin<span class=\"sub\">${wbZone.label.replace(' ⭐','')}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"combo-op\">+<\u002Fdiv>\n      <div class=\"combo-drug-pill\" style=\"background:${rm.light};border-color:${rm.color};color:${rm.color};\">\n        Remeron<span class=\"sub\">${rmZone.label.replace(' ⭐','')}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"combo-op\">=<\u002Fdiv>\n      <div class=\"combo-result\" style=\"background:${c};color:white;\">${phase.net.label}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- neurotransmitter status -->\n    <div class=\"combo-nt-row\">\n      <div class=\"combo-nt-pill\"><span class=\"k\">NE <\u002Fspan><span class=\"v\" style=\"color:${ntColor(phase.ne)};\">${ntLabel(phase.ne)}<\u002Fspan><\u002Fdiv>\n      <div class=\"combo-nt-pill\"><span class=\"k\">DA <\u002Fspan><span class=\"v\" style=\"color:${ntColor(phase.da)};\">${ntLabel(phase.da)}<\u002Fspan><\u002Fdiv>\n      <div class=\"combo-nt-pill\"><span class=\"k\">5-HT <\u002Fspan><span class=\"v\" style=\"color:${ntColor(phase.serotonin)};\">${ntLabel(phase.serotonin)}<\u002Fspan><\u002Fdiv>\n      <div class=\"combo-nt-pill\"><span class=\"k\">H1 <\u002Fspan><span class=\"v\" style=\"color:${ntColor(phase.histamine)};\">${ntLabel(phase.histamine)}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- description -->\n    <div class=\"combo-desc\">${phase.net.description}<\u002Fdiv>\n\n    <!-- what it feels like -->\n    <div class=\"combo-phase-header\">What to expect<\u002Fdiv>\n    ${phase.net.feels.map(f=>`<div class=\"combo-row\"><div class=\"combo-row-icon\" style=\"color:${c};\">✓<\u002Fdiv><div class=\"combo-row-text\">${f}<\u002Fdiv><\u002Fdiv>`).join('')}\n\n    <!-- watch for -->\n    ${phase.net.watch.length ? `\n    <div class=\"combo-phase-header\">Watch for<\u002Fdiv>\n    ${phase.net.watch.map(w=>`<div class=\"combo-row\"><div class=\"combo-row-icon\" style=\"color:#e07020;\">⚠<\u002Fdiv><div class=\"combo-row-text\">${w}<\u002Fdiv><\u002Fdiv>`).join('')}\n    ` : ''}\n\n    <div class=\"combo-cite\">Based on: Blier 2010 (46% vs 25% remission RCT) · STAR*D · Millan 2000 α2 blockade · Stahl bupropion NE/DA review · CO-MED trial<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// ─── LAMICTAL + LEXAPRO COMBO ────────────────────────────────────────────────\n\nconst COMBO_LM_LX_DRUG = {\n  name: 'Lamictal + Lexapro', short: '⚗️ Combo', cls: 'combo', color: '#3a7a50', light: '#eefff5'\n};\n\nconst COMBO_LM_LX = {\n  // Steady-state arc — phases reflect where you are in the treatment timeline\n  // not time-of-day interaction. Derived from dose start dates via ST.doseStartDates.\n  // Research: Nierenberg et al. 2006 (bipolar depression), Barbee 2004 (augmentation),\n  // Geddes 2016 lamotrigine meta-analysis, multiple SSRI+MS combination studies\n  phases: [\n    {\n      id: 'both_building',\n      title: 'Both building',\n      // Neither drug at full therapeutic effect\n      // Lamictal still titrating neurologically (<3 weeks)\n      // Lexapro autoreceptors not yet desensitized (<3 weeks)\n      gaba: 'building',\n      glutamate: 'partially-stabilized',\n      serotonin: 'building',\n      mood_floor: 'not-yet',\n      net: {\n        label: 'Building foundation',\n        color: '#a07030',\n        description: \"Both drugs are still establishing their therapeutic effect. Lamictal's Na+ channel blockade is active but the mood-stabilizing receptor adaptations take 3–6 weeks. Lexapro's SERT blockade is immediate but the antidepressant effect requires 5-HT1A autoreceptor desensitization, which builds over weeks. This is the patience phase — effects are accumulating below the surface.\",\n        feels: [\n          'Subtle changes possible but no full effect yet',\n          'Lamictal may cause minor dizziness or word-finding difficulty early on — usually clears',\n          'Lexapro side effects (nausea, jitteriness) most likely in this window',\n          'Sleep may shift — both drugs alter architecture early in treatment'\n        ],\n        watch: [\n          'Lamictal rash risk highest during titration — never skip doses or double up after a miss',\n          'Do not judge efficacy of either drug before 4–6 weeks',\n          'Hypomania risk (bipolar patients): early SSRI exposure before mood stabilizer is established — monitor closely'\n        ]\n      }\n    },\n    {\n      id: 'foundation_setting',\n      title: 'Foundation setting',\n      // Lamictal plasma established (3–6 weeks), mood floor beginning\n      // Lexapro approaching full steady state, autoreceptor changes in progress\n      gaba: 'established',\n      glutamate: 'stabilized',\n      serotonin: 'ramping',\n      mood_floor: 'forming',\n      net: {\n        label: 'Floor forming, lift starting',\n        color: '#3a7a50',\n        description: \"Lamictal's mood-stabilizing effect is establishing — glutamate and sodium channel blockade reducing mood reactivity and preventing lows. Lexapro's autoreceptors are beginning to desensitize, allowing synaptic serotonin to increase. The combination starts working as a system here: Lamictal prevents the floor from dropping while Lexapro begins lifting the ceiling. Anxiety typically improves before mood.\",\n        feels: [\n          'Mood swings starting to dampen (Lamictal)',\n          'Anxiety often improving before full mood lift (Lexapro)',\n          'Emotional reactivity reducing — less triggered by small things',\n          'Energy and motivation starting to return in some patients'\n        ],\n        watch: [\n          'Hypomania: as Lexapro builds, Lamictal must be adequate to provide a ceiling — monitor mood elevation',\n          'Lamictal side effects (diplopia, word-finding) may persist into this window before adaptation',\n          'Sexual side effects from Lexapro typically emerging now if they will occur'\n        ]\n      }\n    },\n    {\n      id: 'full_combination',\n      title: 'Full combination active',\n      // Both at full therapeutic steady state (6+ weeks)\n      // This is the research-backed therapeutic sweet spot\n      gaba: 'full',\n      glutamate: 'fully-stabilized',\n      serotonin: 'full-steady-state',\n      mood_floor: 'established',\n      net: {\n        label: 'Full combination effect',\n        color: '#1a6a40',\n        description: \"Both drugs at full therapeutic effect. Lamictal providing a stable mood floor — Na+ channel stabilization reducing excitatory glutamate bursts that drive mood episodes. Lexapro providing serotonergic lift through desensitized 5-HT1A autoreceptors allowing sustained synaptic 5-HT elevation. The combination addresses mood from two complementary mechanisms: stability from below (Lamictal) and lift from above (Lexapro). Nierenberg 2006 and follow-up studies support this pairing for bipolar depression specifically.\",\n        feels: [\n          'Mood most stable and supported it has been on this regimen',\n          'Emotional floor established — lows less severe and less frequent',\n          'Serotonergic support from Lexapro fully active',\n          'Cognitive side effects from early Lamictal titration usually resolved',\n          'This is the target state — consistency here determines long-term outcome'\n        ],\n        watch: [\n          'Hypomania monitoring ongoing — Lexapro can occasionally push past the mood floor Lamictal sets, especially in bipolar II',\n          'Sexual side effects from Lexapro often persistent at this stage — discuss dose if impacting quality of life',\n          'Do not stop either drug abruptly — both require tapering'\n        ]\n      }\n    },\n    {\n      id: 'maintenance',\n      title: 'Long-term maintenance',\n      // Stable on combination for months\n      // Effect is now in consistent dosing habit, not the drug itself\n      gaba: 'full',\n      glutamate: 'fully-stabilized',\n      serotonin: 'full-steady-state',\n      mood_floor: 'established',\n      net: {\n        label: 'Maintenance — consistency is everything',\n        color: '#2060a0',\n        description: \"The combination's therapeutic effect is now fully built into receptor infrastructure — not the daily dose itself. Lamictal's long half-life (22–37hr) and Lexapro's (27–32hr) mean missing one dose has minimal acute impact, but irregular dosing creates plasma fluctuations that gradually erode the mood stabilization. The risk at this stage is complacency — feeling well and attributing it to recovery rather than the medications maintaining that recovery.\",\n        feels: [\n          'Baseline feels stable and unremarkable — this is the goal',\n          'Both drugs working quietly in the background',\n          'Mood resilience to life stressors increased compared to pre-treatment'\n        ],\n        watch: [\n          'Never stop Lamictal abruptly — seizure risk even in patients without epilepsy after long-term use',\n          'Never stop Lexapro abruptly — discontinuation syndrome (electric shocks, dizziness, irritability)',\n          'Feeling well does not mean the drugs are no longer needed — discuss any changes with your prescriber',\n          'Annual review of dose adequacy recommended'\n        ]\n      }\n    }\n  ]\n};\n\nfunction isComboLLActive() {\n  return ST.active.includes('lamictal') && ST.active.includes('lexapro')\n    && ST.doses['lamictal'] && ST.doses['lexapro'];\n}\n\nfunction getComboLLPhase() {\n  // Phase is derived from how long both drugs have been consistently dosed\n  // We use ST.doseStartDates[drug] if set, otherwise fall back to log history\n  // as a proxy for treatment duration\n  const lmLogs = (ST.logs||[]).filter(e=>e.drug==='lamictal'||e.drug===COMBO_KEY_LL);\n  const lxLogs = (ST.logs||[]).filter(e=>e.drug==='lexapro'||e.drug===COMBO_KEY_LL);\n\n  // Estimate weeks on each drug from oldest log\n  function weeksFromLogs(logs) {\n    if (!logs.length) return 0;\n    const oldest = logs.reduce((a,b) => (a.ts < b.ts ? a : b));\n    const days = (Date.now() - new Date(oldest.ts)) / (1000*60*60*24);\n    return days / 7;\n  }\n\n  const lmWeeks = weeksFromLogs(lmLogs);\n  const lxWeeks = weeksFromLogs(lxLogs);\n  const minWeeks = Math.min(lmWeeks, lxWeeks); // limited by whichever started later\n\n  if (minWeeks < 3)  return COMBO_LM_LX.phases.find(p=>p.id==='both_building');\n  if (minWeeks < 7)  return COMBO_LM_LX.phases.find(p=>p.id==='foundation_setting');\n  if (minWeeks < 20) return COMBO_LM_LX.phases.find(p=>p.id==='full_combination');\n  return COMBO_LM_LX.phases.find(p=>p.id==='maintenance');\n}\n\nfunction renderComboPanelLL() {\n  const phase = getComboLLPhase();\n  if (!phase) return '';\n\n  const lm = DRUGS.lamictal, lx = DRUGS.lexapro;\n  const lmDose = ST.lamictalDose || 50;\n  const lxDose = ST.lexaproDose  || 10;\n  const c = phase.net.color;\n  const lightBg = c + '12';\n\n  const stateColor = (s) => {\n    if (['full','full-steady-state','established','fully-stabilized'].includes(s)) return '#1a6a40';\n    if (['established','ramping','forming','partially-stabilized'].includes(s)) return '#6a8a2a';\n    if (['building','not-yet'].includes(s)) return '#a07030';\n    return '#888';\n  };\n  const stateLabel = (s) => {\n    const map = {'full':'✓ Full','full-steady-state':'✓ Full','established':'✓ Set',\n      'fully-stabilized':'✓ Stable','forming':'~ Forming','ramping':'~ Ramping',\n      'partially-stabilized':'~ Partial','building':'⟳ Building','not-yet':'— Not yet'};\n    return map[s] || s;\n  };\n\n  // Estimate weeks for display\n  const lmLogs = (ST.logs||[]).filter(e=>e.drug==='lamictal'||e.drug===COMBO_KEY_LL);\n  const lxLogs = (ST.logs||[]).filter(e=>e.drug==='lexapro'||e.drug===COMBO_KEY_LL);\n  function weeksFromLogs(logs) {\n    if (!logs.length) return null;\n    const oldest = logs.reduce((a,b)=>(a.ts<b.ts?a:b));\n    return Math.round((Date.now()-new Date(oldest.ts))/(1000*60*60*24*7));\n  }\n  const lmW = weeksFromLogs(lmLogs), lxW = weeksFromLogs(lxLogs);\n  const weeksNote = (lmW!==null&&lxW!==null)\n    ? `Lamictal ~${lmW}w · Lexapro ~${lxW}w (estimated from logs)`\n    : 'Log both drugs to track treatment arc';\n\n  return `\n  <div class=\"combo-panel\" style=\"background:${lightBg};border-color:${c};\">\n    <div class=\"combo-eyebrow\" style=\"color:${c};\">⚗️ Combination effect — treatment arc<\u002Fdiv>\n\n    <!-- equation -->\n    <div class=\"combo-equation\">\n      <div class=\"combo-drug-pill\" style=\"background:${lm.light};border-color:${lm.color};color:${lm.color};\">\n        Lamictal ${lmDose}mg<span class=\"sub\">mood floor<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"combo-op\">+<\u002Fdiv>\n      <div class=\"combo-drug-pill\" style=\"background:${lx.light};border-color:${lx.color};color:${lx.color};\">\n        Lexapro ${lxDose}mg<span class=\"sub\">serotonin lift<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"combo-op\">=<\u002Fdiv>\n      <div class=\"combo-result\" style=\"background:${c};color:white;\">${phase.net.label}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- mechanism status -->\n    <div class=\"combo-nt-row\">\n      <div class=\"combo-nt-pill\"><span class=\"k\">Na⁺ block <\u002Fspan><span class=\"v\" style=\"color:${stateColor(phase.gaba)};\">${stateLabel(phase.gaba)}<\u002Fspan><\u002Fdiv>\n      <div class=\"combo-nt-pill\"><span class=\"k\">Glu <\u002Fspan><span class=\"v\" style=\"color:${stateColor(phase.glutamate)};\">${stateLabel(phase.glutamate)}<\u002Fspan><\u002Fdiv>\n      <div class=\"combo-nt-pill\"><span class=\"k\">5-HT <\u002Fspan><span class=\"v\" style=\"color:${stateColor(phase.serotonin)};\">${stateLabel(phase.serotonin)}<\u002Fspan><\u002Fdiv>\n      <div class=\"combo-nt-pill\"><span class=\"k\">Mood floor <\u002Fspan><span class=\"v\" style=\"color:${stateColor(phase.mood_floor)};\">${stateLabel(phase.mood_floor)}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"combo-desc\">${phase.net.description}<\u002Fdiv>\n\n    <div class=\"combo-phase-header\">What to expect<\u002Fdiv>\n    ${phase.net.feels.map(f=>`<div class=\"combo-row\"><div class=\"combo-row-icon\" style=\"color:${c};\">✓<\u002Fdiv><div class=\"combo-row-text\">${f}<\u002Fdiv><\u002Fdiv>`).join('')}\n\n    ${phase.net.watch.length ? `\n    <div class=\"combo-phase-header\">Watch for<\u002Fdiv>\n    ${phase.net.watch.map(w=>`<div class=\"combo-row\"><div class=\"combo-row-icon\" style=\"color:#e07020;\">⚠<\u002Fdiv><div class=\"combo-row-text\">${w}<\u002Fdiv><\u002Fdiv>`).join('')}\n    ` : ''}\n\n    <div class=\"combo-cite\">${weeksNote}<br>Based on: Nierenberg 2006 (bipolar depression) · Barbee 2004 (SSRI+MS augmentation) · Geddes 2016 lamotrigine meta-analysis<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderNow() {\n  const ban = document.getElementById('nowBanner');\n  // Show a card for EVERY active drug that has a dose time — not just the current tab\n  const dosed = ST.active.filter(k => ST.doses[k]);\n  if (!dosed.length) { ban.style.display='none'; ban.innerHTML=''; return; }\n\n  const now = nowH();\n  const timeStr = fmt(now);\n\n  let html = `<div class=\"now-stamp\"><span class=\"dot\"><\u002Fspan>Right now <span class=\"time\">${timeStr}<\u002Fspan><\u002Fdiv>`;\n\n  // If only one drug, render as single wide card (original style)\n  if (dosed.length === 1) {\n    const k = dosed[0], d = DRUGS[k];\n    const [hh,mm] = ST.doses[k].split(':').map(Number), dose = hh+mm/60;\n    const {zones:effZones} = getEffectiveZones(k);\n    const z = getZone(dose, effZones);\n    const elap = ((now-dose)%24+24)%24, mins = Math.round(elap*60);\n    const elStr = mins<60?`${mins}m ago`:`${Math.floor(mins/60)}h ${mins%60}m ago`;\n    const bg = nowCardBg(z, d);\n    html += `<div class=\"now-card\" style=\"${bg}\" onclick=\"setDrug('${k}')\">\n      <div class=\"now-card-label\">${d.name}<\u002Fdiv>\n      <div class=\"now-card-zone\">${z.label.replace(' ⭐','')}<\u002Fdiv>\n      <div class=\"now-card-meta\">Dosed ${elStr}${z.power!=='—'?' · '+z.power:''}<\u002Fdiv>\n    <\u002Fdiv>`;\n  } else {\n    // Multiple drugs — side by side grid\n    const colsCls = dosed.length === 2 ? 'cols-2' : dosed.length === 3 ? 'cols-3' : 'cols-4';\n    html += `<div class=\"now-card-grid ${colsCls}\">`;\n    dosed.forEach(k => {\n      const d = DRUGS[k];\n      const [hh,mm] = ST.doses[k].split(':').map(Number), dose = hh+mm/60;\n      const z = getZone(dose, d.zones);\n      const elap = ((now-dose)%24+24)%24, mins = Math.round(elap*60);\n      const elStr = mins<60?`${mins}m ago`:`${Math.floor(mins/60)}h ${mins%60}m ago`;\n      const bg = nowCardBg(z, d);\n      const powerNum = z.power !== '—' ? parseFloat(z.power.split('/')[0].split('–')[1] || z.power.split('/')[0]) : null;\n      const barW = powerNum ? Math.round((powerNum/10)*100) : 0;\n      html += `<div class=\"now-card compact\" style=\"${bg}\" onclick=\"setDrug('${k}')\">\n        <div class=\"now-card-label\">${d.name}<\u002Fdiv>\n        <div class=\"now-card-zone\">${z.label.replace(' ⭐','')}<\u002Fdiv>\n        ${powerNum ? `<div class=\"now-power-bar\"><div class=\"now-power-fill\" style=\"width:${barW}%;background:${d.color};\"><\u002Fdiv><\u002Fdiv>` : ''}\n        <div class=\"now-card-meta\">${elStr}${z.power!=='—'?' · '+z.power:''}<\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n    html += '<\u002Fdiv>';\n    // Wellbutrin + Remeron combo panel\n    if (dosed.includes('wellbutrin') && dosed.includes('remeron')) {\n      html += renderComboPanel(ST.doses.wellbutrin, ST.doses.remeron);\n    }\n    // Lamictal + Lexapro combo panel\n    if (dosed.includes('lamictal') && dosed.includes('lexapro')) {\n      html += renderComboPanelLL();\n    }\n  }\n\n  ban.style.display = 'block';\n  ban.innerHTML = html;\n}\n\nfunction nowCardBg(z, d) {\n  if (z.peak)   return 'background:#fffacd;border-color:#f0c000;';\n  if (z.second) return 'background:#e8e8e8;border-color:#aaa;';\n  if (z.third)  return 'background:#ffe5cc;border-color:#e8a060;';\n  return `background:${d.light};border-color:${d.color};`;\n}\n\n// ─── TIMELINE ─────────────────────────────────────────────────────────────────\nfunction renderTimeline() {\n  const wrap=document.getElementById('tlWrap');\n  const dosed=ST.active.filter(k=>ST.doses[k]);\n  if(!dosed.length){wrap.style.display='none';return;}\n  wrap.style.display='block';\n  if(dosed.length===1) renderSingleTL(dosed[0]);\n  else renderCombinedTL(dosed);\n}\n\nfunction renderSingleTL(k) {\n  const d=DRUGS[k],[hh,mm]=ST.doses[k].split(':').map(Number),dose=hh+mm/60;\n  const {zones:effZ}=getEffectiveZones(k);\n  const maxH=Math.min(Math.max(...effZ.filter(z=>z.end!==Infinity).map(z=>z.end),12),24);\n  document.getElementById('tlLabel').textContent=`${d.name} · ${maxH}hr window`;\n  const rows=document.getElementById('tlRows');\n  // clear old rows but keep now-line\n  Array.from(rows.children).forEach(c=>{if(c.id!=='tlNow')rows.removeChild(c);});\n  const row=document.createElement('div');\n  row.className='tl-row';\n  effZ.forEach(z=>{\n    if(z.start>=maxH)return;\n    const w=Math.min(z.end===Infinity?maxH:z.end,maxH)-z.start;\n    const seg=document.createElement('div');\n    seg.className='tl-seg';\n    seg.style.cssText=`width:${(w/maxH*100).toFixed(2)}%;background:${z.tl};`;\n    seg.textContent=z.label.replace(' ⭐','');\n    row.appendChild(seg);\n  });\n  rows.insertBefore(row, document.getElementById('tlNow'));\n  posNowLine(dose,maxH,rows.offsetHeight||22);\n  renderTicks(dose,maxH,false);\n}\n\nfunction renderCombinedTL(dosed) {\n  const totalH=24;\n  document.getElementById('tlLabel').textContent=`${dosed.map(k=>DRUGS[k].short).join(' + ')} · Combined 24hr view`;\n  const rows=document.getElementById('tlRows');\n  Array.from(rows.children).forEach(c=>{if(c.id!=='tlNow')rows.removeChild(c);});\n  dosed.forEach(k=>{\n    const d=DRUGS[k],[hh,mm]=ST.doses[k].split(':').map(Number),dose=hh+mm/60;\n    const row=document.createElement('div');\n    row.className='tl-row';\n    row.style.position='relative';\n    // pre-dose empty\n    if(dose>0){\n      const pre=document.createElement('div');\n      pre.style.cssText=`width:${(dose/totalH*100).toFixed(2)}%;background:var(--line);flex-shrink:0;`;\n      row.appendChild(pre);\n    }\n    let used=dose;\n    d.zones.forEach(z=>{\n      const end=z.end===Infinity?totalH:Math.min(dose+z.end,totalH);\n      const w=end-used; if(w<=0)return;\n      const seg=document.createElement('div');\n      seg.className='tl-seg';\n      seg.style.cssText=`width:${(w/totalH*100).toFixed(2)}%;background:${z.tl};flex-shrink:0;`;\n      row.appendChild(seg);\n      used=end;\n    });\n    // label overlay\n    const lbl=document.createElement('div');\n    lbl.className='tl-drug-label';\n    lbl.textContent=d.short;\n    row.appendChild(lbl);\n    rows.insertBefore(row, document.getElementById('tlNow'));\n  });\n  const rowH=dosed.length*24;\n  posNowLine(0,totalH,rowH,true);\n  renderTicks(0,totalH,true);\n}\n\nfunction posNowLine(dose,totalH,rowH,absolute=false) {\n  const nl=document.getElementById('tlNow');\n  const now=nowH();\n  const elapsed=absolute?(now%24):((now-dose+24)%24);\n  if(elapsed>totalH){nl.style.display='none';return;}\n  const pct=(elapsed/totalH*100).toFixed(2);\n  nl.style.display='block';\n  nl.style.left=pct+'%';\n  nl.style.height=(rowH||22)+'px';\n}\n\nfunction renderTicks(dose,totalH,absolute) {\n  const tc=document.getElementById('tlTicks');\n  tc.innerHTML='';\n  const step=totalH>16?4:totalH>8?2:1;\n  for(let i=0;i<=totalH;i+=step){\n    const h=absolute?i:(dose+i);\n    const span=document.createElement('span');\n    span.style.cssText=`position:absolute;left:${(i/totalH*100).toFixed(2)}%;transform:translateX(-50%);`;\n    span.textContent=fmt(h%24).replace(':00','').replace(' ','');\n    tc.appendChild(span);\n  }\n}\n\n// ─── ZONES ────────────────────────────────────────────────────────────────────\nfunction renderZones() {\n  const d=DRUGS[activeDrug],v=ST.doses[activeDrug],out=document.getElementById('zonesOut');\n  const {zones, adapted} = getEffectiveZones(activeDrug);\n\n  if(!v){\n    let h=`<div class=\"section-label\">Zones — tap any to expand<\u002Fdiv>`;\n    h += adaptiveBannerHTML(activeDrug);\n    zones.forEach(z=>{\n      const uid='z'+Math.random().toString(36).slice(2);\n      const lbl=z.end===Infinity?`${z.start}+ hrs`:`${z.start}–${z.end} hrs`;\n      h+=zoneHTML(uid,`<strong>${lbl}<\u002Fstrong><span style=\"font-weight:200;\"> — ${z.label}<\u002Fspan>`,z,false,adapted);\n    });\n    out.innerHTML=h; return;\n  }\n  const [hh,mm]=v.split(':').map(Number),dose=hh+mm/60;\n  const elap=((nowH()-dose)%24+24)%24;\n  let h=`<div class=\"section-label\">Your schedule today<\u002Fdiv>`;\n  h += adaptiveBannerHTML(activeDrug);\n  zones.forEach(z=>{\n    const uid='z'+Math.random().toString(36).slice(2);\n    const s=dose+z.start,e=z.end===Infinity?null:dose+z.end;\n    const tr=e?`${fmt(s)} – ${fmt(e)}`:`${fmt(s)} onward`;\n    const isNow=elap>=z.start&&elap<(z.end===Infinity?9999:z.end);\n    h+=zoneHTML(uid,`<strong>${tr}<\u002Fstrong><span style=\"font-weight:200;\"> — ${z.label}<\u002Fspan>`,z,isNow,adapted);\n  });\n  out.innerHTML=h;\n}\n\nfunction zoneHTML(uid,titleHTML,z,isNow,adapted=false) {\n  const nowHdrExtra=isNow?'border-left-width:5px !important;':'';\n\n  // Determine if \"yours\" tab should exist and what the default view is\n  const logCountForZone = (ST.logs||[]).filter(e=>e.drug===activeDrug&&e.zone===z.label).length;\n  const hasYoursData = logCountForZone >= 1; // show tab even at 1, builds toward 3\n  const defaultView = logCountForZone >= 2 ? 'yours' : 'research'; // start on yours once there's real data\n  // Store default in ZONE_NOTE_VIEW if not already set\n  if (!ZONE_NOTE_VIEW[uid]) ZONE_NOTE_VIEW[uid] = defaultView;\n  const activeView = ZONE_NOTE_VIEW[uid];\n\n  const toggleHTML = hasYoursData ? `<div class=\"zone-note-toggle\">\n    <button id=\"${uid}_btn_research\" class=\"zone-note-btn${activeView==='research'?' active':''}\" onclick=\"setZoneNoteView('${uid}','research');event.stopPropagation();\">Research<\u002Fbutton>\n    <button id=\"${uid}_btn_yours\" class=\"zone-note-btn${activeView==='yours'?' active':''}\" onclick=\"setZoneNoteView('${uid}','yours');event.stopPropagation();\">Yours${logCountForZone>=3?'':' ·'+logCountForZone+'/3'}<\u002Fbutton>\n  <\u002Fdiv>` : '';\n\n  const researchDisplay = activeView==='research' ? 'block' : 'none';\n  const yoursDisplay    = activeView==='yours'    ? 'block' : 'none';\n\n  return `<div class=\"${isNow?'zone-row is-now':'zone-row'}\">\n    <div class=\"zone-hdr\" style=\"${bgZ(z)}${nowHdrExtra}\" onclick=\"toggleZ('${uid}')\">\n      <div style=\"flex:1;\">\n        <div class=\"zone-title\">${titleHTML}<\u002Fdiv>\n        ${z.power!=='—'?`<div class=\"zone-sub\">Effect level: ${z.power}<\u002Fdiv>`:''}\n        ${isNow?`<div class=\"you-are-here\">← you are here<\u002Fdiv>`:''}\n        ${adapted&&z.peak?`<div class=\"zone-calibrated-pill\">👤 calibrated to your data<\u002Fdiv>`:''}\n        ${hasYoursData&&!isNow?`<div class=\"zone-log-count\">👤 ${logCountForZone} log${logCountForZone===1?'':'s'}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n      <div id=\"${uid}_a\" class=\"zone-arrow\">▼<\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"${uid}\" class=\"zone-body\">\n      ${toggleHTML}\n      <div id=\"${uid}_research\" style=\"display:${researchDisplay};\">\n        <ul>${z.notes.map(n=>`<li>${n}<\u002Fli>`).join('')}<\u002Ful>\n        ${z.tag?`<div class=\"zone-tagline\">${z.tag}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n      <div id=\"${uid}_yours\" style=\"display:${yoursDisplay};\">\n        ${hasYoursData ? yoursHTML(activeDrug, z.label, uid) : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// Track which zone UIDs are showing \"yours\" vs \"research\"\nconst ZONE_NOTE_VIEW = {}; // uid -> 'research' | 'yours'\n\nfunction setZoneNoteView(uid, view) {\n  ZONE_NOTE_VIEW[uid] = view;\n  const researchEl = document.getElementById(uid+'_research');\n  const yoursEl    = document.getElementById(uid+'_yours');\n  const btnRes     = document.getElementById(uid+'_btn_research');\n  const btnYours   = document.getElementById(uid+'_btn_yours');\n  if (researchEl) researchEl.style.display = view==='research' ? 'block' : 'none';\n  if (yoursEl)    yoursEl.style.display    = view==='yours'    ? 'block' : 'none';\n  if (btnRes)    { btnRes.classList.toggle('active', view==='research'); }\n  if (btnYours)  { btnYours.classList.toggle('active', view==='yours'); }\n}\n\nfunction toggleZoneNotes(uid) {\n  const el = document.getElementById(uid);\n  if (!el) return;\n  el.style.display = el.style.display === 'none' ? 'block' : 'none';\n}\n\nfunction toggleZ(uid) {\n  const el=document.getElementById(uid),ar=document.getElementById(uid+'_a');\n  if(!el)return;\n  const open=el.style.display==='block';\n  el.style.display=open?'none':'block';\n  ar.textContent=open?'▼':'▲';\n}\n\n\n\n// ─── LOG SYSTEM ───────────────────────────────────────────────────────────────\n\n// Tags organized by group — used for modal rendering and stats\nconst TAG_GROUPS = [\n  { label: 'Mood',     tags: ['calm','content','grounded','steady','baseline','motivated','euphoric','moody','irritable','emotional','low','flat','blunted'] },\n  { label: 'Mental',   tags: ['focused','productive','clear','creative','scattered','overthinking','spacy','foggy','distracted'] },\n  { label: 'Energy',   tags: ['energized','tired','tense','restless','wired','crashed','headache','dry mouth','suppressed appetite','nauseous'] },\n  { label: 'Social',   tags: ['talkative','social battery low','withdrawn'] },\n];\n// Flat list derived from groups (used for compatibility)\nconst TAGS = TAG_GROUPS.flatMap(g => g.tags);\nconst TAG_COLORS = {\n  // Mood\n  calm:'#50c080', content:'#50b070', grounded:'#3a9060', steady:'#60a878', baseline:'#aaa',\n  motivated:'#c070e8', euphoric:'#e040b0', moody:'#b060c0', irritable:'#e08050',\n  emotional:'#d06080', low:'#7090c0', flat:'#aaa', blunted:'#9090b0',\n  // Mental\n  focused:'#c070e8', productive:'#7050d0', clear:'#5577d4', creative:'#a040c0',\n  scattered:'#a080c0', overthinking:'#8060c0', spacy:'#90a0c0', foggy:'#aaa', distracted:'#b07090',\n  // Energy\n  energized:'#f0a000', tired:'#a0a0a0', tense:'#c06030', restless:'#e07030',\n  wired:'#e0c000', crashed:'#e05050', headache:'#c04040',\n  'dry mouth':'#b08050', 'suppressed appetite':'#808050', nauseous:'#708060',\n  // Social\n  talkative:'#40a0b0', 'social battery low':'#7090a0', withdrawn:'#6080a0',\n};\n\nlet logDrug = 'ritalin';\nlet selFeel = null;\nlet selTags = [];\n\n// called from log page — temporarily sets activeDrug to logDrug so modal context is correct\nfunction openLogModalFrom(source) {\n  const prev = activeDrug;\n  activeDrug = logDrug; // use whichever drug tab is active on the log page\n  openLogModal();\n  // restore after modal closes if needed — modal uses activeDrug at save time, which is correct\n}\n\nfunction updateLogPageBtn() {\n  const btn = document.getElementById('logPageBtn');\n  if (!btn) return;\n  const d = DRUGS[logDrug];\n  btn.style.background = d.light;\n  btn.style.color = d.color;\n  btn.style.border = `1px solid ${d.color}`;\n}\n\nfunction openLogModal() {\n  const d = DRUGS[activeDrug];\n  const v = ST.doses[activeDrug];\n  selFeel = null; selTags = [];\n\n  // set time to now\n  const n = new Date();\n  const hh = n.getHours().toString().padStart(2,'0');\n  const mm = n.getMinutes().toString().padStart(2,'0');\n  document.getElementById('logTimeInput').value = hh+':'+mm;\n  document.getElementById('logTimeDisplay').textContent = to12(hh+':'+mm.toString().padStart(2,'0'));\n\n  // context line — detect combo state\n  const comboNow = isComboActive() && (activeDrug === 'wellbutrin' || activeDrug === 'remeron');\n  let ctx = '';\n  let modalColor = d.color;\n  let modalLight = d.light;\n\n  if (comboNow) {\n    // Override: log belongs to the combo, not one drug\n    const phase = getComboPhase(\n      getZone((function(){const [h,m]=ST.doses.wellbutrin.split(':').map(Number);return h+m/60;})(),\n        getEffectiveZones('wellbutrin').zones),\n      getZone((function(){const [h,m]=ST.doses.remeron.split(':').map(Number);return h+m/60;})(),\n        getEffectiveZones('remeron').zones)\n    );\n    ctx = `⚗️ Wellbutrin + Remeron · ${phase ? phase.net.label : 'Combo active'}`;\n    modalColor = COMBO_DRUG.color;\n    modalLight = COMBO_DRUG.light;\n  } else if (v) {\n    const [dh,dm] = v.split(':').map(Number), dose=dh+dm/60;\n    const zone = getZone(dose, d.zones);\n    const elap = ((nowH()-dose)%24+24)%24;\n    const mins = Math.round(elap*60);\n    const elStr = mins<60?`${mins}m after dose`:`${Math.floor(mins/60)}h ${mins%60}m after dose`;\n    ctx = `${d.name} · ${elStr} · ${zone.label}`;\n  } else {\n    ctx = `${d.name} · no dose time set`;\n  }\n  document.getElementById('logModalTitle').textContent = 'How are you feeling?';\n  document.getElementById('logModalContext').textContent = ctx;\n  document.getElementById('saveLogBtn').style.background = modalColor;\n\n  // feel scale\n  const fs = document.getElementById('feelScale');\n  fs.innerHTML = '';\n  for (let i=1;i<=10;i++) {\n    const b = document.createElement('div');\n    b.className = 'feel-btn';\n    b.textContent = i;\n    b.onclick = () => { selFeel=i; fs.querySelectorAll('.feel-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); b.style.borderColor=d.color; b.style.background=d.light; };\n    fs.appendChild(b);\n  }\n\n  // tags — grouped layout\n  const tr = document.getElementById('tagRow');\n  tr.innerHTML = '';\n  TAG_GROUPS.forEach(group => {\n    const lbl = document.createElement('div');\n    lbl.className = 'tag-group-label';\n    lbl.textContent = group.label;\n    tr.appendChild(lbl);\n    const row = document.createElement('div');\n    row.className = 'tag-row';\n    group.tags.forEach(t => {\n      const b = document.createElement('div');\n      b.className = 'tag-btn';\n      b.textContent = t;\n      b.onclick = () => {\n        if (selTags.includes(t)) { selTags=selTags.filter(x=>x!==t); b.classList.remove('sel'); b.style.borderColor='#ccc'; b.style.background=''; }\n        else { selTags.push(t); b.classList.add('sel'); b.style.borderColor=TAG_COLORS[t]||d.color; b.style.background=(TAG_COLORS[t]||d.color)+'18'; }\n      };\n      row.appendChild(b);\n    });\n    tr.appendChild(row);\n  });\n\n  document.getElementById('logNoteInput').value = '';\n  document.getElementById('logModalBg').classList.add('open');\n}\n\nfunction closeLogModal(e) {\n  if (!e || e.target === document.getElementById('logModalBg')) {\n    document.getElementById('logModalBg').classList.remove('open');\n  }\n}\n\nfunction getDoseForDrug(drugKey) {\n  // Returns the active mg dose for drugs with dose selectors, null otherwise\n  if (drugKey === 'wellbutrin') return ST.wellbutrinDose || 300;\n  if (drugKey === 'lamictal')   return ST.lamictalDose   || 50;\n  if (drugKey === 'lexapro')    return ST.lexaproDose    || 10;\n  return null;\n}\n\nfunction saveLog() {\n  if (!selFeel) { alert('Pick a feeling level first (1–10)'); return; }\n  const timeVal = document.getElementById('logTimeInput').value;\n  if (!timeVal) { alert('Set a time for this entry'); return; }\n  const note = document.getElementById('logNoteInput').value.trim();\n  const d = DRUGS[activeDrug];\n  const v = ST.doses[activeDrug];\n  const [lh,lm] = timeVal.split(':').map(Number);\n  const logH = lh+lm/60;\n\n  let zoneName = '—', elapsedH = null;\n  if (v) {\n    const [dh,dm] = v.split(':').map(Number), dose=dh+dm/60;\n    const elap = ((logH-dose)%24+24)%24;\n    elapsedH = elap;\n    zoneName = getZone(dose, d.zones).label;\n  }\n\n  // If both wellbutrin+remeron active, attribute to combo key\n  const savingAsWbRm = isComboActive() && (activeDrug === 'wellbutrin' || activeDrug === 'remeron');\n  // If both lamictal+lexapro active, attribute to combo key\n  const savingAsLmLx = isComboLLActive() && (activeDrug === 'lamictal' || activeDrug === 'lexapro');\n  const savingAsCombo = savingAsWbRm || savingAsLmLx;\n  const saveKey = savingAsWbRm ? COMBO_KEY : savingAsLmLx ? COMBO_KEY_LL : activeDrug;\n\n  // For combo, compute combo phase as the zone\n  let comboPhase = null;\n  if (savingAsLmLx) {\n    const llPhase = getComboLLPhase();\n    zoneName = llPhase ? llPhase.net.label : 'Combination active';\n    // elapsed not meaningful for LL — clear it\n    elapsedH = null;\n  }\n  if (savingAsWbRm) {\n    comboPhase = getComboPhase(\n      getZone((function(){const [h,m]=ST.doses.wellbutrin.split(':').map(Number);return h+m/60;})(),\n        getEffectiveZones('wellbutrin').zones),\n      getZone((function(){const [h,m]=ST.doses.remeron.split(':').map(Number);return h+m/60;})(),\n        getEffectiveZones('remeron').zones)\n    );\n    // Use wellbutrin elapsed for combo (main daytime drug driving the experience)\n    const wbV = ST.doses.wellbutrin;\n    if (wbV) {\n      const [wbH,wbM] = wbV.split(':').map(Number);\n      const wbDose = wbH+wbM/60;\n      elapsedH = ((logH-wbDose)%24+24)%24;\n      zoneName = comboPhase ? comboPhase.net.label : 'Combo active';\n    }\n  }\n\n  const entry = {\n    id: Date.now(),\n    drug: saveKey,\n    dose: getDoseForDrug(savingAsCombo ? null : activeDrug), // null for combo logs — dose stored per drug // mg dose at time of log (null for non-dose-selector drugs)\n    feel: selFeel,\n    tags: [...selTags],\n    note,\n    time: timeVal,\n    doseTime: v||null,\n    elapsedH,\n    zone: zoneName,\n    ts: new Date().toISOString(),\n    combo: savingAsCombo || undefined\n  };\n\n  if (currentUser) {\n    // Save to Supabase\n    supa.from('logs').insert({\n      user_id: currentUser.id,\n      drug: entry.drug,\n      dose_mg: entry.dose || null,\n      feel: entry.feel,\n      tags: entry.tags,\n      note: entry.note || null,\n      time: entry.time,\n      dose_time: entry.doseTime || null,\n      elapsed_h: entry.elapsedH || null,\n      zone: entry.zone,\n      ts: entry.ts\n    }).then(({error}) => {\n      if (error) console.error('Supabase save error:', error);\n    });\n    // Also cache locally for instant UI\n    if (!ST.logs) ST.logs = [];\n    ST.logs.unshift(entry);\n    save();\n  } else {\n    // Guest mode — localStorage only\n    if (!ST.logs) ST.logs = [];\n    ST.logs.unshift(entry);\n    save();\n  }\n\n  closeLogModal();\n  renderLogBtn();\n  updateAdaptiveNotes();\n  renderAll();\n}\n\nfunction renderLogBtn() {\n  const wrap = document.getElementById('logBtnWrap');\n  if (!wrap) return;\n  const d = DRUGS[activeDrug];\n  wrap.innerHTML = `<button class=\"log-btn\" style=\"background:${d.light};color:${d.color};border:1px solid ${d.color};\" onclick=\"openLogModal()\">+ Log how I feel right now<\u002Fbutton>`;\n}\n\n// ─── LOG PAGE ─────────────────────────────────────────────────────────────────\n\nfunction goLogPage() {\n  logDrug = activeDrug;\n  goPage('log');\n  buildLogTabs();\n  renderLogStats();\n  renderLogList();\n}\n\nfunction buildLogTabs() {\n  const bar = document.getElementById('logDrugTabs');\n  bar.innerHTML = '';\n\n  // Regular drug tabs\n  ST.active.forEach(k => {\n    const d = DRUGS[k];\n    const b = document.createElement('div');\n    b.className = `tab-btn ${d.cls}${k===logDrug?' active':''}`;\n    b.textContent = d.name;\n    b.onclick = () => { logDrug=k; calSelectedDate=null; buildLogTabs(); renderLogStats(); renderLogList(); updateLogPageBtn(); };\n    bar.appendChild(b);\n  });\n\n  // Combo tab — show if any combo logs exist\n  const comboLogs = (ST.logs||[]).filter(e=>e.drug===COMBO_KEY);\n  if (comboLogs.length > 0) {\n    const b = document.createElement('div');\n    b.className = `tab-btn combo${logDrug===COMBO_KEY?' active':''}`;\n    b.textContent = '⚗️ Combo';\n    b.onclick = () => { logDrug=COMBO_KEY; calSelectedDate=null; buildLogTabs(); renderLogStats(); renderLogList(); updateLogPageBtn(); };\n    bar.appendChild(b);\n  }\n  const comboLLLogs = (ST.logs||[]).filter(e=>e.drug===COMBO_KEY_LL);\n  if (comboLLLogs.length) {\n    const b = document.createElement('button');\n    b.className = `tab-btn combo${logDrug===COMBO_KEY_LL?' active':''}`;\n    b.textContent = '⚗️ Lam+Lex';\n    b.onclick = () => { logDrug=COMBO_KEY_LL; calSelectedDate=null; buildLogTabs(); renderLogStats(); renderLogList(); updateLogPageBtn(); };\n    bar.appendChild(b);\n  }\n}\n\nfunction getLogsForDrug(k) {\n  return (ST.logs||[]).filter(e=>e.drug===k).sort((a,b)=>b.id-a.id);\n}\n\nfunction getDrugForDisplay(k) {\n  // Returns display drug object for a drug key (handles combo)\n  if (k === COMBO_KEY)    return COMBO_DRUG;\n  if (k === COMBO_KEY_LL) return COMBO_LM_LX_DRUG;\n  return DRUGS[k] || COMBO_DRUG;\n}\n\nasync function fetchLogsFromSupabase() {\n  if (!currentUser) return;\n  const { data, error } = await supa.from('logs')\n    .select('*')\n    .eq('user_id', currentUser.id)\n    .order('ts', { ascending: false });\n  if (error) { console.error('Fetch error:', error); return; }\n  // Map Supabase columns back to local format\n  ST.logs = (data||[]).map(r => ({\n    id: r.id,\n    drug: r.drug,\n    feel: r.feel,\n    tags: r.tags || [],\n    note: r.note || '',\n    time: r.time,\n    doseTime: r.dose_time,\n    elapsedH: r.elapsed_h,\n    zone: r.zone,\n    ts: r.ts\n  }));\n  save();\n  renderLogStats();\n  renderLogList();\n  updateAdaptiveNotes();\n  renderAll();\n}\n\nfunction renderLogStats() {\n  const logs = getLogsForDrug(logDrug);\n  const el = document.getElementById('logStats');\n  if (!logs.length) { el.innerHTML=''; return; }\n  const d = getDrugForDisplay(logDrug);\n\n  // avg feel per zone\n  const byZone = {};\n  logs.forEach(e => {\n    if (!byZone[e.zone]) byZone[e.zone] = [];\n    byZone[e.zone].push(e.feel);\n  });\n\n  // top tags\n  const tagCount = {};\n  logs.forEach(e=>e.tags.forEach(t=>{tagCount[t]=(tagCount[t]||0)+1;}));\n  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,4);\n\n  const avg = logs.reduce((s,e)=>s+e.feel,0)/logs.length;\n\n  renderStreakPanel();\n  el.innerHTML = `<div class=\"log-stat-card\">\n    <div class=\"log-stat-header\">${d.name} · ${logs.length} entr${logs.length===1?'y':'ies'}<\u002Fdiv>\n    <div class=\"log-stat-grid\">\n      <div class=\"log-stat-item\"><div class=\"log-stat-value\" style=\"color:${d.color};\">${avg.toFixed(1)}<\u002Fdiv><div class=\"log-stat-label\">avg feeling<\u002Fdiv><\u002Fdiv>\n      ${topTags.map(([t,c])=>`<div class=\"log-stat-item\"><div class=\"log-stat-value\" style=\"color:${TAG_COLORS[t]||'var(--ink)'}\">${c}×<\u002Fdiv><div class=\"log-stat-label\" style=\"color:${TAG_COLORS[t]||'var(--ink-3)'}\">${t}<\u002Fdiv><\u002Fdiv>`).join('')}\n    <\u002Fdiv>\n    ${Object.keys(byZone).length>1?`<div class=\"log-zone-chips\">\n      ${Object.entries(byZone).map(([z,vals])=>{\n        const a=(vals.reduce((s,v)=>s+v,0)/vals.length).toFixed(1);\n        const w=parseFloat(a)/10;\n        return `<span class=\"log-zone-chip\" style=\"background:${d.light};border-color:${d.color};color:${d.color};\">${z.replace(' ⭐','')} <strong>${a}<\u002Fstrong><\u002Fspan>`;\n      }).join('')}\n    <\u002Fdiv>`:''}\n  <\u002Fdiv>`;\n}\n\nlet logView = 'day'; // 'day' or 'cycle'\nlet calSelectedDate = null; // 'YYYY-MM-DD' or null = all\nlet calView = 'strip'; // 'strip' or 'month'\n\nfunction setLogView(v) {\n  logView = v;\n  document.getElementById('viewByDay').classList.toggle('active', v==='day');\n  document.getElementById('viewByCycle').classList.toggle('active', v==='cycle');\n  renderLogList();\n}\n\nfunction getFilteredLogs() {\n  let logs = getLogsForDrug(logDrug);\n  // date filter from calendar\n  if (calSelectedDate) {\n    logs = logs.filter(e => e.ts && appDay(e.ts) === calSelectedDate);\n  }\n  // dropdown filter\n  const f = document.getElementById('logFilter')?.value || 'all';\n  if (f==='high') logs = logs.filter(e=>e.feel>=7);\n  else if (f==='mid') logs = logs.filter(e=>e.feel>=4&&e.feel<=6);\n  else if (f==='low') logs = logs.filter(e=>e.feel<=3);\n  else if (f==='tagged') logs = logs.filter(e=>e.tags&&e.tags.length>0);\n  else if (f==='noted') logs = logs.filter(e=>e.note&&e.note.trim());\n  return logs;\n}\n\nfunction renderInsightsPanel() {\n  const wrap = document.getElementById('insightsPanel');\n  if (!wrap) return;\n  const allLogs = getLogsForDrug(logDrug);\n  if (allLogs.length < 8) { wrap.innerHTML = ''; return; }\n  const d = getDrugForDisplay(logDrug);\n\n  // ── 1. Tag correlations per zone ──────────────────────────────────────────\n  // Which tags appear most in high-feel vs low-feel entries\n  const highLogs = allLogs.filter(e=>e.feel>=7);\n  const lowLogs  = allLogs.filter(e=>e.feel<=4);\n  const highTagCount = {}, lowTagCount = {};\n  highLogs.forEach(e=>e.tags&&e.tags.forEach(t=>{highTagCount[t]=(highTagCount[t]||0)+1;}));\n  lowLogs.forEach(e=>e.tags&&e.tags.forEach(t=>{lowTagCount[t]=(lowTagCount[t]||0)+1;}));\n\n  // Tags that strongly predict high feel (appear in high% but not low%)\n  const highSignal = Object.entries(highTagCount)\n    .filter(([t,c]) => c >= 2 && (highTagCount[t]||0)/(highLogs.length||1) > 0.25)\n    .sort((a,b)=>b[1]-a[1]).slice(0,4);\n  const lowSignal = Object.entries(lowTagCount)\n    .filter(([t,c]) => c >= 2 && (lowTagCount[t]||0)/(lowLogs.length||1) > 0.25)\n    .sort((a,b)=>b[1]-a[1]).slice(0,4);\n\n  // ── 2. Timing patterns — best elapsed hour window ─────────────────────────\n  // Split into early/mid/late thirds of the day's coverage and compare avg feel\n  const withElapsed = allLogs.filter(e=>e.elapsedH!=null);\n  let timingHTML = '';\n  if (withElapsed.length >= 6) {\n    // Bucket into 1hr windows, find top 3\n    const timeBuckets = {};\n    withElapsed.forEach(e => {\n      const hr = Math.floor(e.elapsedH);\n      if (hr < 0 || hr > 14) return;\n      if (!timeBuckets[hr]) timeBuckets[hr] = [];\n      timeBuckets[hr].push(e.feel);\n    });\n    const timeAvgs = Object.entries(timeBuckets)\n      .filter(([,v])=>v.length>=2)\n      .map(([hr,vals])=>({hr:parseInt(hr), avg:vals.reduce((s,v)=>s+v,0)/vals.length, n:vals.length}))\n      .sort((a,b)=>b.avg-a.avg);\n    if (timeAvgs.length >= 2) {\n      const best = timeAvgs[0];\n      const worst = timeAvgs[timeAvgs.length-1];\n      const bestLabel = `${best.hr}–${best.hr+1}hr after dose`;\n      const worstLabel = `${worst.hr}–${worst.hr+1}hr after dose`;\n      timingHTML = `<div class=\"pattern-card\">\n        <div class=\"pattern-card-title\">Your timing patterns<\u002Fdiv>\n        <div class=\"pattern-row\">\n          <span style=\"color:#40b060;font-weight:600;\">Best window<\u002Fspan>\n          <span style=\"flex:1;\">${bestLabel}<\u002Fspan>\n          <span style=\"color:#40b060;font-family:var(--font-mono);font-weight:700;\">${best.avg.toFixed(1)}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"pattern-row\">\n          <span style=\"color:#e05050;font-weight:600;\">Toughest<\u002Fspan>\n          <span style=\"flex:1;\">${worstLabel}<\u002Fspan>\n          <span style=\"color:#e05050;font-family:var(--font-mono);font-weight:700;\">${worst.avg.toFixed(1)}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"pattern-note\">Based on ${withElapsed.length} timed entries<\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n  }\n\n  // ── 3. Dose-time patterns ─────────────────────────────────────────────────\n  let doseTimeHTML = '';\n  const withDose = allLogs.filter(e=>e.dose_time);\n  if (withDose.length >= 6) {\n    const earlyDose = withDose.filter(e=>{ const [h]=e.dose_time.split(':').map(Number); return h<9; });\n    const lateDose  = withDose.filter(e=>{ const [h]=e.dose_time.split(':').map(Number); return h>=9; });\n    if (earlyDose.length>=3 && lateDose.length>=3) {\n      const earlyAvg = (earlyDose.reduce((s,e)=>s+e.feel,0)/earlyDose.length).toFixed(1);\n      const lateAvg  = (lateDose.reduce((s,e)=>s+e.feel,0)/lateDose.length).toFixed(1);\n      const diff = parseFloat(earlyAvg) - parseFloat(lateAvg);\n      if (Math.abs(diff) >= 0.5) {\n        const better = diff > 0 ? 'early' : 'late';\n        const betterAvg = diff > 0 ? earlyAvg : lateAvg;\n        const worseAvg  = diff > 0 ? lateAvg : earlyAvg;\n        doseTimeHTML = `<div class=\"pattern-card\">\n          <div class=\"pattern-card-title\">Dose time matters<\u002Fdiv>\n          <div class=\"pattern-row\">\n            <span style=\"flex:1;\">Before 9am doses<\u002Fspan>\n            <span style=\"color:${diff>0?'#40b060':'#e05050'};font-family:var(--font-mono);font-weight:700;\">${earlyAvg}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"pattern-row\">\n            <span style=\"flex:1;\">9am+ doses<\u002Fspan>\n            <span style=\"color:${diff<0?'#40b060':'#e05050'};font-family:var(--font-mono);font-weight:700;\">${lateAvg}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"pattern-note\" style=\"font-style:italic;\">\n            ${better === 'early' ? 'Earlier doses tend to land better for you' : 'Later doses tend to work better for you'}\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n      }\n    }\n  }\n\n  // ── Assemble tag section ──────────────────────────────────────────────────\n  let tagHTML = '';\n  if (highSignal.length || lowSignal.length) {\n    const highPills = highSignal.map(([t,c])=>\n      `<span class=\"pattern-tag-pill\" style=\"background:${TAG_COLORS[t]||'#aaa'}22;color:${TAG_COLORS[t]||'#888'};\">${t} ${c}x<\u002Fspan>`\n    ).join(' ');\n    const lowPills = lowSignal.map(([t,c])=>\n      `<span class=\"pattern-tag-pill\" style=\"background:${TAG_COLORS[t]||'#aaa'}22;color:${TAG_COLORS[t]||'#888'};\">${t} ${c}x<\u002Fspan>`\n    ).join(' ');\n    tagHTML = `<div class=\"pattern-card\">\n      <div class=\"pattern-card-title\">Tag patterns<\u002Fdiv>\n      ${highSignal.length ? `<div class=\"pattern-row\" style=\"flex-wrap:wrap;gap:4px;\"><span style=\"color:#40b060;font-weight:600;margin-right:4px;\">On good days:<\u002Fspan>${highPills}<\u002Fdiv>` : ''}\n      ${lowSignal.length ? `<div class=\"pattern-row\" style=\"flex-wrap:wrap;gap:5px;margin-top:5px;\"><span style=\"color:#e05050;font-weight:600;margin-right:4px;\">On rough days:<\u002Fspan>${lowPills}<\u002Fdiv>` : ''}\n    <\u002Fdiv>`;\n  }\n\n  const hasAny = tagHTML || timingHTML || doseTimeHTML;\n  if (!hasAny) { wrap.innerHTML=''; return; }\n\n  // Collapsible container\n  const isOpen = wrap.dataset.open !== 'false';\n  wrap.dataset.open = isOpen ? 'true' : 'false';\n  wrap.innerHTML = `<div>\n    <div class=\"insights-toggle-row\" onclick=\"toggleInsights()\">\n      <span>📊 Your patterns<\u002Fspan>\n      <span id=\"insightsArrow\">${isOpen?'▲':'▼'}<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"insightsBody\" style=\"display:${isOpen?'block':'none'};\">\n      ${tagHTML}${timingHTML}${doseTimeHTML}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction toggleInsights() {\n  const wrap = document.getElementById('insightsPanel');\n  const body = document.getElementById('insightsBody');\n  const arrow = document.getElementById('insightsArrow');\n  if (!body) return;\n  const open = body.style.display !== 'none';\n  body.style.display = open ? 'none' : 'block';\n  if (arrow) arrow.textContent = open ? '▼' : '▲';\n  if (wrap) wrap.dataset.open = (!open).toString();\n}\n\nfunction streakColor(n) {\n  // Yellow at 1, through amber, to rich green at 14+\n  if (n <= 0) return '#ddd';\n  if (n === 1) return '#f5c842';\n  if (n <= 3)  return '#e8a020';\n  if (n <= 7)  return '#60b840';\n  if (n <= 14) return '#2a9a30';\n  return '#1a7a20';\n}\n\nfunction renderStreakPanel() {\n  const wrap = document.getElementById('streakPanel');\n  if (!wrap) return;\n  const allLogs = getLogsForDrug(logDrug);\n  if (!allLogs.length) { wrap.innerHTML = ''; return; }\n  const d = getDrugForDisplay(logDrug);\n\n  // Build set of days that have logs\n  const logDays = new Set();\n  allLogs.forEach(e => { if (e.ts) logDays.add(appDay(e.ts)); });\n\n  const todayStr = todayKey();\n\n  // ── Streak: count consecutive days back from today with logs ──────────────\n  let streak = 0;\n  let checkDate = new Date();\n  if (checkDate.getHours() < 3) checkDate.setDate(checkDate.getDate() - 1);\n  // If today has no log yet, streak starts from yesterday\n  if (!logDays.has(todayStr)) checkDate.setDate(checkDate.getDate() - 1);\n  for (let i = 0; i < 365; i++) {\n    const dk = appDay(checkDate);\n    if (logDays.has(dk)) {\n      streak++;\n      checkDate.setDate(checkDate.getDate() - 1);\n    } else {\n      break;\n    }\n  }\n\n  const sc = streakColor(streak);\n  const streakEmoji = streak === 0 ? '' : streak >= 14 ? ' 🔥' : streak >= 7 ? ' ✨' : '';\n\n  // ── This week: last 7 days ─────────────────────────────────────────────────\n  const weekDots = [];\n  const dayNames7 = ['Su','Mo','Tu','We','Th','Fr','Sa'];\n  const todayForWeek = new Date();\n  if (todayForWeek.getHours() < 3) todayForWeek.setDate(todayForWeek.getDate() - 1);\n  let weekCount = 0;\n  for (let i = 6; i >= 0; i--) {\n    const d2 = new Date(todayForWeek);\n    d2.setDate(todayForWeek.getDate() - i);\n    const dk = appDay(d2);\n    const isPast = dk < todayStr;\n    const isToday2 = dk === todayStr;\n    const hasLog = logDays.has(dk);\n    if (hasLog) weekCount++;\n    let bg, label;\n    if (hasLog) { bg = '#40b060'; label = '✓'; }\n    else if (isPast) { bg = '#e84040'; label = '✗'; }\n    else if (isToday2) { bg = '#ddd'; label = '·'; }\n    else { bg = '#eee'; label = ''; }\n    weekDots.push(`<div class=\"week-dot\" style=\"background:${bg};\" title=\"${d2.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}\">${label}<\u002Fdiv>`);\n  }\n\n  // ── Total days logged ──────────────────────────────────────────────────────\n  const totalDays = logDays.size;\n\n  // ── Streak vs broken outcome comparison ────────────────────────────────────\n  // Compare avg feel on 7+ day streaks vs days after a gap\n  let streakAvg = null, brokenAvg = null, outcomeNote = '';\n  if (allLogs.length >= 10) {\n    // Build sorted day list with feel avgs\n    const dayFeel = {};\n    allLogs.forEach(e => {\n      if (!e.ts) return;\n      const dk = appDay(e.ts);\n      if (!dayFeel[dk]) dayFeel[dk] = [];\n      dayFeel[dk].push(e.feel);\n    });\n    const sortedDays = Object.keys(dayFeel).sort();\n    // For each day, check if it's in a 7+ streak or a broken run\n    const streakFeels = [], brokenFeels = [];\n    sortedDays.forEach((dk, i) => {\n      // Count consecutive days before this one\n      let run = 0;\n      let check = new Date(dk + 'T12:00:00');\n      for (let j = 1; j <= 30; j++) {\n        check.setDate(check.getDate() - 1);\n        if (logDays.has(appDay(check))) run++;\n        else break;\n      }\n      const avgDay = dayFeel[dk].reduce((s,v)=>s+v,0)/dayFeel[dk].length;\n      if (run >= 6) streakFeels.push(avgDay); // 7th day or beyond in a streak\n      else if (run <= 1) brokenFeels.push(avgDay); // day 1 or 2 after gap\n    });\n    if (streakFeels.length >= 3 && brokenFeels.length >= 3) {\n      streakAvg = (streakFeels.reduce((s,v)=>s+v,0)/streakFeels.length).toFixed(1);\n      brokenAvg = (brokenFeels.reduce((s,v)=>s+v,0)/brokenFeels.length).toFixed(1);\n      const diff = parseFloat(streakAvg) - parseFloat(brokenAvg);\n      if (Math.abs(diff) >= 0.4) {\n        outcomeNote = diff > 0\n          ? `On 7+ day streaks you avg <strong style=\"color:#40b060;\">${streakAvg}<\u002Fstrong> vs <strong style=\"color:#e05050;\">${brokenAvg}<\u002Fstrong> after gaps`\n          : `Consistent days avg <stro
