ng>${streakAvg}<\u002Fstrong> · gap days avg <strong>${brokenAvg}<\u002Fstrong>`;\n      }\n    }\n  }\n\n  wrap.innerHTML = `<div class=\"streak-panel\">\n    <div class=\"streak-card\" style=\"border-color:${sc}40;background:${sc}10;\">\n      <div class=\"streak-num\" style=\"color:${sc};\">${streak}${streakEmoji}<\u002Fdiv>\n      <div class=\"streak-label\">day streak<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"streak-card\">\n      <div class=\"streak-num\" style=\"color:${d.color};\">${weekCount}<span style=\"font-size:0.5em;font-weight:normal;color:var(--ink-3);\">/7<\u002Fspan><\u002Fdiv>\n      <div class=\"streak-label\">this week<\u002Fdiv>\n      <div class=\"week-dots\">${weekDots.join('')}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"streak-card\">\n      <div class=\"streak-num\" style=\"color:var(--ink-3);\">${totalDays}<\u002Fdiv>\n      <div class=\"streak-label\">days logged total<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  ${outcomeNote ? `<div class=\"streak-outcome-note\">${outcomeNote}<\u002Fdiv>` : ''}`;\n}\n\nfunction setCalView(v) {\n  calView = v;\n  renderCalendarStrip();\n}\n\nfunction renderCalendarStrip() {\n  const wrap = document.getElementById('calendarStrip');\n  if (!wrap) return;\n  const allLogs = getLogsForDrug(logDrug);\n  if (!allLogs.length) { wrap.innerHTML=''; return; }\n\n  // Group logs by date\n  const byDate = {};\n  allLogs.forEach(e => {\n    if (!e.ts) return;\n    const dk = appDay(e.ts);\n    if (!byDate[dk]) byDate[dk] = [];\n    byDate[dk].push(e);\n  });\n\n  const todayStr = todayKey();\n  const todayLogical = new Date();\n  if (todayLogical.getHours() < 3) todayLogical.setDate(todayLogical.getDate()-1);\n\n  // Toggle buttons\n  const toggleHTML = `<div class=\"cal-view-toggle\">\n    <button class=\"cal-view-btn${calView==='strip'?' active':''}\" onclick=\"setCalView('strip')\">Strip<\u002Fbutton>\n    <button class=\"cal-view-btn${calView==='month'?' active':''}\" onclick=\"setCalView('month')\">Month<\u002Fbutton>\n  <\u002Fdiv>`;\n\n  let html = toggleHTML;\n\n  if (calView === 'strip') {\n    // ── 30-day horizontal strip ──────────────────────────────────────────────\n    const days = [];\n    for (let i=29; i>=0; i--) {\n      const d = new Date(todayLogical);\n      d.setDate(todayLogical.getDate()-i);\n      days.push(d);\n    }\n    const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];\n\n    html += '<div class=\"cal-strip\">';\n    days.forEach(d => {\n      const dk = appDay(d);\n      const entries = byDate[dk] || [];\n      const isToday = dk === todayStr;\n      const isSel = dk === calSelectedDate;\n      const isPast = dk < todayStr;\n      const isMissed = !entries.length && isPast;\n      const avg = entries.length ? (entries.reduce((s,e)=>s+e.feel,0)/entries.length) : null;\n      const dots = entries.slice(0,3).map(e=>`<div class=\"cal-dot\" style=\"background:${feelColor(e.feel,'#ccc')};\"><\u002Fdiv>`).join('');\n      html += `<div class=\"cal-day${isSel?' active':''}${isToday?' today':''}${isMissed?' missed':''}\" onclick=\"calSelectDate('${dk}')\">\n        <div class=\"cal-day-label\">${dayNames[d.getDay()]}<\u002Fdiv>\n        <div class=\"cal-day-num\" style=\"${isMissed?'color:#f09090;':''}\">${d.getDate()}<\u002Fdiv>\n        <div class=\"cal-day-dot\">${dots || '<div style=\"width:6px;height:6px;\"><\u002Fdiv>'}<\u002Fdiv>\n        <div class=\"cal-day-avg\" style=\"color:${avg?feelColor(avg,'#ccc'):'transparent'}\">${avg?avg.toFixed(1):''}<\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n    html += '<\u002Fdiv>';\n    html += `<div class=\"cal-legend\">\n      <div class=\"cal-legend-left\"><span style=\"color:#f09090;\">■<\u002Fspan> missed &nbsp; <span style=\"color:#40b060;\">■<\u002Fspan> logged<\u002Fdiv>\n      <span>${calSelectedDate ? `Showing: ${calSelectedDate} · <span style=\"cursor:pointer;color:var(--brand);\" onclick=\"calSelectDate(null)\">clear<\u002Fspan>` : 'Tap a day to filter'}<\u002Fspan>\n    <\u002Fdiv>`;\n\n    wrap.innerHTML = html;\n    setTimeout(()=>{ const s=wrap.querySelector('.cal-strip'); if(s) s.scrollLeft=s.scrollWidth; }, 50);\n\n  } else {\n    // ── Monthly grid ────────────────────────────────────────────────────────\n    // Show the month containing today\n    const monthDate = new Date(todayLogical.getFullYear(), todayLogical.getMonth() + calMonthOffset, 1);\n    const monthLabel = monthDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});\n    const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0).getDate();\n    const firstDow = monthDate.getDay(); // 0=Sun\n    const dayNames7 = ['Su','Mo','Tu','We','Th','Fr','Sa'];\n\n    html += `<div class=\"cal-month-nav\">\n      <button class=\"cal-month-nav-btn\" onclick=\"shiftMonth(-1)\">‹<\u002Fbutton>\n      <div class=\"cal-month-title\">${monthLabel}<\u002Fdiv>\n      <button class=\"cal-month-nav-btn\" onclick=\"shiftMonth(1)\">›<\u002Fbutton>\n    <\u002Fdiv>`;\n\n    // Day of week headers\n    html += `<div class=\"cal-month-grid\" style=\"margin-bottom:3px;\">\n      ${dayNames7.map(n=>`<div class=\"cal-dow-header\">${n}<\u002Fdiv>`).join('')}\n    <\u002Fdiv>`;\n\n    html += '<div class=\"cal-month-grid\">';\n    // Empty cells before first day\n    for (let i=0; i<firstDow; i++) html += '<div><\u002Fdiv>';\n\n    for (let day=1; day<=daysInMonth; day++) {\n      const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);\n      const dk = appDay(d);\n      const entries = byDate[dk] || [];\n      const isToday = dk === todayStr;\n      const isSel = dk === calSelectedDate;\n      const isPast = dk < todayStr;\n      const avg = entries.length ? (entries.reduce((s,e)=>s+e.feel,0)/entries.length) : null;\n\n      let bg, textColor, borderStyle;\n      if (entries.length) {\n        // Logged — green tint, intensity from avg feel\n        const intensity = Math.round(((avg||5)-1)/9 * 80 + 20); // 20-100%\n        bg = `hsl(130,50%,${100-intensity*0.3}%)`;\n        textColor = intensity > 60 ? '#1a5a20' : '#2a8030';\n        borderStyle = 'border-color:#80c880;';\n      } else if (isPast) {\n        // Missed — red tint\n        bg = '#fff0f0';\n        textColor = '#cc6060';\n        borderStyle = 'border-color:#ffcccc;';\n      } else if (isToday) {\n        bg = '#fafafa';\n        textColor = '#444';\n        borderStyle = '';\n      } else {\n        // Future\n        bg = '#fafafa';\n        textColor = '#ccc';\n        borderStyle = '';\n      }\n\n      html += `<div class=\"cal-month-day${isToday?' today':''}${isSel?' selected':''}\"\n        style=\"background:${bg};color:${textColor};${borderStyle}\"\n        onclick=\"calSelectDate('${dk}')\">\n        <div style=\"font-weight:${isToday?'bold':'normal'}\">${day}<\u002Fdiv>\n        ${avg ? `<div style=\"font-size:0.65em;opacity:0.85;\">${avg.toFixed(1)}<\u002Fdiv>` : ''}\n      <\u002Fdiv>`;\n    }\n    html += '<\u002Fdiv>';\n\n    // Legend\n    html += `<div class=\"cal-legend\">\n      <div class=\"cal-legend-left\">\n        <span><span style=\"color:#40b060;\">■<\u002Fspan> logged<\u002Fspan>\n        <span><span style=\"color:#f09090;\">■<\u002Fspan> missed<\u002Fspan>\n        <span><span style=\"color:var(--line-strong);\">■<\u002Fspan> upcoming<\u002Fspan>\n      <\u002Fdiv>\n      ${calSelectedDate ? `<span style=\"cursor:pointer;color:var(--brand);\" onclick=\"calSelectDate(null)\">clear filter<\u002Fspan>` : ''}\n    <\u002Fdiv>`;\n\n    wrap.innerHTML = html;\n  }\n}\n\nlet calMonthOffset = 0; // 0 = current month, -1 = last month, etc.\n\nfunction shiftMonth(dir) {\n  calMonthOffset += dir;\n  renderCalendarStrip();\n}\n\nfunction calSelectDate(dk) {\n  calSelectedDate = (dk === calSelectedDate) ? null : dk;\n  renderCalendarStrip();\n  renderLogList();\n}\n\nfunction entryHTML(e, d) {\n  const feel10 = `<span style=\"color:${feelColor(e.feel,d.color)};\">${e.feel}/10<\u002Fspan>`;\n  const elStr = e.elapsedH!=null ? ` · ${e.elapsedH<1?Math.round(e.elapsedH*60)+'m':Math.floor(e.elapsedH)+'h '+Math.round((e.elapsedH%1)*60)+'m'} after dose` : '';\n  return `<div class=\"log-entry\" style=\"border-left-color:${feelColor(e.feel,d.color)};\" id=\"entry_${e.id}\">\n    <div class=\"log-entry-header\">\n      <div style=\"flex:1;\">\n        <div class=\"log-entry-feel\">${feel10} ${moodEmoji(e.feel)}<\u002Fdiv>\n        <div class=\"log-entry-time\">${to12(e.time)}${elStr}<\u002Fdiv>\n        <div class=\"log-entry-zone\">${e.zone.replace(' ⭐','')}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"log-entry-actions\">\n        <span class=\"del-log\" onclick=\"deleteLog(${e.id})\">✕<\u002Fspan>\n        <span class=\"edit-time-btn\" onclick=\"openEditTime(${e.id})\">✏ time<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${e.tags&&e.tags.length?`<div class=\"log-entry-tags\">${e.tags.map(t=>`<span class=\"log-tag\" style=\"background:${TAG_COLORS[t]}22;color:${TAG_COLORS[t]};\">${t}<\u002Fspan>`).join('')}<\u002Fdiv>`:''}\n    ${e.note?`<div class=\"log-entry-note\">\"${e.note}\"<\u002Fdiv>`:''}\n    <div id=\"edittime_${e.id}\" class=\"log-edit-inline\" style=\"display:none;\">\n      <div class=\"log-edit-label\">Edit log time — zones will recalculate<\u002Fdiv>\n      <div class=\"log-edit-row\">\n        <input type=\"time\" id=\"etInput_${e.id}\" value=\"${e.time}\" class=\"log-edit-input\">\n        <span class=\"log-edit-preview\" id=\"etPreview_${e.id}\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"log-edit-btns\">\n        <button onclick=\"saveEditTime(${e.id})\" class=\"log-edit-save\" style=\"background:${d.color};\">Save<\u002Fbutton>\n        <button onclick=\"closeEditTime(${e.id})\" class=\"log-edit-cancel\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderLogList() {\n  renderStreakPanel();\n  renderInsightsPanel();\n  renderCalendarStrip();\n  const logs = getFilteredLogs();\n  const list = document.getElementById('logList');\n  const empty = document.getElementById('logEmpty');\n  if (!logs.length) { list.innerHTML=''; empty.style.display='block'; return; }\n  empty.style.display = 'none';\n  const d = getDrugForDisplay(logDrug);\n\n  if (logView === 'cycle') {\n    renderLogByCycle(logs, d, list);\n  } else {\n    renderLogByDay(logs, d, list);\n  }\n}\n\nfunction renderLogByDay(logs, d, list) {  // d = getDrugForDisplay(logDrug)\n  // Group by date — sort entries within each day newest first\n  const byDate = {};\n  logs.forEach(e => {\n    const dk = e.ts ? appDay(e.ts) : 'unknown';\n    if (!byDate[dk]) byDate[dk] = [];\n    byDate[dk].push(e);\n  });\n\n  // Sort days newest first, cap at 10 days unless a calendar date is selected\n  let sortedDates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a));\n  if (!calSelectedDate) sortedDates = sortedDates.slice(0, 10);\n\n  let html = '';\n\n  sortedDates.forEach((dk, idx) => {\n    // Sort entries within the day newest first by time string\n    const dayEntries = byDate[dk].sort((a,b) => {\n      // Compare by ts if available, fall back to time string\n      if (a.ts && b.ts) return new Date(b.ts) - new Date(a.ts);\n      return (b.time||'').localeCompare(a.time||'');\n    });\n\n    const avg = dayEntries.reduce((s,e)=>s+e.feel,0)/dayEntries.length;\n    const date = new Date(dk+'T12:00:00');\n    const dateLabel = date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});\n    const uid = 'dg_'+dk.replace(/-/g,'');\n    const isToday = dk === todayKey();\n    const isOpen = idx < 3; // show most recent 3 days open, rest collapsed\n\n    // Dose schedule for this day\n    let doseSchedule = '';\n    const dosedDrugs = ST.active.filter(k=>ST.doses[k]);\n    if (dosedDrugs.length) {\n      doseSchedule = `<div class=\"dose-schedule\">\n        ${dosedDrugs.map(k=>{\n          const dr=DRUGS[k];\n          return `<span class=\"dose-pill-badge\" style=\"border-color:${dr.color};color:${dr.color};background:${dr.light};\">${dr.short} ${to12(ST.doses[k])}<\u002Fspan>`;\n        }).join('')}\n      <\u002Fdiv>`;\n    }\n\n    html += `<div class=\"day-group\">\n      <div class=\"day-group-header\" onclick=\"toggleDayGroup('${uid}')\">\n        <div>\n          <div class=\"day-group-title\">${isToday?'Today — ':''}${dateLabel}<\u002Fdiv>\n          <div class=\"day-group-meta\">${dayEntries.length} entr${dayEntries.length===1?'y':'ies'} · avg ${avg.toFixed(1)} ${moodEmoji(Math.round(avg))}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\">\n          <div class=\"day-group-avg\" style=\"color:${feelColor(avg,d.color)};\">${avg.toFixed(1)}<\u002Fdiv>\n          <div id=\"${uid}_arr\" class=\"day-group-arrow\">${isOpen?'▼':'▶'}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"${uid}\" class=\"day-group-body\" style=\"display:${isOpen?'block':'none'};\">\n        ${doseSchedule}\n        ${dayEntries.map(e=>entryHTML(e,d)).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n\n  // If more than 10 days exist and not filtered, show a note\n  const totalDays = Object.keys(byDate).length;\n  if (!calSelectedDate && totalDays > 10) {\n    html += `<div class=\"log-older-note\">\n      Showing 10 most recent days · ${totalDays - 10} older — tap a day in the calendar to view\n    <\u002Fdiv>`;\n  }\n\n  list.innerHTML = html;\n}\n\nfunction renderLogByCycle(logs, d, list) {\n  // Group entries by which zone they were logged in\n  const zoneOrder = d.zones.map(z=>z.label);\n  const byZone = {};\n  logs.forEach(e => {\n    const zk = e.zone || '—';\n    if (!byZone[zk]) byZone[zk] = [];\n    byZone[zk].push(e);\n  });\n\n  // Sort by zone order\n  const sortedZones = Object.keys(byZone).sort((a,b)=>{\n    const ai = zoneOrder.indexOf(a), bi = zoneOrder.indexOf(b);\n    return (ai===-1?99:ai)-(bi===-1?99:bi);\n  });\n\n  let html = '';\n  sortedZones.forEach(zk => {\n    const zEntries = byZone[zk];\n    const avg = zEntries.reduce((s,e)=>s+e.feel,0)/zEntries.length;\n    const zoneData = d.zones.find(z=>z.label===zk);\n    const borderColor = zoneData?.peak?'#f0c000':zoneData?.second?'#aaa':zoneData?.third?'#e8a060':d.color;\n    const uid = 'cg_'+zk.replace(/[^a-z0-9]/gi,'');\n\n    html += `<div class=\"cycle-group\">\n      <div class=\"cycle-group-header\" style=\"border-color:${borderColor};background:${feelColor(avg,d.color)}18;\" onclick=\"toggleDayGroup('${uid}')\">\n        <div>\n          <div class=\"cycle-group-title\">${zk}<\u002Fdiv>\n          <div class=\"cycle-group-meta\">${zEntries.length} entr${zEntries.length===1?'y':'ies'} · avg ${avg.toFixed(1)} ${moodEmoji(Math.round(avg))}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\">\n          <div class=\"day-group-avg\" style=\"color:${feelColor(avg,d.color)};\">${avg.toFixed(1)}<\u002Fdiv>\n          <div id=\"${uid}_arr\" class=\"day-group-arrow\">▼<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"${uid}\" class=\"day-group-body\" style=\"display:none;\">\n        ${zEntries.map(e=>entryHTML(e,d)).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n\n  list.innerHTML = html;\n}\n\nfunction toggleDayGroup(uid) {\n  const el = document.getElementById(uid);\n  const arr = document.getElementById(uid+'_arr');\n  if (!el) return;\n  const open = el.style.display !== 'none';\n  el.style.display = open ? 'none' : 'block';\n  if (arr) arr.textContent = open ? '▼' : '▲';\n}\n\nfunction deleteLog(id) {\n  if (!confirm('Delete this entry?')) return;\n  ST.logs = (ST.logs||[]).filter(e=>e.id!==id);\n  save();\n  if (currentUser) {\n    supa.from('logs').delete().eq('id', id).eq('user_id', currentUser.id)\n      .then(({error}) => { if(error) console.error('Delete error:', error); });\n  }\n  renderLogStats(); renderLogList(); updateAdaptiveNotes(); renderAll();\n}\n\nfunction feelColor(f, defaultColor) {\n  if (f>=8) return '#2a9d4a';\n  if (f>=6) return '#88b030';\n  if (f>=4) return '#e0a000';\n  return '#e05050';\n}\n\nfunction moodEmoji(f) {\n  if (f>=9) return '🔥'; if (f>=7) return '✨'; if (f>=5) return '🙂'; if (f>=3) return '😐'; return '😶';\n}\n\n// ─── ADAPTIVE ZONE NOTES ──────────────────────────────────────────────────────\n\nfunction updateAdaptiveNotes() {\n  // triggers re-render which picks up adaptive data\n  renderZones();\n}\n\nfunction getAdaptiveNote(drugKey, zoneName) {\n  // Returns null if <2 logs, otherwise rich structured data for \"yours\" panel\n  const logs = (ST.logs||[]).filter(e=>e.drug===drugKey && e.zone===zoneName && e.elapsedH!=null);\n  if (logs.length < 2) return null;\n\n  const d = DRUGS[drugKey];\n  const avg = logs.reduce((s,e)=>s+e.feel,0)/logs.length;\n  const count = logs.length;\n\n  // Tag frequency\n  const tagCount = {};\n  logs.forEach(e=>e.tags&&e.tags.forEach(t=>{tagCount[t]=(tagCount[t]||0)+1;}));\n  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,3)\n    .filter(([t,c]) => c >= 2 || count <= 3); // require 2+ occurrences unless few logs\n\n  // Timing pattern — avg elapsed when in this zone\n  const avgElapsed = logs.reduce((s,e)=>s+e.elapsedH,0)/logs.length;\n\n  // Feel distribution\n  const high = logs.filter(e=>e.feel>=7).length;\n  const low  = logs.filter(e=>e.feel<=4).length;\n  const feelTrend = high/count >= 0.6 ? 'mostly good' : low/count >= 0.6 ? 'often rough' : 'mixed';\n\n  // Recent notes (last 2 with notes)\n  const recentNotes = logs.filter(e=>e.note&&e.note.trim()).slice(0,2).map(e=>e.note.trim());\n\n  return { count, avg, avgElapsed, topTags, feelTrend, recentNotes, color: feelColor(avg, d.color), drugColor: d.color };\n}\n\nfunction yoursHTML(drugKey, zoneName, uid) {\n  const data = getAdaptiveNote(drugKey, zoneName);\n  const d = getDrugForDisplay(drugKey);\n  const count = data ? data.count : ((ST.logs||[]).filter(e=>e.drug===drugKey&&e.zone===zoneName)).length;\n\n  if (!data) {\n    // 0–1 logs — show placeholder with how many more needed\n    const needed = 3 - count;\n    return `<div style=\"color:#bbb;font-size:0.88em;padding:6px 0;\">\n      Log ${needed} more time${needed===1?'':'s'} in this zone to unlock your personal notes.\n      <div style=\"margin-top:6px;background:#f5f5f5;border-radius:6px;height:6px;overflow:hidden;\">\n        <div style=\"height:100%;background:#c070e8;width:${Math.round(count/3*100)}%;transition:width 0.3s;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  const { avg, avgElapsed, topTags, feelTrend, recentNotes, color, drugColor } = data;\n  const hrsStr = avgElapsed < 1\n    ? Math.round(avgElapsed*60)+'m after dose'\n    : Math.floor(avgElapsed)+'h '+Math.round((avgElapsed%1)*60)+'m after dose';\n\n  let lines = [];\n\n  // ── Always show (2+ logs) ──────────────────────────────────────────────────\n  lines.push(`<div class=\"zone-yours-item\">\n    <span class=\"zone-yours-stat\" style=\"background:${color}18;color:${color};\">${avg.toFixed(1)}/10<\u002Fspan>\n    avg feel across ${count} log${count===1?'':'s'} · <em style=\"color:#888;\">${feelTrend}<\u002Fem>\n  <\u002Fdiv>`);\n\n  // ── 3+ logs: add top tags ──────────────────────────────────────────────────\n  if (count >= 3 && topTags.length) {\n    const tagHTML = topTags.map(([t,c])=>\n      `<span style=\"background:${TAG_COLORS[t]}22;color:${TAG_COLORS[t]};border-radius:10px;padding:1px 8px;font-size:0.82em;font-weight:bold;\">${t} <span style=\"opacity:0.6;\">${c}x<\u002Fspan><\u002Fspan>`\n    ).join(' ');\n    lines.push(`<div class=\"zone-yours-item\">Most common: ${tagHTML}<\u002Fdiv>`);\n  }\n\n  // ── 3+ logs: timing note ──────────────────────────────────────────────────\n  if (count >= 3) {\n    lines.push(`<div class=\"zone-yours-item\">\n      <span class=\"zone-yours-stat\">~${hrsStr}<\u002Fspan> avg when you log here\n    <\u002Fdiv>`);\n  }\n\n  // ── 6+ logs: feel trend sentence ─────────────────────────────────────────\n  if (count >= 6) {\n    const high = data.count > 0 ? (data.avg >= 6.5 ? 'This tends to be a good window for you.' : data.avg <= 4.5 ? 'This zone has been rough for you consistently.' : 'Your experience here varies.') : '';\n    if (high) lines.push(`<div class=\"zone-yours-item\" style=\"color:#666;font-style:italic;\">${high}<\u002Fdiv>`);\n  }\n\n  // ── Notes: most recent + collapsed rest ────────────────────────────────\n  const allNotes = recentNotes;\n  if (allNotes.length && count >= 3) {\n    const first = allNotes[0];\n    const rest = allNotes.slice(1);\n    const notesUID = uid + '_notes_more';\n    const moreHTML = rest.length ? `<span style=\"cursor:pointer;color:#c070e8;font-size:0.82em;font-style:normal;\" onclick=\"toggleZoneNotes('${notesUID}')\"> +${rest.length} more<\u002Fspan>\n      <div id=\"${notesUID}\" style=\"display:none;margin-top:4px;\">\n        ${rest.map(n=>`<div style=\"color:#888;font-style:italic;margin-top:3px;\">\"${n}\"<\u002Fdiv>`).join('')}\n      <\u002Fdiv>` : '';\n    lines.push(`<div class=\"zone-yours-item\" style=\"color:#888;font-style:italic;\">\"${first}\"${moreHTML}<\u002Fdiv>`);\n  }\n\n  return lines.join('');\n}\n\n// ─── ADAPTIVE PEAK CALCULATION ────────────────────────────────────────────────\nconst MIN_LOGS_FOR_ADAPT = 6;\nconst PHARMACOKINETIC_WEIGHT = 8; // stronger anchor — harder to move away from defaults\nconst DECAY = 0.88; // exponential decay per log (newest = 1.0, each older = * 0.88)\n\n// Max shift per drug based on published Tmax variability ranges (±1 SD from literature)\n// Ritalin LA: second peak range 3–10hr (±3.5hr), first peak range 0.5–3hr (±1.25hr)\n// Concerta: Tmax 6.8 ± 1.8hr SD → use ±2hr as realistic individual range\n// Wellbutrin XL: Tmax ~5hr, flagged \"highly variable\" — use ±2hr\n// Lamictal IR: Tmax 1.4–4.8hr range (±1.7hr) — mood effects much slower, use ±1.5hr\nconst DRUG_MAX_SHIFT = {\n  ritalin:   2.0,  // second peak can realistically vary 3–10hr (literature range)\n  concerta:  2.0,  // Tmax 6.8 ± 1.8hr SD from FDA label\n  wellbutrin:2.0,  // explicitly flagged \"highly variable\" for XL\n  lamictal:  1.5,  // Tmax 1.4–4.8hr, but mood effects are gradual not sharp\n  remeron:   1.5,  // Tmax ~2hr, sedation onset 30min–2hr; long half-life means small shifts matter\n  lexapro:   1.0   // Tmax 4–5hr ±1.5hr SD; effects cumulative so adaptive less meaningful but tracking still useful\n};\n\nfunction getPersonalCurve(drugKey) {\n  const logs = (ST.logs||[])\n    .filter(e => e.drug===drugKey && e.elapsedH!=null && e.elapsedH >= 0)\n    .sort((a,b) => b.id - a.id); // newest first\n  if (logs.length < MIN_LOGS_FOR_ADAPT) return null;\n\n  const d = DRUGS[drugKey];\n  const baseZones = drugKey === 'remeron' ? getRemeronZones() : d.zones;\n\n  // Find pharmacokinetic default peak center\n  const peakZoneIdx = baseZones.findIndex(z => z.peak);\n  if (peakZoneIdx === -1) return null;\n  const origPeak = baseZones[peakZoneIdx];\n  const origCenter = (origPeak.start + (origPeak.end===Infinity ? origPeak.start+2 : origPeak.end)) / 2;\n\n  // Build smoothed histogram — newer entries weighted higher, older entries decay\n  // Also anchor the histogram with phantom \"default\" entries so early logs don't overcorrect\n  const bucketSize = 0.2;  // 12-min buckets — better resolution than 0.5hr given 20min minimum shift threshold\n  const maxH = 16;\n  const buckets = {};\n  for (let h=0; h<maxH; h+=bucketSize) {\n    buckets[h.toFixed(1)] = {weightedTotal:0, weight:0};\n  }\n\n  // Phantom anchor entries at default peak — resist drift from sparse data\n  const anchorBucket = (Math.floor(origCenter / bucketSize) * bucketSize).toFixed(1);\n  if (buckets[anchorBucket]) {\n    // Add PHARMACOKINETIC_WEIGHT phantom high-feel entries at the default peak\n    // These act as prior — get outvoted as real data accumulates\n    buckets[anchorBucket].weightedTotal += PHARMACOKINETIC_WEIGHT * 8; // phantom feel=8\n    buckets[anchorBucket].weight += PHARMACOKINETIC_WEIGHT;\n    // Slightly lesser anchors in adjacent buckets for smooth falloff\n    [-bucketSize, bucketSize].forEach(offset => {\n      const adjKey = ((parseFloat(anchorBucket) + offset)).toFixed(1);\n      if (buckets[adjKey]) {\n        buckets[adjKey].weightedTotal += PHARMACOKINETIC_WEIGHT * 0.4 * 7;\n        buckets[adjKey].weight += PHARMACOKINETIC_WEIGHT * 0.4;\n      }\n    });\n  }\n\n  // Add real log entries with exponential decay (newest entries count most)\n  logs.forEach((e, i) => {\n    const w = Math.pow(DECAY, i); // newest = 1.0, oldest = DECAY^(n-1)\n    const bucket = Math.floor(e.elapsedH / bucketSize) * bucketSize;\n    const key = bucket.toFixed(1);\n    if (buckets[key]) {\n      buckets[key].weightedTotal += w * e.feel;\n      buckets[key].weight += w;\n    }\n  });\n\n  // Compute weighted averages per bucket\n  const scored = Object.entries(buckets)\n    .filter(([,v]) => v.weight > 0)\n    .map(([h,v]) => ({ h:parseFloat(h), avg: v.weightedTotal/v.weight, weight: v.weight }))\n    .sort((a,b) => b.avg - a.avg);\n\n  if (!scored.length) return null;\n\n  // Peak centroid from top-scoring buckets (within 85% of best)\n  const topScore = scored[0].avg;\n  // Include all buckets within 1 integer tier of the peak\n  // e.g. peak=8.3 → floor=8 → cutoff=7.0, so all 7s count\n  // e.g. peak=7.1 → floor=7 → cutoff=6.0, so all 6s count\n  const threshold = Math.floor(topScore) - 1;\n  const peakBuckets = scored.filter(s => s.avg >= threshold);\n  const weightedH = peakBuckets.reduce((s,b) => s + b.h * b.avg, 0) / peakBuckets.reduce((s,b) => s+b.avg, 0);\n\n  const rawShift = weightedH - origCenter;\n\n  // Don't adjust if shift is tiny (< 20 min)\n  if (Math.abs(rawShift) < 0.33) return null;\n\n  // Scale allowed shift by confidence: starts at 25% of max, grows to 100% at 20+ logs\n  const confScale = Math.min(logs.length / 20, 1);\n  const drugMax = DRUG_MAX_SHIFT[drugKey] || 1.5;\n  const maxAllowedShift = drugMax * (0.25 + confScale * 0.75); // 25%→100% of per-drug max\n  const clampedShift = Math.max(-maxAllowedShift, Math.min(maxAllowedShift, rawShift));\n\n  const adjustedZones = baseZones.map(z => {\n    const az = {...z};\n    if (z.label.includes('Baseline') || z.label.includes('Back to') || z.label.includes('Next Dose')) return az;\n    az.start = Math.max(0, parseFloat((z.start + clampedShift).toFixed(1)));\n    az.end = z.end === Infinity ? Infinity : Math.max(az.start + 0.5, parseFloat((z.end + clampedShift).toFixed(1)));\n    return az;\n  });\n\n  for (let i=1; i<adjustedZones.length; i++) {\n    if (adjustedZones[i].end !== Infinity && adjustedZones[i-1].end !== Infinity) {\n      adjustedZones[i].start = adjustedZones[i-1].end;\n    }\n  }\n\n  // Confidence: based on log count + score spread (tight cluster = more confident)\n  const highFeelLogs = logs.filter(e=>e.feel>=7).length;\n  const spreadConfidence = Math.min(logs.length / 12, 1);\n  const dataConfidence = Math.min(highFeelLogs / 5, 1);\n  const confidence = (spreadConfidence * 0.6 + dataConfidence * 0.4);\n\n  return {\n    zones: adjustedZones,\n    shift: clampedShift,\n    rawShift,\n    personalPeakH: weightedH,\n    logCount: logs.length,\n    highFeelLogs,\n    confidence,\n    origCenter\n  };\n}\n\nfunction getRemeronZones() {\n  // Returns Remeron zones adjusted for biological sex (half-life difference)\n  // Female ~37hr, Male ~26hr — ~40% longer residual for female\n  // Base zones use male as default (conservative — less grogginess)\n  const sex = ST.sex;\n  const base = DRUGS.remeron.zones;\n  if (!sex) return base;\n\n  // Half-life ratio: female 37hr / male 26hr = 1.42\n  // We scale the duration of Residual Sedation and Clearing zones\n  // Onset, Peak Sedation, Deep Sleep mostly unchanged — those are absorption-driven\n  // Residual Sedation: male 5–8hr → female 5–9.5hr\n  // Clearing: male 8–12hr → female 9.5–14hr\n  // Baseline: shifts accordingly\n  if (sex === 'female') {\n    return base.map(z => {\n      if (z.label === 'Residual Sedation') return {...z, start:5, end:9.5,\n        notes: z.notes.map(n => n.replace('37hr half-life)', '37hr half-life — your half-life as female)').replace('Half-life 20–40hr', 'Half-life ~37hr (female)'))};\n      if (z.label === 'Clearing') return {...z, start:9.5, end:14,\n        notes: z.notes.map(n => n.replace('Sedation fading', 'Sedation fading more slowly than average — female half-life ~37hr means slower clearance'))};\n      if (z.label === 'Baseline / Pre-dose') return {...z, start:14};\n      return z;\n    });\n  } else {\n    // Male — slightly tighter than default (default was already male-ish but let's be explicit)\n    return base.map(z => {\n      if (z.label === 'Residual Sedation') return {...z, start:5, end:8,\n        notes: z.notes.map(n => n.replace('37hr half-life)', '26hr half-life — your half-life as male)').replace('Half-life 20–40hr', 'Half-life ~26hr (male)'))};\n      if (z.label === 'Clearing') return {...z, start:8, end:11,\n        notes: z.notes.map(n => n.replace('Sedation fading', 'Sedation fading — male half-life ~26hr means faster clearance than female'))};\n      if (z.label === 'Baseline / Pre-dose') return {...z, start:11};\n      return z;\n    });\n  }\n}\n\nfunction getEffectiveZones(drugKey) {\n  // For remeron, apply sex-based half-life adjustment first, then adaptive\n  let baseZones = drugKey === 'remeron' ? getRemeronZones() : DRUGS[drugKey].zones;\n\n  if (ST.adaptiveOff && ST.adaptiveOff[drugKey]) return {zones: baseZones, adapted: false};\n  const curve = getPersonalCurve(drugKey);\n  if (!curve) return {zones: baseZones, adapted: false};\n  return {zones: curve.zones, adapted: true, curve};\n}\n\nfunction resetAdaptive(drugKey) {\n  if (!ST.adaptiveOff) ST.adaptiveOff = {};\n  ST.adaptiveOff[drugKey] = !ST.adaptiveOff[drugKey];\n  save();\n  renderZones();\n  renderNow();\n  renderTimeline();\n}\n\nfunction adaptiveBannerHTML(drugKey) {\n  const d = DRUGS[drugKey];\n  const logs = (ST.logs||[]).filter(e=>e.drug===drugKey && e.elapsedH!=null);\n  if (logs.length === 0) return '';\n\n  if (logs.length < MIN_LOGS_FOR_ADAPT) {\n    return `<div class=\"adaptive-peak-banner adaptive-progressing\">\n      <div>👤 <b>${logs.length}/${MIN_LOGS_FOR_ADAPT} feeling entries<\u002Fb> needed to calibrate your personal peak<\u002Fdiv>\n      <div class=\"adaptive-sub\">Zones will shift to match your real experience as you log<\u002Fdiv>\n      <div class=\"adaptive-progress-bar\"><div class=\"adaptive-progress-fill\" style=\"width:${(logs.length/MIN_LOGS_FOR_ADAPT*100).toFixed(0)}%;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  const isOff = ST.adaptiveOff && ST.adaptiveOff[drugKey];\n  if (isOff) {\n    return `<div class=\"adaptive-peak-banner adaptive-paused\">\n      👤 Personal calibration <b>paused<\u002Fb> — showing pharmacokinetic defaults\n      <span class=\"reset-adaptive\" onclick=\"resetAdaptive('${drugKey}')\">re-enable<\u002Fspan>\n    <\u002Fdiv>`;\n  }\n\n  const {adapted, curve} = getEffectiveZones(drugKey);\n  if (!curve) {\n    // Have enough logs but shift is too small to matter\n    return `<div class=\"adaptive-peak-banner\" style=\"background:${d.light};border-color:${d.color};color:${d.color};\">\n      👤 <b>Based on your ${logs.length} feeling entries<\u002Fb> — your timing matches the default curve closely\n      <div class=\"adaptive-sub\">Keep logging — zones will adjust if a pattern emerges<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  const drugMax = DRUG_MAX_SHIFT[drugKey] || 1.5;\n  const drugMaxMin = Math.round(drugMax * 60);\n  const shiftMin = Math.round(Math.abs(curve.shift) * 60);\n  const dir = curve.shift > 0 ? 'later' : 'earlier';\n  const confPct = Math.round(curve.confidence * 100);\n  const stabilizing = curve.logCount < 10 ? ' · still stabilizing' : '';\n\n  const dataDesc = curve.highFeelLogs >= 3\n    ? `${curve.highFeelLogs} high-feel entries confirm this`\n    : `based on ${curve.logCount} entries so far`;\n\n  return `<div class=\"adaptive-peak-banner\" style=\"background:${d.light};border-color:${d.color};color:${d.color};\">\n    <div>👤 <b>Calibrated from your feeling entries<\u002Fb> — your peak runs ~${shiftMin}min ${dir} than average<\u002Fdiv>\n    <div class=\"adaptive-sub\" style=\"color:${d.color};\">${dataDesc} · ${confPct}% confidence${stabilizing} · up to ±${drugMaxMin}min natural variation for this drug<\u002Fdiv>\n    <div class=\"adaptive-confidence-row\">\n      <div class=\"adaptive-progress-bar bar\"><div class=\"adaptive-progress-fill\" style=\"width:${confPct}%;background:${d.color};\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"reset-adaptive\" onclick=\"resetAdaptive('${drugKey}')\">reset<\u002Fspan>\n      <span class=\"reset-adaptive\" onclick=\"goPage('curve')\">view curve →<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// ─── ADAPTIVE CURVE PAGE ─────────────────────────────────────────────────────\n\nfunction renderCurvePage() {\n  const wrap = document.getElementById('curvePageContent');\n  if (!wrap) return;\n\n  // Show curve for all active drugs that have enough data\n  const drugsToShow = ST.active.filter(k => {\n    const logs = (ST.logs||[]).filter(e=>e.drug===k&&e.elapsedH!=null);\n    return logs.length >= 2;\n  });\n\n  if (!drugsToShow.length) {\n    wrap.innerHTML = `<div style=\"color:var(--ink-3);text-align:center;padding:40px 0;font-size:0.9em;line-height:1.6;\">\n      Log at least 2 timed entries for any drug to see your curve.\n    <\u002Fdiv>`;\n    return;\n  }\n\n  wrap.innerHTML = drugsToShow.map(k => curveCardHTML(k)).join('');\n}\n\nfunction curveCardHTML(drugKey) {\n  const d = DRUGS[drugKey];\n  const dd = getDrugForDisplay(drugKey);\n  const logs = (ST.logs||[]).filter(e=>e.drug===drugKey&&e.elapsedH!=null&&e.elapsedH>=0);\n  const { zones: effectiveZones, adapted, curve } = getEffectiveZones(drugKey);\n  const baseZones = drugKey === 'remeron' ? getRemeronZones() : (d.zones || []);\n\n  // ── Build SVG timeline showing default vs personal curve ──────────────────\n  const W = 340, H = 110, PAD_L = 28, PAD_R = 12, PAD_T = 14, PAD_B = 28;\n  const PLOT_W = W - PAD_L - PAD_R;\n  const PLOT_H = H - PAD_T - PAD_B;\n  const maxHr = Math.min(Math.max(...baseZones.map(z=>z.end===Infinity?z.start+2:z.end), 12), 16);\n\n  const xScale = h => PAD_L + (h / maxHr) * PLOT_W;\n  const yScale = v => PAD_T + PLOT_H - ((v - 1) / 9) * PLOT_H;\n\n  // Sample the zone power as a curve\n  function zonesToCurve(zones) {\n    const pts = [];\n    const powerMap = {'—':1, 'Low':2, 'Low–Moderate':3, 'Moderate':4, 'Moderate–High':5,\n      'High':7, 'Very High':8, 'Peak':9, 'Fading':4, 'Building':3};\n    zones.forEach(z => {\n      const v = powerMap[z.power] || (z.peak ? 8 : z.second ? 6 : 2);\n      const start = z.start;\n      const end = z.end === Infinity ? z.start + 2 : z.end;\n      pts.push([start, v], [end, v]);\n    });\n    return pts;\n  }\n\n  function ptsToPath(pts) {\n    if (!pts.length) return '';\n    return pts.map(([x,y],i) => `${i===0?'M':'L'}${xScale(x).toFixed(1)},${yScale(y).toFixed(1)}`).join(' ');\n  }\n\n  const defaultPts = zonesToCurve(baseZones);\n  const personalPts = adapted ? zonesToCurve(effectiveZones) : null;\n\n  // Scatter dots from actual logs\n  const scatterDots = logs.slice(0, 60).map(e => {\n    const cx = xScale(e.elapsedH).toFixed(1);\n    const cy = yScale(e.feel).toFixed(1);\n    const col = feelColor(e.feel, dd.color);\n    return `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"3\" fill=\"${col}\" opacity=\"0.55\"/>`;\n  }).join('');\n\n  // Hour ticks\n  const ticks = [];\n  for (let h = 0; h <= maxHr; h += 2) {\n    const x = xScale(h).toFixed(1);\n    ticks.push(`<line x1=\"${x}\" y1=\"${PAD_T}\" x2=\"${x}\" y2=\"${PAD_T+PLOT_H}\" stroke=\"#f0f0f0\" stroke-width=\"1\"/>`);\n    ticks.push(`<text x=\"${x}\" y=\"${H-6}\" text-anchor=\"middle\" font-size=\"8\" fill=\"#bbb\">${h}h<\u002Ftext>`);\n  }\n\n  // Y axis labels\n  const yLabels = [1,4,7,10].map(v =>\n    `<text x=\"${PAD_L-4}\" y=\"${yScale(v)+3}\" text-anchor=\"end\" font-size=\"8\" fill=\"#ccc\">${v}<\u002Ftext>`\n  ).join('');\n\n  // Personal peak marker\n  let peakMarker = '';\n  if (curve) {\n    const px = xScale(curve.personalPeakH).toFixed(1);\n    peakMarker = `<line x1=\"${px}\" y1=\"${PAD_T}\" x2=\"${px}\" y2=\"${PAD_T+PLOT_H}\" stroke=\"${dd.color}\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\" opacity=\"0.7\"/>\n      <text x=\"${px}\" y=\"${PAD_T-3}\" text-anchor=\"middle\" font-size=\"8\" fill=\"${dd.color}\" font-weight=\"bold\">your peak<\u002Ftext>`;\n  }\n\n  // Default peak marker\n  const peakZone = baseZones.find(z=>z.peak);\n  if (peakZone) {\n    const defaultPeakH = (peakZone.start + (peakZone.end===Infinity?peakZone.start+2:peakZone.end))/2;\n    const dpx = xScale(defaultPeakH).toFixed(1);\n    ticks.push(`<line x1=\"${dpx}\" y1=\"${PAD_T}\" x2=\"${dpx}\" y2=\"${PAD_T+PLOT_H}\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"2,3\" opacity=\"0.6\"/>`);\n  }\n\n  const svgContent = `\n    ${ticks.join('')}\n    ${yLabels}\n    ${scatterDots}\n    <path d=\"${ptsToPath(defaultPts)}\" stroke=\"#ddd\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\"/>\n    ${personalPts ? `<path d=\"${ptsToPath(personalPts)}\" stroke=\"${dd.color}\" stroke-width=\"2.5\" fill=\"none\" stroke-linejoin=\"round\" opacity=\"0.85\"/>` : ''}\n    ${peakMarker}\n  `;\n\n  // ── Stats summary ─────────────────────────────────────────────────────────\n  const shiftStr = curve\n    ? `Your peak runs <strong>${Math.round(Math.abs(curve.shift)*60)}min ${curve.shift>0?'later':'earlier'}<\u002Fstrong> than average`\n    : adapted ? 'Your timing matches the default curve closely' : `${logs.length} entries · ${6-logs.length} more to unlock calibration`;\n\n  const confStr = curve\n    ? `${Math.round(curve.confidence*100)}% confidence · ${curve.logCount} entries`\n    : '';\n\n  return `<div class=\"card\" style=\"margin-bottom:16px;padding:14px;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n      <div style=\"font-weight:bold;color:${dd.color};\">${dd.name}<\u002Fdiv>\n      ${curve ? `<div style=\"font-size:0.75em;color:#aaa;\">${confStr}<\u002Fdiv>` : ''}\n    <\u002Fdiv>\n\n    <!-- Legend -->\n    <div style=\"display:flex;gap:14px;margin-bottom:8px;font-size:0.76em;color:#888;\">\n      <span><svg width=\"20\" height=\"8\"><line x1=\"0\" y1=\"4\" x2=\"20\" y2=\"4\" stroke=\"#ddd\" stroke-width=\"2\"/><\u002Fsvg> Default<\u002Fspan>\n      ${adapted ? `<span><svg width=\"20\" height=\"8\"><line x1=\"0\" y1=\"4\" x2=\"20\" y2=\"4\" stroke=\"${dd.color}\" stroke-width=\"2.5\"/><\u002Fsvg> Yours<\u002Fspan>` : ''}\n      <span><svg width=\"10\" height=\"10\"><circle cx=\"5\" cy=\"5\" r=\"3\" fill=\"${dd.color}\" opacity=\"0.55\"/><\u002Fsvg> Your logs<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- SVG chart -->\n    <div class=\"curve-svg-wrap\">\n      <svg width=\"${W}\" height=\"${H}\" style=\"display:block;max-width:100%;\">\n        ${svgContent}\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <!-- Shift summary -->\n    <div style=\"font-size:0.84em;color:#555;margin-top:10px;padding-top:8px;border-top:1px solid #f0f0f0;\">\n      ${shiftStr}\n      ${curve && curve.logCount < 10 ? '<span style=\"color:#aaa;font-size:0.9em;\"> · still stabilizing<\u002Fspan>' : ''}\n    <\u002Fdiv>\n\n    <!-- Progress bar if not yet calibrated -->\n    ${!adapted && logs.length < 6 ? `<div style=\"margin-top:8px;\">\n      <div style=\"font-size:0.76em;color:#bbb;margin-bottom:3px;\">${logs.length}/6 entries to unlock calibration<\u002Fdiv>\n      <div style=\"height:4px;background:#eee;border-radius:2px;\"><div style=\"height:100%;width:${(logs.length/6*100).toFixed(0)}%;background:${dd.color};border-radius:2px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>` : ''}\n  <\u002Fdiv>`;\n}\n\n// ─── EXPORT ───────────────────────────────────────────────────────────────────\n\nfunction exportLog() {\n  const logs = ST.logs||[];\n  if (!logs.length) { alert('No log entries to export'); return; }\n  const csv = ['date,time,drug,zone,feel,tags,note,elapsed_hrs',\n    ...logs.map(e=>`\"${new Date(e.ts).toLocaleDateString()}\",\"${e.time}\",\"${e.drug}\",\"${e.zone}\",${e.feel},\"${e.tags.join(';')}\",\"${e.note||''}\",\"${e.elapsedH!=null?e.elapsedH.toFixed(2):''}\"`)\n  ].join('\\n');\n  const blob = new Blob([csv],{type:'text/csv'});\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'grindzone-log.csv';\n  a.click();\n}\n\n\n// ─── RENDER ALL ───────────────────────────────────────────────────────────────\nfunction renderAll() { renderNow(); renderTimeline(); renderZones(); renderLogBtn(); }\n\n// ─── TICKER ───────────────────────────────────────────────────────────────────\nlet _lastAppDay = todayKey();\n\nfunction startTicker() {\n  if(tickTimer) clearInterval(tickTimer);\n  tickTimer = setInterval(() => {\n    const currentDay = todayKey();\n    if (currentDay !== _lastAppDay) {\n      // Day rolled over at 3am — clear dose times and reset dashboard\n      _lastAppDay = currentDay;\n      onDayRollover();\n    }\n    renderNow();\n    renderTimeline();\n  }, 30000);\n}\n\nfunction onDayRollover() {\n  // Clear all dose times for the new day\n  ALL.forEach(k => { delete ST.doses[k]; });\n  save();\n  renderInput();\n  renderAll();\n  // Show a subtle banner that the day has reset\n  const ban = document.getElementById('nowBanner');\n  if (ban) {\n    ban.style.display = 'block';\n    ban.style.cssText = 'display:block;margin-bottom:12px;';\n    ban.innerHTML = `<div style=\"background:#f5f5f5;border:1px solid #ddd;border-radius:8px;padding:10px 13px;color:#888;font-size:0.9em;\">\n      🌅 New day — enter today's dose times to start tracking\n    <\u002Fdiv>`;\n    setTimeout(() => { if(ban.innerHTML.includes('New day')) renderNow(); }, 8000);\n  }\n}\n\n// ─── SHARE ────────────────────────────────────────────────────────────────────\nfunction genShareUrl() {\n  const p=new URLSearchParams();\n  ALL.forEach(k=>{if(ST.doses[k])p.set(k,ST.doses[k]);});\n  const base=window.location.href.split('?')[0];\n  const el=document.getElementById('shareUrl');\n  if(el) el.value=p.toString()?`${base}?${p}`:base;\n}\nfunction copyShare() {\n  const el=document.getElementById('shareUrl'); if(!el)return;\n  navigator.clipboard.writeText(el.value).then(()=>{\n    const c=document.getElementById('copyConfirm');\n    c.style.display='block'; setTimeout(()=>c.style.display='none',2000);\n  });\n}\nfunction loadFromUrl() {\n  const p=new URLSearchParams(window.location.search); let ch=false;\n  ALL.forEach(k=>{if(p.has(k)){ST.doses[k]=p.get(k);ch=true;}});\n  if(ch){ ST.lastDoseDay = todayKey(); save(); }\n}\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
